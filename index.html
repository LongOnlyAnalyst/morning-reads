const ITEMS=[{"title": "Higher fuel prices seep into core inflation", "source": "Dallas Fed Economics (Chudik, Kilian, Zhou)", "date": "2026-11-19", "min": 5, "url": "https://www.dallasfed.org/research/economics/2026/1119", "why": "Using a structural VAR plus daily-frequency estimators across 149 PCE components, the authors find this year's fuel shock, led by record diesel, added 20 to 60 basis points to 12-month core PCE inflation as of September. If fuel prices simply hold, that contribution fades by about 30 basis points by end-2027, a useful anchor for how much of sticky core is energy pass-through versus something the Fed has to fight.", "tags": ["inflation", "energy", "rates"], "paywall": false, "top": true, "listedOn": "2026-11-20"}, {"title": "Consumers Can Handle a Stock Crash", "source": "PIIE RealTime Economics (Jason Furman)", "date": "2026-11-17", "min": 13, "url": "https://www.piie.com/blogs/realtime-economics/2026/consumers-can-handle-stock-crash", "why": "Third in Furman's series on what an AI-bubble burst would do to the economy: households have spent only about 1 cent per dollar of recent stock gains, so a 25% market fall would cut consumption about 0.8% and GDP growth about 0.6 point over a year in his FRB/US runs. He also shows 2001 was the least consumer-driven postwar recession, which argues the wealth-effect channel is smaller than the market narrative assumes.", "tags": ["AI bubble", "macro", "financial stability"], "paywall": false, "top": true, "listedOn": "2026-11-20"}, {"title": "Clouds of Credit: Mapping the Financial Web Behind AI Compute", "source": "NBER Working Paper 36032 (Van Nieuwerburgh, Su)", "date": "2026-11-16", "min": 77, "url": "https://www.nber.org/papers/w36032", "why": "Maps the network of debt, leases and non-recourse project finance behind the AI compute buildout and calibrates a model in which debt funds nearly 60% of the coming expansion and firms overinvest relative to the social optimum. In a low-productivity state losses reach $16.8 trillion with 40% loss-given-default on debt, and contractual spillovers among the key firms account for about 30% of private losses; read the abstract and the network section if short on time.", "tags": ["AI credit", "financial stability", "private credit"], "paywall": false, "top": true, "listedOn": "2026-11-20"}, {"title": "Financial Stability Review, November 2026", "source": "European Central Bank (Financial Stability Review)", "date": "2026-11-18", "min": 145, "url": "https://www.ecb.europa.eu/press/financial-stability-publications/fsr/html/ecb.fsr202611~e03b919d36.en.html", "why": "The ECB's twice-yearly risk map says AI valuations rest on very ambitious earnings expectations while AI firms keep adding debt and circular financing makes real demand hard to gauge, with banks exposed mainly through their links to non-banks. Skip to Box 3 (debt financing of AI), Box 4 (big tech in the euro bond market), Box 6 (synthetic risk transfers) and Box 7 (hedge funds in sovereign repo) for the parts that matter most to AI credit and positioning; the full report is long.", "tags": ["financial stability", "AI credit", "non-banks"], "paywall": false, "listedOn": "2026-11-19"}, {"title": "Agentic inference capacity grew 4.6x in a year, versus 2.6x for compute capacity", "source": "Epoch AI Data Insight (Jason Li)", "date": "2026-11-18", "min": 4, "url": "https://epoch.ai/data-insights/agentic-inference-capacity-growth", "why": "Epoch estimates the installed base's capacity for long-context agentic inference grew 4.6x from Q2 2025 to Q2 2026 versus 2.6x for raw compute, with Blackwell parts supplying 74% of the added capacity and GB300 doing about 8x an H200 per GPU. It also expects that pace to slow because the next generation (Vera Rubin) adds only about 2.2x per GPU, which matters for how fast the AI capex being financed today turns into usable supply.", "tags": ["AI", "compute", "supply"], "paywall": false, "listedOn": "2026-11-19"}, {"title": "Does the Stock Market Stigmatize Banks that Borrow from the Fed?", "source": "NY Fed Liberty Street Economics (Fischl-Lanzoni, Hiti, Sarkar)", "date": "2026-11-17", "min": 6, "url": "https://libertystreeteconomics.newyorkfed.org/2026/11/does-the-stock-market-stigmatize-banks-that-borrow-from-the-fed/", "why": "Using bank stock betas to uninsured deposits, unrealized losses, cash and capital during March 2023, the authors find investors grew more sensitive to a bank's weaknesses after its first Discount Window loan but not after its first BTFP loan. It is direct evidence on why lender-of-last-resort design (face-value collateral, a new facility with no history) decides whether banks actually use the backstop in a run.", "tags": ["financial stability", "banks", "Fed facilities"], "paywall": false, "listedOn": "2026-11-19"}, {"title": "Wages Are Cooling, While Supercore Inflation Isn't", "source": "Richmond Fed Macro Minute (John O'Trakoun)", "date": "2026-11-17", "min": 4, "url": "https://www.richmondfed.org/research/national_economy/macro_minute/2026/wages_are_cooling_while_supercore_inflation_isnt", "why": "The 0.88 correlation between services wage growth and supercore PCE inflation from 2015 to 2024 has broken down, and O'Trakoun traces the gap to nonlabor inputs: PPI services inputs for services producers are up 5.5% year over year versus a 2.1% average in the 2010s. Because those costs are about as volatile as food prices, he argues the Fed may be able to look through elevated supercore readings, a useful lens for the rates path.", "tags": ["inflation", "rates", "macro"], "paywall": false, "listedOn": "2026-11-19"}, {"title": "The Agents Will Trade the Bonds", "source": "Matt Levine, Money Stuff (Bloomberg Opinion)", "date": "2026-11-17", "min": 15, "url": "https://www.bloomberg.com/opinion/newsletters/2026-11-17/the-agents-will-trade-the-bonds", "why": "Levine uses the BNY and Microsoft pilot, in which their AI agents haggled over the price of a Treasury bill under BNY's Agentic Negotiation Protocol while human traders approved and booked the trade, to ask what bond-market intermediation looks like when bots do the search and back-and-forth inside human-set limits. It is a short, sharp read on where dealer and buy-side market structure could go; only the opening is readable without a subscription.", "tags": ["market structure", "AI", "rates"], "paywall": true, "listedOn": "2026-11-18"}, {"title": "The Credit Market Lens: In a Slower AI Buildout, Who Captures the Scarcity Premium?", "source": "PIMCO (Lotfi Karoui, The Credit Market Lens)", "date": "2026-11-16", "min": 6, "url": "https://www.pimco.com/us/en/insights/the-credit-market-lens-in-a-slower-ai-buildout-who-captures-the-scarcity-premium", "why": "Karoui argues post-midterm permitting friction (about 45% of planned US data center capacity sits in states where restrictions could emerge, Texas a quarter of it) stretches the AI buildout rather than shrinking it, which slows issuance and should help existing hyperscaler-tenanted data center bonds tighten versus their tenants' senior debt. For leveraged infrastructure providers he says the scarcity premium may be outweighed by recontracting risk and GPU residual values, a useful split for anyone sizing AI credit exposure.", "tags": ["AI credit", "credit", "flows"], "paywall": false, "listedOn": "2026-11-18"}, {"title": "Connecting Stock Market to Labor Market During the AI Boom", "source": "San Francisco Fed Economic Letter 2026-33 (Kevin Lansing, Federico C. Nucera)", "date": "2026-11-16", "min": 9, "url": "https://www.frbsf.org/research-and-insights/publications/economic-letter/2026/11/connecting-stock-market-to-labor-market-during-ai-boom/", "why": "With the CAPE ratio at 40.5 in the third quarter, second only to the 2000 peak, the authors regress it on r-star, potential growth, the noncyclical unemployment rate and macro uncertainty and explain 89 percent of its variance since 1961. The noncyclical unemployment rate does most of the work and accounts for most of the post-2022 AI run-up, so a model without it implies much lower valuations, which is a useful frame for judging how fragile current multiples are.", "tags": ["AI", "valuations", "macro"], "paywall": false, "listedOn": "2026-11-17"}, {"title": "The Elasticity Business", "source": "The Diff (Byrne Hobart; free issue)", "date": "2026-11-16", "min": 15, "url": "https://www.thediff.co/archive/the-elasticity-business/", "why": "Hobart argues that supply and demand elasticity is not a constant, and that some of the best businesses, such as shale frackers with fast decline curves and cloud providers selling spot versus committed capacity, profit by adding elasticity to cyclical markets. The same free issue has a short section on Nvidia governance after Jensen Huang's exit, which ties the framework to the current compute cycle.", "tags": ["industry structure", "AI", "energy"], "paywall": false, "listedOn": "2026-11-17"}, {"title": "Decapit-ai-tion", "source": "Citadel Securities Some Macro Thoughts (Nohshad Shah)", "date": "2026-11-14", "min": 5, "url": "https://www.citadelsecurities.com/news-and-insights/macro-thoughts/decapit-ai-tion/", "why": "Shah separates demand for AI from the economics of producing it: CBRE data show North American data-centre supply up 33.7% with vacancy at 1.4% and 80% of new capacity preleased, which favors hyperscalers with operating compute as permitting and power tighten. He also weighs what Jensen Huang's exit means for NVIDIA's risk appetite and customer financing, and argues hot Q3 data keep a December hike live unless AI capex stalls.", "tags": ["AI", "positioning", "rates"], "paywall": false, "listedOn": "2026-11-20"}, {"title": "Macroeconomic effects of rare earth supply disruptions", "source": "VoxEU/CEPR (Bogmans, Jerez Osses, Miranda-Pinto, Natal; IMF staff)", "date": "2026-11-14", "min": 7, "url": "https://cepr.org/voxeu/columns/macroeconomic-effects-rare-earth-supply-disruptions", "why": "IMF staff build a production-network model with a rare-earth-augmented input-output table and find an 80 percent cut in rare earth imports would lower GDP by 1.8 percent in Japan, 1.5 percent in the US and 1.3 percent in Germany in the short run, with US auto output down about 9 percent. The key point is that network linkages make the US and Japan more exposed than simple value-added-at-risk measures suggest, and that the danger is concentrated in the first year before substitution kicks in.", "tags": ["supply chains", "commodities", "geopolitics"], "paywall": false, "listedOn": "2026-11-15"}, {"title": "Current Efforts Aren't Enough to Slow the AI Cyber Virus", "source": "Bridgewater Associates (Hudson Attar, Arham Habib)", "date": "2026-11-13", "min": 10, "url": "https://www.bridgewater.com/research-and-insights/current-efforts-arent-enough-to-slow-the-ai-cyber-virus", "why": "Bridgewater says it is managing money on a one-in-three chance of an economically destabilizing cyberattack within a year, citing its own incident tracker: zero-day exploits have roughly doubled since cyber-capable open-source models shipped and time from disclosure to exploitation has fallen from a month to 11 days. A rare buy-side attempt to quantify AI-driven cyber risk as a market tail, with data on why defenders are losing the patching race.", "tags": ["AI", "tail risk", "cyber"], "paywall": false, "listedOn": "2026-11-19"}, {"title": "A Banker's Guide to Anthropic", "source": "Net Interest (Marc Rubinstein)", "date": "2026-11-13", "min": 8, "url": "https://www.netinterest.co/p/a-bankers-guide-to-anthropic", "why": "Rubinstein treats the Anthropic IPO, due this week, as a credit event: a listing opens the door to an investment-grade rating and the $13 trillion IG bond market, and its new $15 billion revolver drops its collateral once two agencies call it investment grade, while Broadcom has stood behind more than $70 billion of debt for hardware leased to Anthropic. The free preview lays out the rating fight (KBRA at BB+, Blackstone expecting BB); the paid section covers how roughly $1 trillion of commitments get funded and who is lending (read time estimated).", "tags": ["AI credit", "credit ratings", "IPO"], "paywall": true, "listedOn": "2026-11-15"}, {"title": "Financial Stability Report, November 2026", "source": "Federal Reserve Board (Financial Stability Report, PDF)", "date": "2026-11-13", "min": 94, "url": "https://www.federalreserve.gov/publications/files/financial-stability-report-20261113.pdf", "why": "The Board's twice-yearly risk review puts advanced-computing debt issuance at more than $680 billion through October, about 31 percent of nonfinancial investment-grade issuance versus under 6 percent in 2023, with the mix shifting toward private credit, structured credit, project finance and off-balance-sheet leases and guarantees. It also finds hedge fund leverage at its highest since data began in 2013 and AI as the risk market contacts cited most often in the salient-risk survey; start with Box 2.2 on data-center leverage and Box 5.1.", "tags": ["AI credit", "financial stability", "positioning"], "paywall": false, "listedOn": "2026-11-17"}, {"title": "Artificial Intelligence and the U.S. Economy: Current Evidence", "source": "Federal Reserve Board FEDS Working Paper 2026-074 (Carollo, Crane, Garcia Molina, Nichols)", "date": "2026-11-12", "min": 40, "url": "https://www.federalreserve.gov/econres/feds/artificial-intelligence-and-the-us-economy-current-evidence.htm", "why": "Board staff pull together the hard data on the AI boom: the surge in data-centre structures and chip investment, adoption rates by firms and consumers, AI labs' growing share of software output, and price spikes in direct inputs like memory chips. Their read is that labor-market and productivity effects are still small, and that the recent productivity pickup mostly reflects factors that predate generative AI, a sober baseline against the boom narrative.", "tags": ["AI", "macro", "productivity"], "paywall": false, "listedOn": "2026-11-20"}, {"title": "Who Owns the Risk in Credit?", "source": "BNY iFlow Special Report (David Tam)", "date": "2026-11-12", "min": 7, "url": "https://www.bny.com/corporate/global/en/solutions/platforms/execution-services/iflow/special-reports/who-owns-the-risk-in-credit.html", "why": "Using iFlow holdings data, BNY shows US corporate bonds outstanding grew about 8 to 9% since early 2025 to roughly $12.2 to $12.4 trillion, mostly hyperscaler-driven IG issuance held by insurers, while HY and especially CCC lean on flow-sensitive funds and hedge funds. The point is that a credit shock would travel through ownership, fund outflows and forced selling (fallen angels hitting mandate-bound mutual funds and ETFs), not just spreads.", "tags": ["positioning", "flows", "AI credit"], "paywall": false, "listedOn": "2026-11-18"}, {"title": "Non-accrual data suggest LMEs may be masking BDC stress", "source": "PitchBook LCD (Sebastian Kian)", "date": "2026-11-12", "min": 6, "url": "https://pitchbook.com/news/articles/non-accrual-data-suggest-lmes-may-be-masking-bdc-stress", "why": "Using ten years of filings from 245 BDCs as a proxy for private credit, LCD finds a record 362 borrowers on non-accrual and $9.7 billion of non-accrual debt, up 64 percent year on year, even though the headline rate is only 1.9 percent (1.5 percent excluding Medallia). Its point is that amend-and-extend deals, PIK toggles and private liability management keep troubled loans accruing, so stress shows up first in PIK income and markdowns rather than the reported rate.", "tags": ["private credit", "financial stability"], "paywall": false, "listedOn": "2026-11-17"}, {"title": "A Layman Thinks About AI", "source": "Oaktree Capital, Memos from Howard Marks", "date": "2026-11-11", "min": 28, "url": "https://www.oaktreecapital.com/insights/memo/a-layman-thinks-about-ai", "why": "Marks works through eleven questions on AI, from who captures the profits and the data-center outlook to whether markets are dangerously reliant on a single factor and whether it is a bubble. The credit section is the most useful part: citing Goldman, he puts AI-related debt issuance near $600 billion globally this year, with about $400 billion in US investment grade (over a fifth of supply and around 12% of the Bloomberg USD IG index), and roughly $1 trillion a year of new capital still needed.", "tags": ["AI credit", "credit", "AI"], "paywall": false, "listedOn": "2026-11-12"}];
const K="mr-read:";const isRead=u=>localStorage.getItem(K+u)!==null;

const RK="mr-rate:";const getR=u=>{try{return JSON.parse(localStorage.getItem(RK+u))}catch(e){return null}};
function setR(it,v){const c=getR(it.url);if(c&&c.rating===v)localStorage.removeItem(RK+it.url);else localStorage.setItem(RK+it.url,JSON.stringify({rating:v,ratedAt:new Date().toISOString(),url:it.url,title:it.title,source:it.source,published:it.date,tags:it.tags||[]}))}
function collect(){const seen={},out=[];const add=(u,meta)=>{if(seen[u])return;const r=getR(u),ra=localStorage.getItem(K+u);if(!r&&ra===null)return;seen[u]=1;const m=meta||r||{};out.push({url:u,title:m.title||null,source:m.source||null,published:m.date||m.published||null,read:ra!==null,readAt:ra,rating:r?r.rating:null,ratedAt:r?r.ratedAt:null,tags:m.tags||[]})};
