<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Morning Reads</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon.ico" sizes="any"><meta name="theme-color" content="#141311">
<style>
:root{--bg:#141311;--tx:#ece7dd;--sub:#b9b2a6;--mut:#857e72;--line:#2c2924;--acc:#c2a36b}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.6 "Iowan Old Style","Charter","Bitstream Charter",Georgia,"Times New Roman",serif;-webkit-font-smoothing:antialiased}
.sans,.meta,.tabs,.kick,.upd,h2{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Arial,sans-serif}
main{max-width:720px;margin:0 auto;padding:72px 28px 96px}
header{border-bottom:1px solid var(--line);padding-bottom:22px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
h1{margin:0;font-weight:400;font-size:2.6rem;letter-spacing:-.01em;line-height:1.1}
.upd{color:var(--mut);font-size:.78rem;letter-spacing:.02em;margin-top:10px}
.tabs{display:flex;gap:22px;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.tabs button{background:none;border:0;padding:0 0 3px;color:var(--mut);cursor:pointer;font:inherit;letter-spacing:inherit;border-bottom:1px solid transparent}
.tabs button.on{color:var(--tx);border-bottom-color:var(--acc)}
h2{font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin:56px 0 0}
.it{display:grid;grid-template-columns:1fr auto;gap:0 28px;padding:28px 0;border-bottom:1px solid var(--line)}
.it a{color:var(--tx);text-decoration:none;font-size:1.32rem;line-height:1.3;font-weight:400}
.it.top a{font-size:1.6rem;line-height:1.25}
.it a:hover{color:var(--acc)}
.meta{color:var(--mut);font-size:.78rem;letter-spacing:.02em;margin:10px 0 12px}
.meta .src{color:var(--sub)}.pw{color:var(--acc)}
.why{margin:0;color:var(--sub);font-size:1rem;line-height:1.62}
.ctl{padding-top:6px}
.ck{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:1px solid var(--mut);border-radius:2px;margin:0;cursor:pointer;background:none;display:block}
.ck:hover{border-color:var(--acc)}.ck:checked{background:var(--acc);border-color:var(--acc)}
.undo{background:none;border:0;border-bottom:1px solid var(--mut);color:var(--sub);padding:0;cursor:pointer;font:500 .75rem/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.undo:hover{color:var(--acc);border-color:var(--acc)}
.empty{color:var(--mut);padding:28px 0;margin:0;font-style:italic}
@media(max-width:560px){main{padding:40px 20px 72px}h1{font-size:2rem}.it.top a{font-size:1.32rem}.it a{font-size:1.16rem}.it{gap:0 18px;padding:24px 0}h2{margin-top:44px}}
</style></head><body><main>
<header><div><h1>Morning Reads</h1><div class="upd">Updated Oct 29, 2026, 8:55 AM CT</div></div>
<nav class="tabs"><button id="tU" class="on">Unread</button><button id="tR">Read</button></nav></header>
<div id="U"><h2>Today</h2><div id="top"></div><h2>More to read</h2><div id="more"></div></div>
<div id="R" hidden><h2>Read</h2><div id="read"></div></div>
</main><script>
const ITEMS=[{"top": true, "title": "October Update: Fundamentals in Focus", "source": "Citadel Securities (Scott Rubner)", "date": "2026-10-14", "min": 10, "url": "https://www.citadelsecurities.com/news-and-insights/global-market-intelligence/october-update/", "why": "MU and NVDA alone account for 36% of expected S&P 500 Q3 EPS growth, retail bond-ETF buying is at a record pace, and single-stock vs. index implied vol sits at 3.1x with 1-month implied correlation in the 1st percentile since 2006. It is the best flow and positioning read for this week's concentrated earnings window.", "listedOn": "2026-10-29"}, {"top": true, "title": "Government Bonds' Safe-Haven Property and Inflationary Pressures", "source": "Federal Reserve FEDS Notes", "date": "2026-10-16", "min": 11, "url": "https://www.federalreserve.gov/econres/notes/feds-notes/government-bonds-safe-haven-property-and-inflationary-pressures-20261016.html", "why": "When the Middle East shock hit, long-dated sovereign bonds fell alongside equities. Fed staff argue that whether bonds hedge depends on the type of shock and on inflation dynamics, which matters directly for stock-bond correlation and 60/40 hedging assumptions.", "listedOn": "2026-10-29"}, {"top": true, "title": "Building AI on credit: structures and spillovers", "source": "BIS Bulletin No 140", "date": "2026-10-27", "min": 15, "url": "https://www.bis.org/publications/bulletin-140-building-ai-credit-structures-and-spillovers.pdf", "why": "BIS maps how AI capex is increasingly funded with long-term debt and off-balance-sheet vehicles whose ratings lean on commitments from a few large firms, with banks lending to both the vehicles and their investors. It measures spillovers on AI-financing news days in 2026, the clearest official look yet at where AI credit risk sits.", "listedOn": "2026-10-29"}, {"title": "Do Markets Have the Bandwidth for the Midterms?", "source": "Man Group – Views from the Floor", "date": "2026-10-27", "min": 5, "url": "https://www.man.com/insights/views-from-the-floor-2026-27-Oct", "why": "S&P options price November 4 at about 1.2x a normal day's volatility, which assumes a quick result. Man argues a long count or unrest is unpriced, and that election baskets carry no semiconductor bets this cycle.", "listedOn": "2026-10-29"}, {"title": "Chokepoints in global supply chains: lessons from rare earths and hard disk drives", "source": "BIS Bulletin No 139", "date": "2026-10-26", "min": 13, "url": "https://www.bis.org/publications/bulletin-139-chokepoints-global-supply-chains-lessons-rare-earths-and-hard-disk-drives", "why": "A companion to Bulletin 138 that uses two concrete cases, rare earths and hard disk drives, to show how concentrated suppliers spread disruptions. It helps when thinking about AI hardware and critical-minerals exposure.", "listedOn": "2026-10-29"}, {"title": "The Mideast energy shock's next phase", "source": "BlackRock Investment Institute (PDF)", "date": "2026-10-26", "min": 12, "url": "https://www.blackrock.com/us/individual/literature/market-commentary/weekly-investment-commentary-en-us-20261026-the-mideast-energy-shocks-next-phase.pdf", "why": "BlackRock argues the binding constraint has moved from crude supply to refining and shipping, so returns are accruing downstream to refiners and tankers. It expects one more Fed hike by year-end but sees market pricing as too hawkish.", "listedOn": "2026-10-29"}, {"title": "The End of the Internet", "source": "Stratechery (free weekly article; paywall site)", "date": "2026-10-26", "min": 13, "url": "https://stratechery.com/2026/the-end-of-the-internet/", "paywall": true, "why": "Thompson starts from the PHP remote-code-execution bug and asks what AI agents and security pressure mean for the open web. This week's free article is the full piece, not a teaser.", "listedOn": "2026-10-29"}, {"title": "The \"let-it-rip\" camp is wrong on AI (The Economist, by Bar Dea & Jensen)", "source": "Bridgewater", "date": "2026-10-26", "min": 9, "url": "https://www.bridgewater.com/_document/the-economist-the-let-it-rip-camp-is-wrong-on-ai?id=000001a1-8267-ddc1-aba3-bef710120000", "why": "Bridgewater's CEO and co-CIO argue for government-led AI regulation and estimate AI could displace almost a fifth of U.S. jobs. It is an opinion piece rather than data-heavy research, but it shows how a major macro allocator is framing AI policy risk.", "listedOn": "2026-10-29"}, {"title": "Capital Wars", "source": "Net Interest (Marc Rubinstein)", "date": "2026-10-23", "min": 10, "url": "https://www.netinterest.co/p/capital-wars", "paywall": true, "why": "Rubinstein contrasts how SpaceX's $85.7bn IPO locked in funding with CoreWeave's rising cost of debt as AI capex outruns operating cash flow. Only the opening is free, so it is labeled paywall.", "listedOn": "2026-10-29"}, {"title": "Ripples in the Reserve Pool: Liquidity Signals from the Fed Funds Market", "source": "Federal Reserve FEDS Notes", "date": "2026-10-16", "min": 9, "url": "https://www.federalreserve.gov/econres/notes/feds-notes/ripples-in-the-reserve-pool-unveiling-liquidity-signals-from-the-federal-funds-market-20261016.html", "why": "Fed funds trades between banks, separated from non-bank arbitrage flow, still give real-time signals about how reserves are distributed under an ample-reserves regime. This is relevant to balance-sheet runoff and to spotting funding stress early.", "listedOn": "2026-10-29"}, {"title": "Introducing Private Credit into the Financial Accounts of the United States", "source": "Federal Reserve FEDS Notes", "date": "2026-10-16", "min": 21, "url": "https://www.federalreserve.gov/econres/notes/feds-notes/introducing-private-credit-into-the-financial-accounts-of-the-united-states-20261016.html", "why": "For the first time, the Fed breaks out private credit loans and the vehicles that originate them in the Z.1 Financial Accounts. That gives an official baseline for the size of private credit and for who funds it.", "listedOn": "2026-10-29"}, {"title": "Risk and Safety, in the Economy and Life (Asness & Schrager)", "source": "City Journal / Manhattan Institute", "date": "2026-10-16", "min": 26, "url": "https://www.city-journal.org/article/allison-schrager-worth-the-risk-cliff-asness", "why": "This is a transcript of Cliff Asness in conversation with Allison Schrager about how the price of safety rose in the zero-rate era. It is a long but thoughtful read on risk aversion, not market calls.", "listedOn": "2026-10-29"}, {"title": "Chokepoint disruptions and their macroeconomic consequences", "source": "BIS Bulletin No 138", "date": "2026-10-15", "min": 13, "url": "https://www.bis.org/publications/bulletin-138-chokepoint-disruptions-and-their-macroeconomic-consequences", "why": "BIS finds substitution and inventories have mostly cushioned output after supply-chain chokepoint shocks, but at the cost of higher input prices. That framing is relevant to energy-shock inflation persistence.", "listedOn": "2026-10-29"}, {"title": "The Rise of Semiliquid Funds for Retail Investors", "source": "Federal Reserve FEDS Notes", "date": "2026-10-14", "min": 17, "url": "https://www.federalreserve.gov/econres/notes/feds-notes/the-rise-of-semiliquid-funds-for-retail-investors-20261014.html", "why": "Interval and tender-offer funds are expanding as managers turn to retail money for private markets while some institutions hit their allocation caps. The note looks at the liquidity mismatch behind redemption gates.", "listedOn": "2026-10-29"}, {"title": "Upgrading U.S. Treasuries to lock in income", "source": "BlackRock Investment Institute (PDF)", "date": "2026-10-12", "min": 12, "url": "https://www.blackrock.com/us/individual/literature/market-commentary/weekly-investment-commentary-en-us-20261012-upgrading-us-treasuries-to-lock-in-income.pdf", "why": "BII drops a Treasury underweight it has mostly held for six years, favoring short-dated bonds, and cuts U.S. equities to neutral. It includes a term-premium decomposition of the 5% 10-year yield.", "listedOn": "2026-10-29"}, {"title": "Capital, Costs", "source": "Citadel Securities Macro Thoughts", "date": "2026-10-10", "min": 3, "url": "https://www.citadelsecurities.com/news-and-insights/macro-thoughts/capital-costs/", "why": "The rise in global yields is split into three drivers: tighter policy, a real-growth repricing visible in 5y5y, and AI financing competing for duration. Of roughly $500bn in AI-related debt, hyperscalers account for less than half, and the high-grade long-dated supply is a headwind for government bonds.", "listedOn": "2026-10-29"}, {"title": "Beyond the Current Account: U.S. Financial Flows and Global Imbalances", "source": "Federal Reserve FEDS Notes", "date": "2026-10-09", "min": 16, "url": "https://www.federalreserve.gov/econres/notes/feds-notes/beyond-the-current-account-u-s-financial-flows-and-global-imbalances-20261009.html", "why": "Fed staff look at U.S. imbalances through capital flows and investment positions rather than trade balances, showing how the deficit is financed and where adjustment risk sits. It is useful background for the debate over dollar and Treasury demand.", "listedOn": "2026-10-29"}, {"title": "October: The Q4 Reload", "source": "Citadel Securities (Scott Rubner)", "date": "2026-10-01", "min": 11, "url": "https://www.citadelsecurities.com/news-and-insights/global-market-intelligence/october-the-q4-reload/", "why": "The setup note behind the October Update: September cleared out leverage, retail and CTA length, and valuations compressed. Buybacks, earnings and seasonality return as sources of demand, and a gap is opening between the S&P 500 and the average stock.", "listedOn": "2026-10-29"}, {"title": "Circular relationships among AI firms", "source": "BIS Bulletin No 137", "date": "2026-10-01", "min": 13, "url": "https://www.bis.org/publications/bulletin-137-circular-relationships-among-ai-firms", "why": "From 2021 to 2025, 55% of investment into AI firms came from other AI firms, and 46% of AI-to-AI deal value also involved supply-chain ties. That puts numbers on the vendor-financing loop critics point to in the AI buildout.", "listedOn": "2026-10-29"}, {"title": "Risks and Opportunities in the Fog of the Credit Cycle", "source": "Man Group", "date": "2026-09-30", "min": 8, "url": "https://www.man.com/insights/risks-and-opportunities-in-the-fog-of-the-credit-cycle", "why": "Man describes a dispersion cycle rather than broad deterioration: direct-lending non-accruals rose to 1.73%, CCC/BB spread ratios are at the 98th percentile, and hyperscaler IG spreads near 140bp are about double early-2025 levels. It also shows that when the 10-year was above 5.25%, 12-month global IG returns were positive in every observation.", "listedOn": "2026-10-29"}];
const K="mr-read:";const isRead=u=>localStorage.getItem(K+u)!==null;
const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fd=s=>{const[y,m,d]=s.split("-").map(Number);return M[m-1]+" "+d+", "+y};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function card(it,top,readMode){const d=document.createElement("article");d.className="it"+(top?" top":"");
d.innerHTML='<div><a target="_blank" rel="noopener" href="'+esc(it.url)+'">'+esc(it.title)+'</a>'+
'<div class="meta"><span class="src">'+esc(it.source)+'</span> &middot; '+fd(it.date)+' &middot; '+it.min+' min'+(it.paywall?' &middot; <span class="pw">Paywall</span>':'')+'</div><p class="why">'+esc(it.why)+'</p></div>'+
'<div class="ctl">'+(readMode?'<button class="undo">Undo</button>':'<input class="ck" type="checkbox" aria-label="Mark read" title="Mark read">')+'</div>';
if(readMode)d.querySelector("button").onclick=()=>{localStorage.removeItem(K+it.url);render()};
else d.querySelector("input").onchange=()=>{localStorage.setItem(K+it.url,new Date().toISOString());render()};return d}
function render(){const un=ITEMS.filter(i=>!isRead(i.url));const tops=un.filter(i=>i.top),rest=un.filter(i=>!i.top);
while(tops.length<3&&rest.length)tops.push(rest.shift());
const T=document.getElementById("top"),Mo=document.getElementById("more"),R=document.getElementById("read");T.innerHTML=Mo.innerHTML=R.innerHTML="";
tops.forEach(i=>T.appendChild(card(i,true)));rest.forEach(i=>Mo.appendChild(card(i,false)));
const rd=ITEMS.filter(i=>isRead(i.url)).sort((a,b)=>localStorage.getItem(K+b.url).localeCompare(localStorage.getItem(K+a.url)));rd.forEach(i=>R.appendChild(card(i,false,true)));
if(!tops.length)T.innerHTML='<p class="empty">All caught up.</p>';if(!rest.length)Mo.innerHTML='<p class="empty">Nothing else queued.</p>';if(!rd.length)R.innerHTML='<p class="empty">Nothing marked read yet.</p>';
document.getElementById("tU").textContent="Unread "+un.length;document.getElementById("tR").textContent="Read "+rd.length}
function tab(r){document.getElementById("U").hidden=r;document.getElementById("R").hidden=!r;document.getElementById("tU").classList.toggle("on",!r);document.getElementById("tR").classList.toggle("on",r)}
document.getElementById("tU").onclick=()=>tab(false);document.getElementById("tR").onclick=()=>tab(true);render();
</script></body></html>
