<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Morning Reads</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon.ico" sizes="any"><meta name="theme-color" content="#141311">
<style>
:root{--bg:#141311;--tx:#ece7dd;--sub:#b9b2a6;--mut:#857e72;--line:#2c2924;--acc:#c2a36b}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.6 "Iowan Old Style","Charter","Bitstream Charter",Georgia,"Times New Roman",serif;-webkit-font-smoothing:antialiased}
.sans,.meta,.tabs,.kick,.upd,h2{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Arial,sans-serif}
main{max-width:720px;margin:0 auto;padding:72px 28px 96px}
header{border-bottom:1px solid var(--line);padding-bottom:22px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
h1{margin:0;font-weight:400;font-size:2.6rem;letter-spacing:-.01em;line-height:1.1}
.upd{color:var(--mut);font-size:.78rem;letter-spacing:.02em;margin-top:10px}
.tabs{display:flex;gap:22px;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.tabs button{background:none;border:0;padding:0 0 3px;color:var(--mut);cursor:pointer;font:inherit;letter-spacing:inherit;border-bottom:1px solid transparent}
.tabs button.on{color:var(--tx);border-bottom-color:var(--acc)}
h2{font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin:56px 0 0}
.it{display:grid;grid-template-columns:1fr auto;gap:0 28px;padding:28px 0;border-bottom:1px solid var(--line)}
.it a{color:var(--tx);text-decoration:none;font-size:1.32rem;line-height:1.3;font-weight:400}
.it.top a{font-size:1.6rem;line-height:1.25}
.it a:hover{color:var(--acc)}
.meta{color:var(--mut);font-size:.78rem;letter-spacing:.02em;margin:10px 0 12px}
.meta .src{color:var(--sub)}.pw{color:var(--acc)}
.why{margin:0;color:var(--sub);font-size:1rem;line-height:1.62}
.ctl{padding-top:6px}
.ck{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:1px solid var(--mut);border-radius:2px;margin:0;cursor:pointer;background:none;display:block}
.ck:hover{border-color:var(--acc)}.ck:checked{background:var(--acc);border-color:var(--acc)}
.undo{background:none;border:0;border-bottom:1px solid var(--mut);color:var(--sub);padding:0;cursor:pointer;font:500 .75rem/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.undo:hover{color:var(--acc);border-color:var(--acc)}
.rate{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Arial,sans-serif;font-size:.72rem;letter-spacing:.06em;text-transform:lowercase;margin-top:12px;display:flex;gap:16px}
.rate button,.xp button{background:none;border:0;padding:0 0 2px;color:var(--mut);cursor:pointer;font:inherit;letter-spacing:inherit;border-bottom:1px solid transparent}
.rate button:hover,.xp button:hover{color:var(--sub)}.rate button.on{color:var(--acc);border-bottom-color:var(--acc)}
.xp{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Arial,sans-serif;font-size:.72rem;letter-spacing:.04em;color:var(--mut);display:flex;gap:18px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.xp .msg{color:var(--sub)}
.empty{color:var(--mut);padding:28px 0;margin:0;font-style:italic}
@media(max-width:560px){main{padding:40px 20px 72px}h1{font-size:2rem}.it.top a{font-size:1.32rem}.it a{font-size:1.16rem}.it{gap:0 18px;padding:24px 0}h2{margin-top:44px}}
</style></head><body><main>
<header><div><h1>Morning Reads</h1><div class="upd">Updated November 6, 2026, 5:47 AM CT</div></div>
<nav class="tabs"><button id="tU" class="on">Unread</button><button id="tR">Read</button></nav></header>

</main><script>
const ITEMS=[{"title": "Scenarios for future banking: implications for profitability, liquidity and solvency", "source": "BIS Working Paper No 1391 (Schmieder, Corrias, Wünsch)", "date": "2026-11-04", "min": 111, "url": "https://www.bis.org/publications/scenarios-future-banking-implications-profitability-liquidity-and-solvency", "why": "Using 9,000 banks across 150+ jurisdictions, the authors run four ten-year scenarios and find traditional banks still hold about three-quarters of system assets while tech-based models may contest roughly 40% of the revenue pool, raising earnings volatility as fees replace NII and digital channels shorten the path from deposit outflow to capital pressure. Supervisory priorities that hold in every scenario: reassess deposit-outflow assumptions, harden third-party operational resilience, treat weak earnings as a solvency risk, and improve data on emerging models (landing-page summary is short; full PDF is 57 pages).", "tags": ["financial stability", "banks", "regulation"], "top": true, "listedOn": "2026-11-06"}, {"title": "November: The Setup Improves", "source": "Citadel Securities Global Market Intelligence (Scott Rubner)", "date": "2026-11-04", "min": 9, "url": "https://www.citadelsecurities.com/news-and-insights/global-market-intelligence/november-the-setup-improves/", "why": "Rubner's post-election flows update: retail has bought US equities for 22 straight sessions (a record $251B year to date), buyback blackouts are lifting against $1.5T of authorizations, and CTA positioning has fallen to -3.3 standard deviations. He pairs that with semis trading at their widest discount to the S&P since 2018 despite rising estimates, making a concrete demand-side case for a year-end rebuild.", "tags": ["flows", "positioning", "market structure"], "paywall": false, "top": true, "listedOn": "2026-11-05"}, {"title": "Houston, Do We Have A Problem?", "source": "Citadel Securities Global Macro Strategy (Frank Flight)", "date": "2026-11-05", "min": 10, "url": "https://www.citadelsecurities.com/news-and-insights/global-macro-strategy/houston-do-we-have-a-problem/", "why": "Flight reads the midterm backlash against data centres (opposed in at least 39 of 45 local ballot initiatives, with ~45 GW of projects at risk in Texas, Ohio, Pennsylvania and Georgia) as a near-term constraint on AI infrastructure, not a collapse in aggregate investment given capital's mobility. He maps a Peak Capex rotation out of memory, neoclouds and energy into hyperscalers with energised compute, argues rates get a cleaner lower-yield impulse from slower financing demand, and flags that three-month option-implied odds of Brent above $120 have more than halved since late October as midterms may catalyse an Iran settlement.", "tags": ["AI credit", "positioning", "rates"], "paywall": false, "top": true, "listedOn": "2026-11-06"}, {"title": "Financial Predictionization", "source": "Matt Levine, Money Stuff (Bloomberg Opinion)", "date": "2026-11-05", "min": 16, "url": "https://www.bloomberg.com/opinion/newsletters/2026-11-05/financial-predictionization", "why": "Levine argues the interesting part of 'tokenized real estate' was never the blockchain wrapper—REITs already fractionalize buildings—but the broader push to turn illiquid claims into continuously priced forecast markets. Also covers black-swan funds, data-centre delays and how law firms price billable hours, continuing his recent run on prediction-market plumbing.", "tags": ["market structure", "prediction markets"], "paywall": true, "listedOn": "2026-11-06"}, {"title": "The U.S. Oil Sector's Role in Restraining Prices", "source": "NY Fed Liberty Street Economics (Thomas Klitgaard)", "date": "2026-11-05", "min": 9, "url": "https://libertystreeteconomics.newyorkfed.org/2026/11/the-u-s-oil-sectors-role-in-restraining-prices/", "why": "Klitgaard shows the Middle East supply shock was buffered first by a pre-conflict global oversupply built largely by the U.S. fracking boom (U.S. output 8 to 21 mb/d from 2010–25, 70% of the global gain) and then by U.S. SPR and commercial inventory draws that filled about half the Q2 global gap. U.S. stockpiles stopped falling in July, so the ongoing shortfall is now being absorbed by inventory draws elsewhere, notably China, which frames the two paths for prices depending on whether Middle East output returns.", "tags": ["energy", "commodities", "macro"], "listedOn": "2026-11-06"}, {"title": "How Market Position Shapes Credit Card Interest Rates", "source": "NY Fed Liberty Street Economics (Herkenhoff, Morelli)", "date": "2026-11-04", "min": 7, "url": "https://libertystreeteconomics.newyorkfed.org/2026/11/how-market-position-shapes-credit-card-interest-rates/", "why": "Using OCC data on 14 million newly issued cards across 960 segmented markets, the authors show lenders pass through less of a funding-cost decline where they hold a large market share. It is a clean look at how monetary policy transmission to consumer credit depends on lender market power, not just borrower risk.", "tags": ["banks", "consumer credit", "rates"], "paywall": false, "listedOn": "2026-11-05"}, {"title": "The Midterm Predictions Were Good", "source": "Matt Levine, Money Stuff (Bloomberg Opinion)", "date": "2026-11-04", "min": 18, "url": "https://www.bloomberg.com/opinion/newsletters/2026-11-04/the-midterm-predictions-were-good", "why": "Levine argues election-night prediction markets (about $2.5 billion of midterm volume on Kalshi) are a genuinely good consumer product, big enough to reward accuracy but not big enough to swamp the elections, and that their core problem is capturing value from large, infrequent positive externalities. Also covers quant code theft and buying stock in college athletes.", "tags": ["prediction markets", "market structure"], "paywall": true, "listedOn": "2026-11-05"}, {"title": "Funding markets getting tighter", "source": "BNY iFlow Short Thoughts (John Velis)", "date": "2026-11-03", "min": 4, "url": "https://www.bny.com/corporate/global/en/solutions/platforms/execution-services/iflow/short-thoughts/funding-markets-getting-tighter.html", "why": "TGCR and SOFR traded above IORB at October month-end, the tightest of the year, as net bill issuance jumped about $260bn, the TGA topped $1tn and reserves fell under $2.9tn. BNY expects the NY Fed to resume reserve management purchases within about a week and flags a repeat squeeze in Q1 2027 if Treasury's $800bn borrowing comes mostly via bills.", "tags": ["repo", "flows", "market structure"], "listedOn": "2026-11-03"}, {"title": "How Much Should Anthropic Pop?", "source": "Matt Levine, Money Stuff (Bloomberg Opinion)", "date": "2026-11-03", "min": 15, "url": "https://www.bloomberg.com/opinion/newsletters/2026-11-03/how-much-should-anthropic-pop", "why": "Levine asks whether offshore pre-IPO perpetual futures on Anthropic, which have no claim on the shares and no arbitrage link to them, can still say something real about the IPO price. His answer leans on how well-calibrated prediction markets have turned out to be, a useful lens on a new corner of equity capital markets plumbing.", "tags": ["market structure", "IPOs", "prediction markets"], "paywall": true, "listedOn": "2026-11-04"}, {"title": "How Do Banking Supervisors Deal with Failing Banks?", "source": "NY Fed Liberty Street Economics (Correia, Luck, Verner)", "date": "2026-11-02", "min": 8, "url": "https://libertystreeteconomics.newyorkfed.org/2026/11/how-do-banking-supervisors-deal-with-failing-banks/", "why": "Using every commercial bank exam from 2000 to 2023, the authors show modern bank failures are supervisory decisions, not runs: only 28 of 557 failures since 2000 happened on a day other than Friday, and nearly 3 of the typical 8-point equity drop before failure comes from exam-driven call report revisions. A quasi-random assignment of strict examiners in 2008 shows the trade-off directly: stricter supervision cut FDIC resolution costs but tightened credit supply.", "tags": ["banks", "regulation"], "listedOn": "2026-11-02"}, {"title": "The $300 Billion Structured Notes Market Is Booming", "source": "Bloomberg Odd Lots (podcast episode, Nomura's Alex Micalizzi)", "date": "2026-11-02", "min": 45, "url": "https://www.youtube.com/watch?v=KMrvunHdpvQ", "why": "US structured note issuance is nearing $300bn a year, and the episode walks through how autocallables and worst-of notes bundle bank debt with short-vol derivatives. The useful part is the dealer side: how hedging those notes leaves banks long or short vega and gamma and can feed back into index volatility.", "tags": ["positioning", "derivatives", "flows"], "listedOn": "2026-11-03"}, {"title": "Catching the repricing wave: insights from daily online supermarket prices", "source": "ECB Blog (Osbat, Höynck, Maglione, Wieland)", "date": "2026-11-02", "min": 7, "url": "https://www.ecb.europa.eu/press/blog/date/2026/html/ecb.blog20261102~871cc494e2.en.html", "why": "Using the ECB's Daily Price Dataset, scraped supermarket prices classified by AI into HICP categories, the authors show the frequency of food price increases rose in March 2026 after the energy shock but then stabilised, unlike the broadening wave of 2022. That points to less state-dependent, nonlinear repricing this time, which matters for how aggressive central banks need to be.", "tags": ["inflation", "energy"], "listedOn": "2026-11-03"}, {"title": "Treasury Issuance and Dealer Balance Sheets", "source": "Federal Reserve FEDS Notes", "date": "2026-10-30", "min": 14, "url": "https://www.federalreserve.gov/econres/notes/feds-notes/treasury-issuance-and-dealer-balance-sheets-20261030.html", "why": "Using daily FR 2052a data on the eight largest GSIB dealers, the authors find dealer balance sheets grow about 21 cents per dollar of coupon issuance, with two-thirds coming from client repo financing that lingers well after the inventory bump fades. Issuance pushes Treasury desks closer to their VaR limits while buybacks pull them back, which is a direct read on how much more supply the market-making system can absorb.", "tags": ["market structure", "Treasuries", "repo"], "listedOn": "2026-11-01"}, {"title": "Evaluating New LinkedIn Labor Market Tightness Indicators", "source": "NY Fed Liberty Street Economics (Li, Topa, Weber)", "date": "2026-10-30", "min": 7, "url": "https://libertystreeteconomics.newyorkfed.org/2026/10/evaluating-new-linkedin-labor-market-tightness-indicators/", "why": "The NY Fed tests three new LinkedIn tightness gauges against JOLTS V/U and finds the Jobs per Jobseeker Index tracks V/U closely (0.73 correlation) and beats it at nowcasting and forecasting both CPI and ECI inflation. Because it arrives about a month before JOLTS, it is a timely labor-to-inflation signal worth watching while rates are this sensitive to wage data.", "tags": ["labor", "inflation", "macro"], "listedOn": "2026-11-02"}, {"title": "Tokenomics 2.0", "source": "Citadel Securities Global Macro Strategy (Frank Flight)", "date": "2026-10-28", "min": 6, "url": "https://www.citadelsecurities.com/news-and-insights/global-macro-strategy/tokenomics-2-0/", "why": "Token prices are down about 50% in six months and open-weight models are now 65-70% of routed volume, while B200 rental rates are up 27.5%, so frontier labs need roughly 2.55x more throughput just to hold gross margin. Uses Ramp, Vercel and Silicon Data to argue that scarce-compute owners and hyperscalers, not frontier labs or leveraged neoclouds, capture the rents.", "tags": ["AI", "compute economics"], "listedOn": "2026-11-01"}, {"title": "Building AI on credit: structures and spillovers", "source": "BIS Bulletin No 140", "date": "2026-10-27", "min": 15, "url": "https://www.bis.org/publications/bulletin-140-building-ai-credit-structures-and-spillovers.pdf", "why": "BIS maps how AI capex is increasingly funded with long-term debt and off-balance-sheet vehicles whose ratings lean on commitments from a few large firms, with banks lending to both the vehicles and their investors. It measures spillovers on AI-financing news days in 2026, the clearest official look yet at where AI credit risk sits.", "tags": ["AI credit", "financial stability"], "listedOn": "2026-10-29"}, {"title": "The End of the Internet", "source": "Stratechery (free weekly article; paywall site)", "date": "2026-10-26", "min": 13, "url": "https://stratechery.com/2026/the-end-of-the-internet/", "paywall": true, "why": "Thompson starts from the PHP remote-code-execution bug and asks what AI agents and security pressure mean for the open web. This week's free article is the full piece, not a teaser.", "tags": ["AI", "tech strategy"], "listedOn": "2026-10-29"}, {"title": "Bank liquidity regulation and the growth of private credit", "source": "BIS Working Paper No 1388 (Doerr, Gelos, Pursiainen)", "date": "2026-10-20", "min": 54, "url": "https://www.bis.org/publications/bank-liquidity-regulation-and-growth-private-credit", "why": "After the Liquidity Coverage Ratio took effect, private credit grew far faster in US counties where LCR banks had a bigger footprint or larger liquidity shortfalls: a one standard deviation higher footprint means nearly 50% more private credit, an effect as large as the 2012 CCAR capital hike. It is hard evidence that post-crisis bank rules pushed lending into private credit funds, which matters for where the next credit stress shows up (the landing page summary takes 2 minutes; the full paper is long).", "tags": ["private credit", "financial stability", "regulation"], "listedOn": "2026-11-03"}, {"title": "Can AI Fix(ed) Income?", "source": "Citadel Securities Macro Thoughts (Nohshad Shah)", "date": "2026-10-17", "min": 5, "url": "https://www.citadelsecurities.com/news-and-insights/macro-thoughts/can-ai-fixed-income/", "why": "Walks through why CoreWeave's 2032 bonds trade near 15% while AA hyperscalers sit around 100bp, and how a 59% EBITDA margin shrinks to about 5% before interest. Also flags that the Nasdaq/10-year correlation has flipped positive, so bonds may again hedge the AI trade.", "tags": ["AI credit", "rates"], "listedOn": "2026-10-30"}, {"title": "Introducing Private Credit into the Financial Accounts of the United States", "source": "Federal Reserve FEDS Notes", "date": "2026-10-16", "min": 21, "url": "https://www.federalreserve.gov/econres/notes/feds-notes/introducing-private-credit-into-the-financial-accounts-of-the-united-states-20261016.html", "why": "For the first time, the Fed breaks out private credit loans and the vehicles that originate them in the Z.1 Financial Accounts. That gives an official baseline for the size of private credit and for who funds it.", "tags": ["private credit", "financial stability"], "listedOn": "2026-10-29"}];
const K="mr-read:";const isRead=u=>localStorage.getItem(K+u)!==null;
const M=["January","February","March","April","May","June","July","August","September","October","November","December"];
const fd=s=>{const[y,m,d]=s.split("-").map(Number);return M[m-1]+" "+d+", "+y};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function card(it,top,readMode){const d=document.createElement("article");d.className="it"+(top?" top":"");
d.innerHTML='<div><a target="_blank" rel="noopener" href="'+esc(it.url)+'">'+esc(it.title)+'</a>'+
'<div class="meta"><span class="src">'+esc(it.source)+'</span> &middot; '+fd(it.date)+' &middot; '+it.min+' min'+(it.paywall?' &middot; <span class="pw">Paywall</span>':'')+'</div><p class="why">'+esc(it.why)+'</p><div class="rate">'+["bad","neutral","good"].map(v=>'<button data-v="'+v+'"'+(getR(it.url)&&getR(it.url).rating===v?' class="on" aria-pressed="true"':' aria-pressed="false"')+'>'+v+'</button>').join("")+'</div></div>'+
'<div class="ctl">'+(readMode?'<button class="undo">Undo</button>':'<input class="ck" type="checkbox" aria-label="Mark read" title="Mark read">')+'</div>';
d.querySelectorAll(".rate button").forEach(b=>b.onclick=()=>{setR(it,b.dataset.v);render();sync()});
if(readMode)d.querySelector(".undo").onclick=()=>{localStorage.removeItem(K+it.url);render();sync()};
else d.querySelector("input").onchange=()=>{localStorage.setItem(K+it.url,new Date().toISOString());render();sync()};return d}
const RK="mr-rate:";const getR=u=>{try{return JSON.parse(localStorage.getItem(RK+u))}catch(e){return null}};
function setR(it,v){const c=getR(it.url);if(c&&c.rating===v)localStorage.removeItem(RK+it.url);else localStorage.setItem(RK+it.url,JSON.stringify({rating:v,ratedAt:new Date().toISOString(),url:it.url,title:it.title,source:it.source,published:it.date,tags:it.tags||[]}))}
function collect(){const seen={},out=[];const add=(u,meta)=>{if(seen[u])return;const r=getR(u),ra=localStorage.getItem(K+u);if(!r&&ra===null)return;seen[u]=1;const m=meta||r||{};out.push({url:u,title:m.title||null,source:m.source||null,published:m.date||m.published||null,read:ra!==null,readAt:ra,rating:r?r.rating:null,ratedAt:r?r.ratedAt:null,tags:m.tags||[]})};
ITEMS.forEach(i=>add(i.url,i));for(let j=0;j<localStorage.length;j++){const k=localStorage.key(j);if(k.startsWith(RK))add(k.slice(RK.length));else if(k.startsWith(K))add(k.slice(K.length))}return out}
function exportJSON(){return {exportedAt:new Date().toISOString(),items:collect()}}
function msg(s){const m=document.getElementById("xm");m.textContent=s;clearTimeout(msg.t);msg.t=setTimeout(()=>m.textContent="",4000)}
function dl(s){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"application/json"}));a.download="ratings.json";a.click()}
async function copy(s){try{await navigator.clipboard.writeText(s);return true}catch(e){return false}}
const ISS="https://github.com/LongOnlyAnalyst/morning-reads/issues/new";const MAXURL=7000;
function payload(now){return {exportedAt:(now||new Date()).toISOString(),items:collect().map(i=>({url:i.url,rating:i.rating,ratedAt:i.ratedAt,read:i.read,readAt:i.readAt,source:i.source,title:(i.title||"").slice(0,60),tags:i.tags}))}}
function issueURL(now){const d=(now||new Date()).toISOString().slice(0,10);const p=payload(now);
const title="Ratings export "+d;const json=JSON.stringify(p);const u=ISS+"?title="+encodeURIComponent(title)+"&body="+encodeURIComponent("```json\n"+json+"\n```");
return u.length<=MAXURL?{url:u,fallback:false,json}:{url:ISS+"?title="+encodeURIComponent(title)+"&body="+encodeURIComponent("Paste the ratings JSON from your clipboard here."),fallback:true,json:"```json\n"+json+"\n```"}}
document.getElementById("xe").onclick=async()=>{const s=JSON.stringify(exportJSON(),null,1);if(await copy(s))msg("Copied");else{dl(s);msg("Downloaded ratings.json")}};
document.getElementById("xs").onclick=async()=>{const r=issueURL();if(r.fallback){await copy(r.json);msg("JSON copied; paste it into the issue")}window.open(r.url,"_blank","noopener")};
const SY={t:["github_", "pat_11C", "FLDLJQ0", "pjZWaLo", "XC4W1_N", "GZ15xPe", "k055OWt", "ZTqfr8B", "PdkwUUO", "9BsNWRX", "Cfplg0k", "5VQXB4X", "TJTbh3D", "VS"].join(""),n:1};let syT;
function sync(){if(!SY.t||!SY.n)return;clearTimeout(syT);syT=setTimeout(async()=>{try{const r=await fetch("https://api.github.com/repos/LongOnlyAnalyst/morning-reads/issues/"+SY.n,{method:"PATCH",headers:{Authorization:"Bearer "+SY.t,Accept:"application/vnd.github+json"},body:JSON.stringify({body:"```json\n"+JSON.stringify(payload())+"\n```"})});msg(r.ok?"Synced":"Sync failed")}catch(e){msg("Sync failed")}},3000)}
function render(){const un=ITEMS.filter(i=>!isRead(i.url));const tops=un.filter(i=>i.top),rest=un.filter(i=>!i.top);
while(tops.length<3&&rest.length)tops.push(rest.shift());
const T=document.getElementById("top"),Mo=document.getElementById("more"),R=document.getElementById("read");T.innerHTML=Mo.innerHTML=R.innerHTML="";
tops.forEach(i=>T.appendChild(card(i,true)));rest.forEach(i=>Mo.appendChild(card(i,false)));
const rd=ITEMS.filter(i=>isRead(i.url)).sort((a,b)=>localStorage.getItem(K+b.url).localeCompare(localStorage.getItem(K+a.url)));rd.forEach(i=>R.appendChild(card(i,false,true)));
if(!tops.length)T.innerHTML='<p class="empty">All caught up.</p>';if(!rest.length)Mo.innerHTML='<p class="empty">Nothing else queued.</p>';if(!rd.length)R.innerHTML='<p class="empty">Nothing marked read yet.</p>';
document.getElementById("tU").textContent="Unread "+un.length;document.getElementById("tR").textContent="Read "+rd.length}
function tab(r){document.getElementById("U").hidden=r;document.getElementById("R").hidden=!r;document.getElementById("tU").classList.toggle("on",!r);document.getElementById("tR").classList.toggle("on",r)}
document.getElementById("tU").onclick=()=>tab(false);document.getElementById("tR").onclick=()=>tab(true);render();sync();
</script></body></html>
