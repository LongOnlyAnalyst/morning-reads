<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Morning Reads</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon.ico" sizes="any"><meta name="theme-color" content="#141311">
<style>
:root{--bg:#141311;--tx:#ece7dd;--sub:#b9b2a6;--mut:#857e72;--line:#2c2924;--acc:#c2a36b}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.6 "Iowan Old Style","Charter","Bitstream Charter",Georgia,"Times New Roman",serif;-webkit-font-smoothing:antialiased}
.sans,.meta,.tabs,.kick,.upd,h2{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Arial,sans-serif}
main{max-width:720px;margin:0 auto;padding:72px 28px 96px}
header{border-bottom:1px solid var(--line);padding-bottom:22px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
h1{margin:0;font-weight:400;font-size:2.6rem;letter-spacing:-.01em;line-height:1.1}
.upd{color:var(--mut);font-size:.78rem;letter-spacing:.02em;margin-top:10px}
.tabs{display:flex;gap:22px;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.tabs button{background:none;border:0;padding:0 0 3px;color:var(--mut);cursor:pointer;font:inherit;letter-spacing:inherit;border-bottom:1px solid transparent}
.tabs button.on{color:var(--tx);border-bottom-color:var(--acc)}
h2{font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin:56px 0 0}
.it{display:grid;grid-template-columns:1fr auto;gap:0 28px;padding:28px 0;border-bottom:1px solid var(--line)}
.it a{color:var(--tx);text-decoration:none;font-size:1.32rem;line-height:1.3;font-weight:400}
.it.top a{font-size:1.6rem;line-height:1.25}
.it a:hover{color:var(--acc)}
.meta{color:var(--mut);font-size:.78rem;letter-spacing:.02em;margin:10px 0 12px}
.meta .src{color:var(--sub)}.pw{color:var(--acc)}
.why{margin:0;color:var(--sub);font-size:1rem;line-height:1.62}
.ctl{padding-top:6px}
.ck{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:1px solid var(--mut);border-radius:2px;margin:0;cursor:pointer;background:none;display:block}
.ck:hover{border-color:var(--acc)}.ck:checked{background:var(--acc);border-color:var(--acc)}
.undo{background:none;border:0;border-bottom:1px solid var(--mut);color:var(--sub);padding:0;cursor:pointer;font:500 .75rem/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.undo:hover{color:var(--acc);border-color:var(--acc)}
.rate{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Arial,sans-serif;font-size:.72rem;letter-spacing:.06em;text-transform:lowercase;margin-top:12px;display:flex;gap:16px}
.rate button,.xp button{background:none;border:0;padding:0 0 2px;color:var(--mut);cursor:pointer;font:inherit;letter-spacing:inherit;border-bottom:1px solid transparent}
.rate button:hover,.xp button:hover{color:var(--sub)}.rate button.on{color:var(--acc);border-bottom-color:var(--acc)}
.xp{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Arial,sans-serif;font-size:.72rem;letter-spacing:.04em;color:var(--mut);display:flex;gap:18px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.xp .msg{color:var(--sub)}
.empty{color:var(--mut);padding:28px 0;margin:0;font-style:italic}
@media(max-width:560px){main{padding:40px 20px 72px}h1{font-size:2rem}.it.top a{font-size:1.32rem}.it a{font-size:1.16rem}.it{gap:0 18px;padding:24px 0}h2{margin-top:44px}}
</style></head><body><main>

</main><script>
const ITEMS=[{"title": "Is the U.S. 'exorbitant privilege' of favorable rates fading?", "source": "Dallas Fed Economics (Scott Davis, Abigail MacLean)", "date": "2026-11-10", "min": 7, "url": "https://www.dallasfed.org/research/economics/2026/1110", "why": "U.S. net income on foreign investments, which paid for about 40 percent of the trade deficit in the decade before the pandemic, turned negative in 2024 for the first time since at least 1960. The authors break the drop into a shrinking net equity position after years of U.S. stock outperformance and higher yields on a large net debt position, which is why foreign borrowing is now near 4 percent of GDP, the most since 2008.", "tags": ["flows", "dollar", "external balance"], "paywall": false, "top": true, "listedOn": "2026-11-11"}, {"title": "The AI Boom's Two Engines", "source": "PIIE RealTime Economics (Jason Furman)", "date": "2026-11-09", "min": 13, "url": "https://www.piie.com/blogs/realtime-economics/2026/ai-booms-two-engines", "why": "Furman runs the Fed's own FRB/US model and finds the data-center buildout has added only about 0.3 percent to GDP because roughly three-quarters of the spending is imported, while the wealth effect from about $11 trillion of excess gains in seven AI stocks matters more. The upshot is that a smaller buildout would be easy to absorb, but a stock market fall is the real risk, and forward-looking rate expectations could wipe out the gains.", "tags": ["AI capex", "macro", "equity wealth effect"], "paywall": false, "top": true, "listedOn": "2026-11-11"}, {"title": "IRR, Dollars of Alpha, or Dollars of Fees", "source": "The Diff (Byrne Hobart)", "date": "2026-11-09", "min": 8, "url": "https://www.thediff.co/archive/irr-dollars-of-alpha-or-dollars-of-fees/", "why": "Written after a week of hedge funds shutting long/short books and Sequoia pulling back, this lays out why asset managers keep expanding into adjacent strategies and why it often fails for quant shops moving into discretionary equity. It is a clear framework for how multi-manager pods and multi-stage VC grow until available alpha, not capital, becomes the limit; the lead essay is free, with some later sections behind the paywall.", "tags": ["positioning", "hedge funds", "asset management"], "paywall": false, "top": true, "listedOn": "2026-11-11"}, {"title": "The Perfect Storm That Clobbered Hedge Funds", "source": "Bloomberg Odd Lots (podcast episode, Nishant Kumar and Michael Ball)", "date": "2026-11-11", "min": 52, "url": "https://omny.fm/shows/odd-lots/the-perfect-storm-that-clobbered-hedge-funds", "why": "Recorded November 10, this two-parter dissects why October was one of the worst months in memory for hedge funds, centred on whether multi-strategy pods that were supposed to be uncorrelated were all implicitly long the AI trade without their risk managers realising it. The second half covers post-midterm macro, the AI buildout and the Anthropic IPO as crowded positions keep unwinding.", "tags": ["positioning", "hedge funds", "AI"], "paywall": false, "listedOn": "2026-11-11"}, {"title": "US monetary policy, macroeconomic news and the global secular decline of interest rates", "source": "BIS Working Paper No 1393 (Hofmann, Li, Wu)", "date": "2026-11-10", "min": 6, "url": "https://www.bis.org/publications/working-paper-1393-us-monetary-policy-macroeconomic-news-and-global-secular-decline-interest-rates", "why": "The paper finds that the decline in long-term yields across ten advanced economies since the 1990s happened mostly inside FOMC announcement windows, and that it ran through the expected path of short rates rather than term premia. The effect is concentrated in windows preceded by macro news, which the authors read as markets repeatedly revising the Fed's reaction function, a useful frame for how US policy sets global rates.", "tags": ["rates", "monetary policy", "global spillovers"], "paywall": false, "listedOn": "2026-11-11"}, {"title": "Quarterly refunding and the debt ceiling", "source": "BNY iFlow Short Thoughts (John Velis)", "date": "2026-11-10", "min": 4, "url": "https://www.bny.com/corporate/global/en/solutions/platforms/execution-services/iflow/short-thoughts/quarterly-refunding-and-the-debt-ceiling.html", "why": "Velis reads last week's refunding as Treasury leaning on bills (now near 23% of marketable debt, the highest outside COVID since 2010) and lifting its cash-balance target from $850bn to $1tn by March 2027, with only about $550bn of debt-limit headroom left. He expects coupon sizes to stay flat until the ceiling is lifted, which a Democratic Congress and a December 11 funding deadline could drag out, keeping bill supply rising.", "tags": ["Treasuries", "funding markets", "fiscal"], "paywall": false, "listedOn": "2026-11-11"}, {"title": "Anthropic Has Some Anchor Investors", "source": "Matt Levine, Money Stuff (Bloomberg Opinion)", "date": "2026-11-10", "min": 15, "url": "https://www.bloomberg.com/opinion/newsletters/2026-11-10/anthropic-has-some-anchor-investors", "why": "Levine takes apart the $26 billion strategic private placement in Anthropic's IPO: Google, Nvidia and other suppliers get stock plus the compute revenue Anthropic pays them, so their share is worth more to them than to a public buyer. He also notes they pay no underwriting fee and cannot flip for about six months, which limits float; only the opening is readable without a subscription.", "tags": ["AI credit", "IPOs", "market structure"], "paywall": true, "listedOn": "2026-11-11"}, {"title": "A Look at the Wider Divide in Credit Card Delinquency by Income", "source": "NY Fed Liberty Street Economics (Lee, Mangrum, Scally, Sinha, van der Klaauw)", "date": "2026-11-10", "min": 15, "url": "https://libertystreeteconomics.newyorkfed.org/2026/11/a-look-at-the-wider-divide-in-credit-card-delinquency-by-income/", "why": "Alongside the Q3 household debt report (balances up $334 billion), the authors show the gap in new credit card delinquency between low- and high-income zip codes has widened since 2022. They trace much of the distress to cards issued during the pandemic, when a growing share went to lower-income, lower-score borrowers, which helps separate vintage effects from a broad consumer downturn.", "tags": ["consumer credit", "financial stability"], "paywall": false, "listedOn": "2026-11-11"}, {"title": "The Federal Reserve's Balance Sheet Size and \"Other Deposits\": Some Financial Stability Considerations", "source": "Chicago Fed Letter No. 531 (Cindy Hull, Brett Solimine)", "date": "2026-11-10", "min": 14, "url": "https://www.chicagofed.org/-/media/publications/chicago-fed-letter/2026/cfl531.pdf?sc_lang=en", "why": "Clearinghouse cash at the Fed has climbed to a record of about $250 billion, and every dollar of it drains a dollar of bank reserves, so it matters for any plan to shrink the balance sheet. The letter weighs cutting the interest rate paid, capping balances, or giving clearinghouses standing repo access, and flags the wrong-way risk of pushing that cash into commercial banks, with the Treasury clearing mandate set to add more margin.", "tags": ["market structure", "financial stability", "Fed balance sheet"], "paywall": false, "listedOn": "2026-11-11"}, {"title": "U.S. Private Credit Vehicles: Institutional Structure and Aggregate Balance Sheets", "source": "Federal Reserve FEDS Notes (Brinkman, Dobridge, Dore, Glossner, Holmquist, Nguyen, Perozek, Stefanescu)", "date": "2026-11-09", "min": 12, "url": "https://www.federalreserve.gov/econres/notes/feds-notes/u-s-private-credit-vehicles-institutional-structure-and-aggregate-balance-sheets-20261109.html", "why": "Using new Financial Accounts data, Fed staff size U.S. private credit vehicles at about $1.9 trillion at end-2025 (up from $240 billion in 2012, and 21% in 2025 alone), split across private debt funds, BDCs, interval and tender offer funds and middle-market CLOs, with banks supplying most of their roughly $500 billion of debt. The useful part is the vehicle-by-vehicle view of leverage (BDCs near 1x, PD funds about 0.25x) and redemption terms, which shows where liquidity stress from retail-facing structures would actually show up.", "tags": ["private credit", "financial stability"], "paywall": false, "listedOn": "2026-11-10"}, {"title": "Is the Nvidia Affair Securities Fraud?", "source": "Matt Levine, Money Stuff (Bloomberg Opinion)", "date": "2026-11-09", "min": 16, "url": "https://www.bloomberg.com/opinion/newsletters/2026-11-09/is-the-nvidia-affair-securities-fraud", "why": "Levine opens by framing AI as a roughly $4 trillion-a-year spending stream about five years out, then turns to how that money gets financed and to whether the news around Nvidia's Jensen Huang raises a securities-fraud question. Also covers hedge-fund mistakes, securities fraud and insider trading; only the opening is readable without a subscription.", "tags": ["AI credit", "market structure"], "paywall": true, "listedOn": "2026-11-10"}, {"title": "We the People…", "source": "Citadel Securities Some Macro Thoughts (Nohshad Shah)", "date": "2026-11-07", "min": 5, "url": "https://www.citadelsecurities.com/news-and-insights/macro-thoughts/we-the-people/", "why": "Shah argues the midterms turn the politics of AI into a real constraint on the buildout, with Texas permitting and grid connections (and the Governor-elect's moratorium) the near-term bottleneck, and his base case is longer delays and selective resumption. For investors that raises the value of compute already running versus capacity still to be permitted and financed, favoring hyperscalers with power access over hardware suppliers exposed to order deferrals.", "tags": ["AI credit", "macro", "positioning"], "paywall": false, "listedOn": "2026-11-11"}, {"title": "TMT credit breaks from the pack", "source": "BNY iFlow Special Report (David Tam)", "date": "2026-11-06", "min": 6, "url": "https://www.bny.com/corporate/global/en/solutions/platforms/execution-services/iflow/special-reports/tmt-credit-breaks-from-the-pack.html", "why": "Tam shows credit stress concentrating in tech, media and telecom: since September 1 both IG and HY TMT spreads have widened more than every other sector from an already wider base, while Financials and Energy stay inside the aggregate. He reads it as selective repricing driven by hyperscaler supply and doubts over AI capex returns rather than a broad downturn, and lists what would turn it systemic: wider TMT new-issue concessions, pulled deals and persistent HY fund outflows.", "tags": ["AI credit", "credit spreads", "flows"], "paywall": false, "listedOn": "2026-11-08"}, {"title": "The Insatiable Demand for Alpha", "source": "Net Interest (Marc Rubinstein)", "date": "2026-11-06", "min": 10, "url": "https://www.netinterest.co/p/the-insatiable-demand-for-alpha", "why": "Rubinstein uses the Alaska Permanent Fund (hedge funds now 8% of the portfolio, 6.7% a year with no down years since bringing selection in-house in 2016) to show why allocators keep pushing money at capacity-constrained multi-manager platforms. He then argues the current hedge fund shakedown, after Millennium's -2.3% October, could leave the biggest pod shops stronger as they scale toward $100 billion (free preview covers the Alaska setup; the Millennium analysis is paid, read time estimated).", "tags": ["hedge funds", "positioning", "allocators"], "paywall": true, "listedOn": "2026-11-08"}, {"title": "What Huawei's Horinger data center reveals about China's compute gap", "source": "Epoch AI (Ben Cottier)", "date": "2026-11-06", "min": 15, "url": "https://epoch.ai/publications/huawei-horinger-china-compute-gap", "why": "Using satellite images of cooling equipment, Epoch estimates Huawei's Inner Mongolia campus at about 286 MW and roughly 81,000 H100-equivalents, about 7 percent of SpaceX's Colossus 2. The constraint is chips, not power: Ascend chips give about 40 percent of the compute per megawatt of top Nvidia parts, and the next-generation Ascend 950 looks less efficient, so the gap is unlikely to close in the next two years.", "tags": ["AI compute", "supply chains", "China"], "paywall": false, "listedOn": "2026-11-11"}, {"title": "Houston, Do We Have A Problem?", "source": "Citadel Securities Global Macro Strategy (Frank Flight)", "date": "2026-11-05", "min": 10, "url": "https://www.citadelsecurities.com/news-and-insights/global-macro-strategy/houston-do-we-have-a-problem/", "why": "Flight reads the midterm backlash against data centres (opposed in at least 39 of 45 local ballot initiatives, with ~45 GW of projects at risk in Texas, Ohio, Pennsylvania and Georgia) as a near-term constraint on AI infrastructure, not a collapse in aggregate investment given capital's mobility. He maps a Peak Capex rotation out of memory, neoclouds and energy into hyperscalers with energised compute, argues rates get a cleaner lower-yield impulse from slower financing demand, and flags that three-month option-implied odds of Brent above $120 have more than halved since late October as midterms may catalyse an Iran settlement.", "tags": ["AI credit", "positioning", "rates"], "paywall": false, "listedOn": "2026-11-06"}, {"title": "Downstream Bottlenecks in the Oil Supply Chain Are Contributing to Historically High Refinery Margins and Fuel Prices", "source": "Kansas City Fed Economic Bulletin (David Rodziewicz)", "date": "2026-11-05", "min": 6, "url": "https://www.kansascityfed.org/research/economic-bulletin/downstream-bottlenecks-in-the-oil-supply-chain-are-contributing-to-historically-high-refinery-margins-and-fuel-prices/", "why": "Since the Iran conflict began, Gulf Coast diesel is up about 93 percent against about 63 percent for crude, and crack spreads now make up over 40 percent of the price of a gallon of diesel. With U.S. inventories at decade lows after SPR releases and about 18 percent of world refining capacity sitting in conflict zones, the note argues fuel prices and refining margins stay high even if crude falls.", "tags": ["supply chains", "energy", "refining"], "paywall": false, "listedOn": "2026-11-11"}, {"title": "November: The Setup Improves", "source": "Citadel Securities Global Market Intelligence (Scott Rubner)", "date": "2026-11-04", "min": 9, "url": "https://www.citadelsecurities.com/news-and-insights/global-market-intelligence/november-the-setup-improves/", "why": "Rubner's post-election flows update: retail has bought US equities for 22 straight sessions (a record $251B year to date), buyback blackouts are lifting against $1.5T of authorizations, and CTA positioning has fallen to -3.3 standard deviations. He pairs that with semis trading at their widest discount to the S&P since 2018 despite rising estimates, making a concrete demand-side case for a year-end rebuild.", "tags": ["flows", "positioning", "market structure"], "paywall": false, "listedOn": "2026-11-05"}, {"title": "Global Impacts of China's Chemicals Buildout", "source": "Rhodium Group (Jeremy Smith)", "date": "2026-11-02", "min": 6, "url": "https://rhg.com/research/global-impacts-of-chinas-chemicals-buildout/", "why": "China now holds over 45 percent of global capacity in basic chemicals and plastic resins, and supply has run well ahead of demand since the property slump, crushing prices and margins. Rhodium argues Beijing's anti-involution push will not force real capacity cuts, so the pressure lands on high-cost producers in Europe and Northeast Asia and spreads into specialty chemicals and downstream industries.", "tags": ["supply chains", "China", "industrial overcapacity"], "paywall": false, "listedOn": "2026-11-11"}, {"title": "The Datacenter Backlash Goes Bipartisan: Next Week's Midterms and the 2028 Buildout", "source": "SemiAnalysis (Barkin, Ma, Knuhtsen, Ontiveros, Patel)", "date": "2026-11-01", "min": 9, "url": "https://newsletter.semianalysis.com/p/the-datacenter-backlash-goes-bipartisan", "why": "SemiAnalysis says 2027 data-center capacity is largely locked in, but its 62.2 GW of U.S. additions for 2028 mostly has not started construction and sits in states that just elected governors campaigning on pauses or tighter conditions. The biggest single risk it flags is the Texas TCEQ permit freeze, since Texas supplies close to 30 percent of 2028 U.S. capacity; the free section runs about 2,000 words before the paywall.", "tags": ["AI capex", "power", "Texas"], "paywall": true, "listedOn": "2026-11-11"}];
const K="mr-read:";const isRead=u=>localStorage.getItem(K+u)!==null;
const M=["January","February","March","April","May","June","July","August","September","October","November","December"];
const fd=s=>{const[y,m,d]=s.split("-").map(Number);return M[m-1]+" "+d+", "+y};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function card(it,top,readMode){const d=document.createElement("article");d.className="it"+(top?" top":"");
d.innerHTML='<div><a target="_blank" rel="noopener" href="'+esc(it.url)+'">'+esc(it.title)+'</a>'+
'<div class="meta"><span class="src">'+esc(it.source)+'</span> &middot; '+fd(it.date)+' &middot; '+it.min+' min'+(it.paywall?' &middot; <span class="pw">Paywall</span>':'')+'</div><p class="why">'+esc(it.why)+'</p><div class="rate">'+["bad","neutral","good"].map(v=>'<button data-v="'+v+'"'+(getR(it.url)&&getR(it.url).rating===v?' class="on" aria-pressed="true"':' aria-pressed="false"')+'>'+v+'</button>').join("")+'</div></div>'+
'<div class="ctl">'+(readMode?'<button class="undo">Undo</button>':'<input class="ck" type="checkbox" aria-label="Mark read" title="Mark read">')+'</div>';
d.querySelectorAll(".rate button").forEach(b=>b.onclick=()=>{setR(it,b.dataset.v);render();sync()});
if(readMode)d.querySelector(".undo").onclick=()=>{localStorage.removeItem(K+it.url);render();sync()};
else d.querySelector("input").onchange=()=>{localStorage.setItem(K+it.url,new Date().toISOString());render();sync()};return d}
const RK="mr-rate:";const getR=u=>{try{return JSON.parse(localStorage.getItem(RK+u))}catch(e){return null}};
function setR(it,v){const c=getR(it.url);if(c&&c.rating===v)localStorage.removeItem(RK+it.url);else localStorage.setItem(RK+it.url,JSON.stringify({rating:v,ratedAt:new Date().toISOString(),url:it.url,title:it.title,source:it.source,published:it.date,tags:it.tags||[]}))}
function collect(){const seen={},out=[];const add=(u,meta)=>{if(seen[u])return;const r=getR(u),ra=localStorage.getItem(K+u);if(!r&&ra===null)return;seen[u]=1;const m=meta||r||{};out.push({url:u,title:m.title||null,source:m.source||null,published:m.date||m.published||null,read:ra!==null,readAt:ra,rating:r?r.rating:null,ratedAt:r?r.ratedAt:null,tags:m.tags||[]})};
ITEMS.forEach(i=>add(i.url,i));for(let j=0;j<localStorage.length;j++){const k=localStorage.key(j);if(k.startsWith(RK))add(k.slice(RK.length));else if(k.startsWith(K))add(k.slice(K.length))}return out}
function exportJSON(){return {exportedAt:new Date().toISOString(),items:collect()}}
function msg(s){const m=document.getElementById("xm");m.textContent=s;clearTimeout(msg.t);msg.t=setTimeout(()=>m.textContent="",4000)}
function dl(s){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"application/json"}));a.download="ratings.json";a.click()}
async function copy(s){try{await navigator.clipboard.writeText(s);return true}catch(e){return false}}
const ISS="https://github.com/LongOnlyAnalyst/morning-reads/issues/new";const MAXURL=7000;
function payload(now){return {exportedAt:(now||new Date()).toISOString(),items:collect().map(i=>({url:i.url,rating:i.rating,ratedAt:i.ratedAt,read:i.read,readAt:i.readAt,source:i.source,title:(i.title||"").slice(0,60),tags:i.tags}))}}
function issueURL(now){const d=(now||new Date()).toISOString().slice(0,10);const p=payload(now);
const title="Ratings export "+d;const json=JSON.stringify(p);const u=ISS+"?title="+encodeURIComponent(title)+"&body="+encodeURIComponent("```json\n"+json+"\n```");
return u.length<=MAXURL?{url:u,fallback:false,json}:{url:ISS+"?title="+encodeURIComponent(title)+"&body="+encodeURIComponent("Paste the ratings JSON from your clipboard here."),fallback:true,json:"```json\n"+json+"\n```"}}
document.getElementById("xe").onclick=async()=>{const s=JSON.stringify(exportJSON(),null,1);if(await copy(s))msg("Copied");else{dl(s);msg("Downloaded ratings.json")}};
document.getElementById("xs").onclick=async()=>{const r=issueURL();if(r.fallback){await copy(r.json);msg("JSON copied; paste it into the issue")}window.open(r.url,"_blank","noopener")};
const SY={t:["github_", "pat_11C", "FLDLJQ0", "pjZWaLo", "XC4W1_N", "GZ15xPe", "k055OWt", "ZTqfr8B", "PdkwUUO", "9BsNWRX", "Cfplg0k", "5VQXB4X", "TJTbh3D", "VS"].join(""),n:1};let syT;
function sync(){if(!SY.t||!SY.n)return;clearTimeout(syT);syT=setTimeout(async()=>{try{const r=await fetch("https://api.github.com/repos/LongOnlyAnalyst/morning-reads/issues/"+SY.n,{method:"PATCH",headers:{Authorization:"Bearer "+SY.t,Accept:"application/vnd.github+json"},body:JSON.stringify({body:"```json\n"+JSON.stringify(payload())+"\n```"})});msg(r.ok?"Synced":"Sync failed")}catch(e){msg("Sync failed")}},3000)}
function render(){const un=ITEMS.filter(i=>!isRead(i.url));const tops=un.filter(i=>i.top),rest=un.filter(i=>!i.top);
while(tops.length<3&&rest.length)tops.push(rest.shift());
