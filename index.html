<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Morning Reads</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon.ico" sizes="any"><meta name="theme-color" content="#141311">
<style>
:root{--bg:#141311;--tx:#ece7dd;--sub:#b9b2a6;--mut:#857e72;--line:#2c2924;--acc:#c2a36b}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.6 "Iowan Old Style","Charter","Bitstream Charter",Georgia,"Times New Roman",serif;-webkit-font-smoothing:antialiased}
.sans,.meta,.tabs,.kick,.upd,h2{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Arial,sans-serif}
main{max-width:720px;margin:0 auto;padding:72px 28px 96px}
header{border-bottom:1px solid var(--line);padding-bottom:22px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
h1{margin:0;font-weight:400;font-size:2.6rem;letter-spacing:-.01em;line-height:1.1}
.upd{color:var(--mut);font-size:.78rem;letter-spacing:.02em;margin-top:10px}
.tabs{display:flex;gap:22px;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.tabs button{background:none;border:0;padding:0 0 3px;color:var(--mut);cursor:pointer;font:inherit;letter-spacing:inherit;border-bottom:1px solid transparent}
.tabs button.on{color:var(--tx);border-bottom-color:var(--acc)}
h2{font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin:56px 0 0}
.it{display:grid;grid-template-columns:1fr auto;gap:0 28px;padding:28px 0;border-bottom:1px solid var(--line)}
.it a{color:var(--tx);text-decoration:none;font-size:1.32rem;line-height:1.3;font-weight:400}
.it.top a{font-size:1.6rem;line-height:1.25}
.it a:hover{color:var(--acc)}
.meta{color:var(--mut);font-size:.78rem;letter-spacing:.02em;margin:10px 0 12px}
.meta .src{color:var(--sub)}.pw{color:var(--acc)}
.why{margin:0;color:var(--sub);font-size:1rem;line-height:1.62}
.ctl{padding-top:6px}
.ck{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:1px solid var(--mut);border-radius:2px;margin:0;cursor:pointer;background:none;display:block}
.ck:hover{border-color:var(--acc)}.ck:checked{background:var(--acc);border-color:var(--acc)}
.undo{background:none;border:0;border-bottom:1px solid var(--mut);color:var(--sub);padding:0;cursor:pointer;font:500 .75rem/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.undo:hover{color:var(--acc);border-color:var(--acc)}
.rate{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Arial,sans-serif;font-size:.72rem;letter-spacing:.06em;text-transform:lowercase;margin-top:12px;display:flex;gap:16px}
.rate button,.xp button{background:none;border:0;padding:0 0 2px;color:var(--mut);cursor:pointer;font:inherit;letter-spacing:inherit;border-bottom:1px solid transparent}
.rate button:hover,.xp button:hover{color:var(--sub)}.rate button.on{color:var(--acc);border-bottom-color:var(--acc)}
.xp{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Arial,sans-serif;font-size:.72rem;letter-spacing:.04em;color:var(--mut);display:flex;gap:18px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.xp .msg{color:var(--sub)}
.empty{color:var(--mut);padding:28px 0;margin:0;font-style:italic}
@media(max-width:560px){main{padding:40px 20px 72px}h1{font-size:2rem}.it.top a{font-size:1.32rem}.it a{font-size:1.16rem}.it{gap:0 18px;padding:24px 0}h2{margin-top:44px}}
</style></head><body><main>
<header><div><h1>Morning Reads</h1><div class="upd">Updated November 26, 2026, 5:31 AM CT</div></div>

</main><script>
const ITEMS=[{"title": "Beyond banks: what non-banks do (and don't do) to monetary policy", "source": "Bank of England, Bank Underground (Bandera, Bluwstein, Kumhof, Salgado-Moreno, Stevens)", "date": "2026-11-26", "min": 7, "url": "https://bankunderground.co.uk/2026/11/26/beyond-banks-what-non-banks-do-and-dont-do-to-monetary-policy/", "why": "A DSGE model estimated on UK data (only 40% of UK corporate debt is now bank lending, down from 60% in 2008) finds that policy-rate transmission is essentially unchanged as non-banks grow, because banks pass rate moves to NBFIs through wholesale funding and NBFIs pass them on through bond markets. QE is different: its effect depends on why non-banks grew, with the output impact of QE 15.4% larger under a firm-driven NBFI expansion, which matters for how central banks read balance-sheet policy as private credit and funds take share.", "tags": ["monetary policy", "non-banks", "QE"], "paywall": false, "top": true, "listedOn": "2026-11-26"}, {"title": "The Surprising Stability of Hedge Fund Repo Haircuts", "source": "Federal Reserve Board FEDS Notes (Hempel, Kahn, Kurta, Neamtu)", "date": "2026-11-25", "min": 17, "url": "https://www.federalreserve.gov/econres/notes/feds-notes/the-surprising-stability-of-hedge-fund-repo-haircuts-20261125.html", "why": "Using a new transaction-level series of dealer-to-hedge-fund haircuts in sponsored Treasury repo (November 2019 to September 2026), the authors find that central clearing has not changed haircuts and that haircuts are not procyclical, even under stress. That cuts against a core rationale for the SEC clearing mandate and points stress-amplification worries toward futures margins and dealer intermediation capacity instead, which is directly relevant to basis-trade risk.", "tags": ["market structure", "repo", "hedge funds"], "paywall": false, "top": true, "listedOn": "2026-11-26"}, {"title": "Looking beyond the baseline: how scenario synthesis helps assess risks", "source": "ECB Blog (Bańbura, Giannone, Durero, Sun, Zimic)", "date": "2026-11-24", "min": 9, "url": "https://www.ecb.europa.eu/press/blog/date/2026/html/ecb.blog20261124~6486644873.en.html", "why": "ECB staff show how they weight narrative scenarios (such as the June 2026 Middle East conflict scenarios) against market option-implied, forecaster, and staff risk distributions, treating the weights as relevance to the risk picture, not as probabilities. The worked example shows market-implied euro area inflation risk is far more dispersed and skewed higher than the Survey of Professional Forecasters, a useful window into how the Governing Council reads tail risk around its baseline.", "tags": ["monetary policy", "inflation", "risk"], "paywall": false, "top": true, "listedOn": "2026-11-26"}, {"title": "When the unthinkable happens: perceptions of monetary policy in tail events", "source": "BIS Working Paper 1398 (Baumeister, De Fiore, Xiao)", "date": "2026-11-24", "min": 3, "url": "https://www.bis.org/publications/working-paper-1398-when-unthinkable-happens-perceptions-monetary-policy-tail-events", "why": "The paper shows that after large, rare oil supply shocks, households and firms learning in real time underestimate how hard the central bank responds to inflation, which lifts inflation expectations and produces persistent above-target inflation plus a temporary output overshoot; small shocks barely move beliefs. US nonlinear VAR evidence backs the model, which bears directly on how markets should read a hawkish Fed after this year's Hormuz energy shock.", "tags": ["monetary policy", "inflation", "rates"], "paywall": false, "listedOn": "2026-11-25"}, {"title": "As Corporate Bond Markets Grow, Is Bank Lending Shrinking?", "source": "NY Fed Liberty Street Economics (Boyarchenko, Elias)", "date": "2026-11-24", "min": 9, "url": "https://libertystreeteconomics.newyorkfed.org/2026/11/as-corporate-bond-markets-grow-is-bank-lending-shrinking/", "why": "Boyarchenko and Elias split corporate bond market growth into firms borrowing more overall versus shifting from banks to bonds, finding that 1996-2019 US growth was mostly credit deepening (total nonfinancial corporate credit rose from 41% to 52% of GDP while the bond share only went from 57% to 63%), unlike in other advanced economies. The distinction tells you whether bond-market or bank lending conditions now govern corporate funding, which matters as private credit and bank pullback reshape the credit mix.", "tags": ["credit", "market structure", "banks"], "paywall": false, "listedOn": "2026-11-25"}, {"title": "Why Has Global Trade Remained Resilient Despite High Trade Policy Uncertainty?", "source": "Federal Reserve Board FEDS Notes (Londono, Ma, Qin)", "date": "2026-11-24", "min": 14, "url": "https://www.federalreserve.gov/econres/notes/feds-notes/why-has-global-trade-remained-resilient-despite-high-trade-policy-uncertainty-20261124.html", "why": "Using 26 countries back to 1960, the note separates news-based trade policy uncertainty from data-based trade flow uncertainty and finds tariff headlines only hurt trade when underlying flows are also hard to predict, which explains why trade kept growing through 2025-26. Ship-tracking data show low-flow-uncertainty countries adjusted after the March 2026 Hormuz disruption by rerouting and front-loading, a useful filter for which trade shocks deserve a macro reaction.", "tags": ["trade", "macro", "geopolitics"], "paywall": false, "listedOn": "2026-11-25"}, {"title": "The Individual Exception", "source": "Stratechery (Ben Thompson; free article)", "date": "2026-11-24", "min": 13, "url": "https://stratechery.com/2026/the-individual-exception/", "why": "Thompson uses Jensen Huang's reinstatement, which added nearly $1 trillion to Nvidia's market cap, to argue that AI is shifting value from managerial bureaucracies to singular individuals, with market cap per employee at the top firms rising steeply since AT&T in the 1950s. It is a framework for why key-person value and headcount deflation may matter more for AI-era valuations than capex totals.", "tags": ["AI", "corporate governance", "valuation"], "paywall": false, "listedOn": "2026-11-24"}, {"title": "Owning the road, not paying the toll: how Europe can keep the returns from AI", "source": "Bruegel Working Paper 32/2026 (Revoltella, Brasili, Feás)", "date": "2026-11-24", "min": 45, "url": "https://www.bruegel.org/working-paper/owning-road-not-paying-toll-how-europe-can-keep-returns-ai", "why": "Using Eurostat trade data, the paper maps the AI supply chain in four layers and finds the EU's AI-goods trade balance has swung to a €42 billion deficit, with data-centre infrastructure flipping from a €6 billion surplus in 2015 to an €18 billion deficit in 2025. The one bright spot is chipmaking equipment (ASML, Zeiss), where the surplus grew to €27 billion, which frames where European AI rents are likely to accrue.", "tags": ["AI", "trade", "Europe"], "paywall": false, "listedOn": "2026-11-24"}, {"title": "Finding Equilibrium Inside the AI Economy", "source": "Net Interest (Marc Rubinstein; paid post, free preview)", "date": "2026-11-23", "min": 10, "url": "https://www.netinterest.co/p/supply-and-demand", "why": "From the TomorrowX conference, Rubinstein sets enterprise AI usage claims against Ramp data showing token volume up 27% in four weeks but spending up only 8%, and estimates the US data center buildout (about $9 trillion through 2032) needs roughly $2.7 to $3.5 trillion of annual revenue versus about $108 billion annualized at Anthropic and OpenAI. The paid section argues that lenders rather than demand are now setting the pace of the buildout; the free preview carries the core numbers.", "tags": ["AI credit", "AI capex"], "paywall": true, "listedOn": "2026-11-26"}, {"title": "When Is Monetary Policy Transmission Strongest?", "source": "San Francisco Fed Economic Letter 2026-34 (Rami Najjar, Adam Shapiro)", "date": "2026-11-23", "min": 8, "url": "https://www.frbsf.org/research-and-insights/publications/economic-letter/2026/11/when-is-monetary-policy-transmission-strongest/", "why": "Using high-frequency FOMC surprises, the authors find that policy shocks pass through to longer-horizon Treasury forward rates mainly when inflation is demand-driven, consistent with the Fed responding about four times more to demand than supply inflation. With supply-driven pressures back, Fed surprises should move the long end less than in past cycles.", "tags": ["rates", "monetary policy"], "paywall": false, "listedOn": "2026-11-24"}, {"title": "From Agentic to Agency Risks", "source": "Citadel Securities Some Macro Thoughts (Nohshad Shah)", "date": "2026-11-21", "min": 6, "url": "https://www.citadelsecurities.com/news-and-insights/macro-thoughts/from-agentic-to-agency-risks/", "why": "Shah argues the US is entering a less forgiving phase as fiscal support fades and the Fed leans toward hikes, and uses Ramp data (token spend down 6.3% from its peak while token prices fell 21% in six weeks, with 1% of businesses making up 80% of OpenAI/Anthropic spend) to question AI revenue extrapolation. He adds that political and cyber risk to AI is underpriced and stays defensive on the AI complex, expecting a flatter curve and more pressure on risk assets.", "tags": ["AI", "macro", "positioning"], "paywall": false, "listedOn": "2026-11-25"}, {"title": "The return of inflation: More bank profits, more central bank losses", "source": "VoxEU/CEPR (Paul De Grauwe, Yuemei Ji)", "date": "2026-11-20", "min": 5, "url": "https://cepr.org/voxeu/columns/return-inflation-more-bank-profits-more-central-bank-losses", "why": "Paying interest on about €2 trillion of reserves means each ECB hike transfers income to banks, lifting euro-area bank ROE toward 10% while the Eurosystem ran €64-69 billion of losses; a 3-4% deposit rate could restore €60-80 billion a year in transfers. The authors argue raising unremunerated minimum reserves from 1% to 2% would cut the subsidy without changing operating procedures.", "tags": ["rates", "banks", "central banks"], "paywall": false, "listedOn": "2026-11-23"}, {"title": "From power plays to price pressures: the energy transition and inflation", "source": "Bank of England, Bank Underground (Shin, Kyriakopoulou, Perers Cook)", "date": "2026-11-19", "min": 8, "url": "https://bankunderground.co.uk/2026/11/19/from-power-plays-to-price-pressures-the-energy-transition-and-inflation/", "why": "BoE staff show electricity now outweighs gas and petrol in the UK CPI basket, and that while the spot gas-power price correlation has collapsed since 2022, the futures correlation is still near 1, so gas shocks still reach bills. They flag grid supply chains (transformers, cables, critical minerals) shared with data centres as a more persistent inflation source.", "tags": ["energy", "inflation"], "paywall": false, "listedOn": "2026-11-24"}, {"title": "Higher fuel prices seep into core inflation", "source": "Dallas Fed Economics (Chudik, Kilian, Zhou)", "date": "2026-11-19", "min": 5, "url": "https://www.dallasfed.org/research/economics/2026/1119", "why": "Using a structural VAR plus daily-frequency estimators across 149 PCE components, the authors find this year's fuel shock, led by record diesel, added 20 to 60 basis points to 12-month core PCE inflation as of September. If fuel prices simply hold, that contribution fades by about 30 basis points by end-2027, a useful anchor for how much of sticky core is energy pass-through versus something the Fed has to fight.", "tags": ["inflation", "energy", "rates"], "paywall": false, "listedOn": "2026-11-20"}, {"title": "Relative Price Shocks and Inflation: The Role of Monetary Policy", "source": "Richmond Fed Economic Brief 26-38 (Alexander L. Wolman)", "date": "2026-11-18", "min": 9, "url": "https://www.richmondfed.org/publications/research/economic_brief/2026/eb_26-38", "why": "Using an estimated 15-sector New Keynesian model, Wolman shows that whether a relative price shock, such as AI demand pushing up prices of consumer-electronics components, raises overall inflation depends on how the Fed responds, not on the shock itself. It is a clean framework for judging claims that AI or energy shocks are inflationary, because any such claim carries an implicit assumption about the policy reaction.", "tags": ["inflation", "monetary policy", "AI"], "paywall": false, "listedOn": "2026-11-26"}, {"title": "Anthropic's compute spending is increasing by 4x per year, outpacing OpenAI's 3x", "source": "Epoch AI Data Insight (Josh You)", "date": "2026-11-18", "min": 4, "url": "https://epoch.ai/data-insights/anthropic-openai-compute-spend-growth", "why": "Using Anthropic's S-1/A, Epoch shows compute and infrastructure spend rising from $433 million in 2023 to nearly $10 billion in Q3 2026 (about $40 billion annualized), versus roughly 3x a year at OpenAI. It also flags $447.5 billion of contracted compute commitments through 2030, only about another doubling from today's run rate, which suggests the 4x pace has to slow and matters for whoever is financing the capacity.", "tags": ["AI", "compute", "AI credit"], "paywall": false, "listedOn": "2026-11-22"}, {"title": "Financial Stability Review, November 2026", "source": "European Central Bank (Financial Stability Review)", "date": "2026-11-18", "min": 145, "url": "https://www.ecb.europa.eu/press/financial-stability-publications/fsr/html/ecb.fsr202611~e03b919d36.en.html", "why": "The ECB's twice-yearly risk map says AI valuations rest on very ambitious earnings expectations while AI firms keep adding debt and circular financing makes real demand hard to gauge, with banks exposed mainly through their links to non-banks. Skip to Box 3 (debt financing of AI), Box 4 (big tech in the euro bond market), Box 6 (synthetic risk transfers) and Box 7 (hedge funds in sovereign repo) for the parts that matter most to AI credit and positioning; the full report is long.", "tags": ["financial stability", "AI credit", "non-banks"], "paywall": false, "listedOn": "2026-11-19"}, {"title": "The tax code already has an AI policy: It pays companies to borrow", "source": "Brookings, Urban-Brookings Tax Policy Center (Brosy, Patel)", "date": "2026-11-17", "min": 6, "url": "https://www.brookings.edu/articles/the-tax-code-already-has-an-ai-policy-it-pays-companies-to-borrow/", "why": "Full expensing plus interest deductibility puts the marginal effective tax rate on debt-financed computing equipment at -46% in 2026, up from -14% before OBBBA made expensing permanent, while hyperscaler long-term debt doubled from $232 billion to $486 billion between 2024 and mid-2026. It adds a policy angle to the AI-credit story: the subsidy tilts the buildout toward debt and off-balance-sheet vehicles like Meta's $27 billion Hyperion JV, and the interest cap likely does not bind for these firms.", "tags": ["AI credit", "fiscal", "tax"], "paywall": false, "listedOn": "2026-11-22"}, {"title": "Does the Stock Market Stigmatize Banks that Borrow from the Fed?", "source": "NY Fed Liberty Street Economics (Fischl-Lanzoni, Hiti, Sarkar)", "date": "2026-11-17", "min": 6, "url": "https://libertystreeteconomics.newyorkfed.org/2026/11/does-the-stock-market-stigmatize-banks-that-borrow-from-the-fed/", "why": "Using bank stock betas to uninsured deposits, unrealized losses, cash and capital during March 2023, the authors find investors grew more sensitive to a bank's weaknesses after its first Discount Window loan but not after its first BTFP loan. It is direct evidence on why lender-of-last-resort design (face-value collateral, a new facility with no history) decides whether banks actually use the backstop in a run.", "tags": ["financial stability", "banks", "Fed facilities"], "paywall": false, "listedOn": "2026-11-19"}, {"title": "Clouds of Credit: Mapping the Financial Web Behind AI Compute", "source": "NBER Working Paper 36032 (Van Nieuwerburgh, Su)", "date": "2026-11-16", "min": 77, "url": "https://www.nber.org/papers/w36032", "why": "Maps the network of debt, leases and non-recourse project finance behind the AI compute buildout and calibrates a model in which debt funds nearly 60% of the coming expansion and firms overinvest relative to the social optimum. In a low-productivity state losses reach $16.8 trillion with 40% loss-given-default on debt, and contractual spillovers among the key firms account for about 30% of private losses; read the abstract and the network section if short on time.", "tags": ["AI credit", "financial stability", "private credit"], "paywall": false, "listedOn": "2026-11-20"}];
const K="mr-read:";const isRead=u=>localStorage.getItem(K+u)!==null;
const M=["January","February","March","April","May","June","July","August","September","October","November","December"];
const fd=s=>{const[y,m,d]=s.split("-").map(Number);return M[m-1]+" "+d+", "+y};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function card(it,top,readMode){const d=document.createElement("article");d.className="it"+(top?" top":"");
d.innerHTML='<div><a target="_blank" rel="noopener" href="'+esc(it.url)+'">'+esc(it.title)+'</a>'+
'<div class="meta"><span class="src">'+esc(it.source)+'</span> &middot; '+fd(it.date)+' &middot; '+it.min+' min'+(it.paywall?' &middot; <span class="pw">Paywall</span>':'')+'</div><p class="why">'+esc(it.why)+'</p><div class="rate">'+["bad","neutral","good"].map(v=>'<button data-v="'+v+'"'+(getR(it.url)&&getR(it.url).rating===v?' class="on" aria-pressed="true"':' aria-pressed="false"')+'>'+v+'</button>').join("")+'</div></div>'+
'<div class="ctl">'+(readMode?'<button class="undo">Undo</button>':'<input class="ck" type="checkbox" aria-label="Mark read" title="Mark read">')+'</div>';
d.querySelectorAll(".rate button").forEach(b=>b.onclick=()=>{setR(it,b.dataset.v);render();sync()});
if(readMode)d.querySelector(".undo").onclick=()=>{localStorage.removeItem(K+it.url);render();sync()};
else d.querySelector("input").onchange=()=>{localStorage.setItem(K+it.url,new Date().toISOString());render();sync()};return d}
const RK="mr-rate:";const getR=u=>{try{return JSON.parse(localStorage.getItem(RK+u))}catch(e){return null}};
function setR(it,v){const c=getR(it.url);if(c&&c.rating===v)localStorage.removeItem(RK+it.url);else localStorage.setItem(RK+it.url,JSON.stringify({rating:v,ratedAt:new Date().toISOString(),url:it.url,title:it.title,source:it.source,published:it.date,tags:it.tags||[]}))}
function collect(){const seen={},out=[];const add=(u,meta)=>{if(seen[u])return;const r=getR(u),ra=localStorage.getItem(K+u);if(!r&&ra===null)return;seen[u]=1;const m=meta||r||{};out.push({url:u,title:m.title||null,source:m.source||null,published:m.date||m.published||null,read:ra!==null,readAt:ra,rating:r?r.rating:null,ratedAt:r?r.ratedAt:null,tags:m.tags||[]})};
ITEMS.forEach(i=>add(i.url,i));for(let j=0;j<localStorage.length;j++){const k=localStorage.key(j);if(k.startsWith(RK))add(k.slice(RK.length));else if(k.startsWith(K))add(k.slice(K.length))}return out}
function exportJSON(){return {exportedAt:new Date().toISOString(),items:collect()}}
function msg(s){const m=document.getElementById("xm");m.textContent=s;clearTimeout(msg.t);msg.t=setTimeout(()=>m.textContent="",4000)}
function dl(s){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"application/json"}));a.download="ratings.json";a.click()}
async function copy(s){try{await navigator.clipboard.writeText(s);return true}catch(e){return false}}
const ISS="https://github.com/LongOnlyAnalyst/morning-reads/issues/new";const MAXURL=7000;
function payload(now){return {exportedAt:(now||new Date()).toISOString(),items:collect().map(i=>({url:i.url,rating:i.rating,ratedAt:i.ratedAt,read:i.read,readAt:i.readAt,source:i.source,title:(i.title||"").slice(0,60),tags:i.tags}))}}
function issueURL(now){const d=(now||new Date()).toISOString().slice(0,10);const p=payload(now);
const title="Ratings export "+d;const json=JSON.stringify(p);const u=ISS+"?title="+encodeURIComponent(title)+"&body="+encodeURIComponent("```json\n"+json+"\n```");
return u.length<=MAXURL?{url:u,fallback:false,json}:{url:ISS+"?title="+encodeURIComponent(title)+"&body="+encodeURIComponent("Paste the ratings JSON from your clipboard here."),fallback:true,json:"```json\n"+json+"\n```"}}
document.getElementById("xe").onclick=async()=>{const s=JSON.stringify(exportJSON(),null,1);if(await copy(s))msg("Copied");else{dl(s);msg("Downloaded ratings.json")}};
document.getElementById("xs").onclick=async()=>{const r=issueURL();if(r.fallback){await copy(r.json);msg("JSON copied; paste it into the issue")}window.open(r.url,"_blank","noopener")};
const SY={t:["github_", "pat_11C", "FLDLJQ0", "pjZWaLo", "XC4W1_N", "GZ15xPe", "k055OWt", "ZTqfr8B", "PdkwUUO", "9BsNWRX", "Cfplg0k", "5VQXB4X", "TJTbh3D", "VS"].join(""),n:1};let syT;
function sync(){if(!SY.t||!SY.n)return;clearTimeout(syT);syT=setTimeout(async()=>{try{const r=await fetch("https://api.github.com/repos/LongOnlyAnalyst/morning-reads/issues/"+SY.n,{method:"PATCH",headers:{Authorization:"Bearer "+SY.t,Accept:"application/vnd.github+json"},body:JSON.stringify({body:"```json\n"+JSON.stringify(payload())+"\n```"})});msg(r.ok?"Synced":"Sync failed")}catch(e){msg("Sync failed")}},3000)}
function render(){const un=ITEMS.filter(i=>!isRead(i.url));const tops=un.filter(i=>i.top),rest=un.filter(i=>!i.top);
while(tops.length<3&&rest.length)tops.push(rest.shift());
