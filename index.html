<style>
:root{--bg:#141311;--tx:#ece7dd;--sub:#b9b2a6;--mut:#857e72;--line:#2c2924;--acc:#c2a36b}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.6 "Iowan Old Style","Charter","Bitstream Charter",Georgia,"Times New Roman",serif;-webkit-font-smoothing:antialiased}
.sans,.meta,.tabs,.kick,.upd,h2{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Arial,sans-serif}
main{max-width:720px;margin:0 auto;padding:72px 28px 96px}
header{border-bottom:1px solid var(--line);padding-bottom:22px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
h1{margin:0;font-weight:400;font-size:2.6rem;letter-spacing:-.01em;line-height:1.1}
.upd{color:var(--mut);font-size:.78rem;letter-spacing:.02em;margin-top:10px}
.tabs{display:flex;gap:22px;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.tabs button{background:none;border:0;padding:0 0 3px;color:var(--mut);cursor:pointer;font:inherit;letter-spacing:inherit;border-bottom:1px solid transparent}
.tabs button.on{color:var(--tx);border-bottom-color:var(--acc)}

.it{display:grid;grid-template-columns:1fr auto;gap:0 28px;padding:28px 0;border-bottom:1px solid var(--line)}
.it a{color:var(--tx);text-decoration:none;font-size:1.32rem;line-height:1.3;font-weight:400}
.it.top a{font-size:1.6rem;line-height:1.25}
.it a:hover{color:var(--acc)}
.meta{color:var(--mut);font-size:.78rem;letter-spacing:.02em;margin:10px 0 12px}
.meta .src{color:var(--sub)}.pw{color:var(--acc)}
.why{margin:0;color:var(--sub);font-size:1rem;line-height:1.62}
.ctl{padding-top:6px}
.ck{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:1px solid var(--mut);border-radius:2px;margin:0;cursor:pointer;background:none;display:block}
.ck:hover{border-color:var(--acc)}.ck:checked{background:var(--acc);border-color:var(--acc)}
.undo{background:none;border:0;border-bottom:1px solid var(--mut);color:var(--sub);padding:0;cursor:pointer;font:500 .75rem/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.undo:hover{color:var(--acc);border-color:var(--acc)}
.rate{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Arial,sans-serif;font-size:.72rem;letter-spacing:.06em;text-transform:lowercase;margin-top:12px;display:flex;gap:16px}
.rate button,.xp button{background:none;border:0;padding:0 0 2px;color:var(--mut);cursor:pointer;font:inherit;letter-spacing:inherit;border-bottom:1px solid transparent}
.rate button:hover,.xp button:hover{color:var(--sub)}.rate button.on{color:var(--acc);border-bottom-color:var(--acc)}
.xp{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Arial,sans-serif;font-size:.72rem;letter-spacing:.04em;color:var(--mut);display:flex;gap:18px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.xp .msg{color:var(--sub)}
.empty{color:var(--mut);padding:28px 0;margin:0;font-style:italic}
@media(max-width:560px){main{padding:40px 20px 72px}h1{font-size:2rem}.it.top a{font-size:1.32rem}.it a{font-size:1.16rem}.it{gap:0 18px;padding:24px 0}h2{margin-top:44px}}

</main><script>
const ITEMS=[{"title": "Connecting Stock Market to Labor Market During the AI Boom", "source": "San Francisco Fed Economic Letter 2026-33 (Kevin Lansing, Federico C. Nucera)", "date": "2026-11-16", "min": 9, "url": "https://www.frbsf.org/research-and-insights/publications/economic-letter/2026/11/connecting-stock-market-to-labor-market-during-ai-boom/", "why": "With the CAPE ratio at 40.5 in the third quarter, second only to the 2000 peak, the authors regress it on r-star, potential growth, the noncyclical unemployment rate and macro uncertainty and explain 89 percent of its variance since 1961. The noncyclical unemployment rate does most of the work and accounts for most of the post-2022 AI run-up, so a model without it implies much lower valuations, which is a useful frame for judging how fragile current multiples are.", "tags": ["AI", "valuations", "macro"], "paywall": false, "top": true, "listedOn": "2026-11-17"}, {"title": "Financial Stability Report, November 2026", "source": "Federal Reserve Board (Financial Stability Report, PDF)", "date": "2026-11-13", "min": 94, "url": "https://www.federalreserve.gov/publications/files/financial-stability-report-20261113.pdf", "why": "The Board's twice-yearly risk review puts advanced-computing debt issuance at more than $680 billion through October, about 31 percent of nonfinancial investment-grade issuance versus under 6 percent in 2023, with the mix shifting toward private credit, structured credit, project finance and off-balance-sheet leases and guarantees. It also finds hedge fund leverage at its highest since data began in 2013 and AI as the risk market contacts cited most often in the salient-risk survey; start with Box 2.2 on data-center leverage and Box 5.1.", "tags": ["AI credit", "financial stability", "positioning"], "paywall": false, "top": true, "listedOn": "2026-11-17"}, {"title": "Non-accrual data suggest LMEs may be masking BDC stress", "source": "PitchBook LCD (Sebastian Kian)", "date": "2026-11-12", "min": 6, "url": "https://pitchbook.com/news/articles/non-accrual-data-suggest-lmes-may-be-masking-bdc-stress", "why": "Using ten years of filings from 245 BDCs as a proxy for private credit, LCD finds a record 362 borrowers on non-accrual and $9.7 billion of non-accrual debt, up 64 percent year on year, even though the headline rate is only 1.9 percent (1.5 percent excluding Medallia). Its point is that amend-and-extend deals, PIK toggles and private liability management keep troubled loans accruing, so stress shows up first in PIK income and markdowns rather than the reported rate.", "tags": ["private credit", "financial stability"], "paywall": false, "top": true, "listedOn": "2026-11-17"}, {"title": "Obituaries", "source": "Stratechery (Ben Thompson; free weekly article)", "date": "2026-11-16", "min": 20, "url": "https://stratechery.com/2026/obituaries/", "why": "Thompson argues Jensen Huang's exit removes the handshake supply-chain relationships, the founder-run structure and the willingness to backstop neoclouds with Nvidia's own balance sheet that held up both Nvidia's margins and the debt-then-equity funding chain of the AI build-out. If roughly a trillion dollars of industry revenue does not arrive soon, he expects hyperscalers to prioritize their own compute and neocloud GPU assets to flood the market, which is the credit and positioning risk to watch.", "tags": ["AI credit", "supply chains", "market structure"], "paywall": false, "listedOn": "2026-11-16"}, {"title": "The Elasticity Business", "source": "The Diff (Byrne Hobart; free issue)", "date": "2026-11-16", "min": 15, "url": "https://www.thediff.co/archive/the-elasticity-business/", "why": "Hobart argues that supply and demand elasticity is not a constant, and that some of the best businesses, such as shale frackers with fast decline curves and cloud providers selling spot versus committed capacity, profit by adding elasticity to cyclical markets. The same free issue has a short section on Nvidia governance after Jensen Huang's exit, which ties the framework to the current compute cycle.", "tags": ["industry structure", "AI", "energy"], "paywall": false, "listedOn": "2026-11-17"}, {"title": "Macroeconomic effects of rare earth supply disruptions", "source": "VoxEU/CEPR (Bogmans, Jerez Osses, Miranda-Pinto, Natal; IMF staff)", "date": "2026-11-14", "min": 7, "url": "https://cepr.org/voxeu/columns/macroeconomic-effects-rare-earth-supply-disruptions", "why": "IMF staff build a production-network model with a rare-earth-augmented input-output table and find an 80 percent cut in rare earth imports would lower GDP by 1.8 percent in Japan, 1.5 percent in the US and 1.3 percent in Germany in the short run, with US auto output down about 9 percent. The key point is that network linkages make the US and Japan more exposed than simple value-added-at-risk measures suggest, and that the danger is concentrated in the first year before substitution kicks in.", "tags": ["supply chains", "commodities", "geopolitics"], "paywall": false, "listedOn": "2026-11-15"}, {"title": "A Banker's Guide to Anthropic", "source": "Net Interest (Marc Rubinstein)", "date": "2026-11-13", "min": 8, "url": "https://www.netinterest.co/p/a-bankers-guide-to-anthropic", "why": "Rubinstein treats the Anthropic IPO, due this week, as a credit event: a listing opens the door to an investment-grade rating and the $13 trillion IG bond market, and its new $15 billion revolver drops its collateral once two agencies call it investment grade, while Broadcom has stood behind more than $70 billion of debt for hardware leased to Anthropic. The free preview lays out the rating fight (KBRA at BB+, Blackstone expecting BB); the paid section covers how roughly $1 trillion of commitments get funded and who is lending (read time estimated).", "tags": ["AI credit", "credit ratings", "IPO"], "paywall": true, "listedOn": "2026-11-15"}, {"title": "Data Centers Are Likely to Benefit Some Tenth District Economies, but the Path for Construction Looks Uncertain", "source": "Kansas City Fed Economic Bulletin (John McCoy)", "date": "2026-11-13", "min": 5, "url": "https://www.kansascityfed.org/research/economic-bulletin/data-centers-are-likely-to-benefit-some-tenth-district-economies-but-the-path-for-construction-looks-uncertain/", "why": "Using Aterio project data, McCoy shows announced data centers would use 17 to 23 percent of existing electric capacity in Tenth District states by 2031 (Kansas sector power use up more than 350 percent), and maps local moratoriums against the project pipeline, including five of Colorado's eight announced sites now sitting in counties with a moratorium. It is a concrete, ground-level read on the power and permitting constraints behind the AI capex slowdown debate.", "tags": ["AI capex", "power", "supply chains"], "paywall": false, "listedOn": "2026-11-15"}, {"title": "Nvidia and the World Without Jensen", "source": "SemiAnalysis (Dylan Patel, Doug, Wayne Ma, Jordan Nanos)", "date": "2026-11-12", "min": 19, "url": "https://newsletter.semianalysis.com/p/nvidia-and-the-world-without-jensen", "why": "Using its Accelerator Model, SemiAnalysis says more than 1.5GW of restricted Nvidia GPUs ended up in China and ties the speed of Huang's resignation to export-control enforcement and the pending Remote Access Security Act in the Senate, with Taiwan smuggling indictments as supporting detail. It also lays out what Nvidia loses in supplier commitments and its open-source push, which matters for sizing the China and neocloud demand at risk; the free section is long and the final \"what Nvidia looks like\" section is paywalled.", "tags": ["supply chains", "AI", "export controls"], "paywall": true, "listedOn": "2026-11-16"}, {"title": "Treasury Buybacks and the Convenience Yield", "source": "St. Louis Fed On the Economy (Paulina Restrepo-Echavarría, Bontu Ankit Patro)", "date": "2026-11-12", "min": 5, "url": "https://www.stlouisfed.org/on-the-economy/2026/nov/treasury-buybacks-convenience-yield", "why": "The authors track the Aaa corporate-Treasury spread and Treasury-OIS spreads around the September 9 doubling of long-end liquidity-support buybacks and find no visible reversal in the decline of the Treasury convenience yield, with the most negative spreads at the longest maturities. Their read is that buybacks fix off-the-run illiquidity as designed but cannot offset a structural erosion of the premium investors pay to hold US government debt, which matters for anyone leaning on Treasury support to cap long yields.", "tags": ["market structure", "Treasuries", "rates"], "paywall": false, "listedOn": "2026-11-12"}, {"title": "Reading the room: what Reddit tells us about retail investor sentiment", "source": "ECB Blog (Fabian Wagner, Julian Metzler)", "date": "2026-11-12", "min": 6, "url": "https://www.ecb.europa.eu/press/blog/date/2026/html/ecb.blog20261112~a4c8b903d9.en.html", "why": "ECB staff use an LLM to classify posts across r/wallstreetbets, r/stocks, r/investing and other subreddits into a daily retail sentiment index, decomposed by topic, with changes predicting next-day equity returns, especially in downturns. Topic sub-indexes for the Magnificent Seven and Bitcoin track prices but swing harder, giving a high-frequency read on speculative retail positioning that surveys miss.", "tags": ["positioning", "flows", "AI"], "paywall": false, "listedOn": "2026-11-13"}, {"title": "Banking System Vulnerability: 2026 Update", "source": "NY Fed Liberty Street Economics (Crosignani, Eisenbach, Fringuellotti)", "date": "2026-11-12", "min": 6, "url": "https://libertystreeteconomics.newyorkfed.org/2026/11/banking-system-vulnerability-2026-update/", "why": "The annual update of the New York Fed's four bank-vulnerability models (capital, fire-sale, liquidity, run) through 2026:Q2 finds three of four rising: the 2008-redux capital gap jumped to $16.9 billion from $1.9 billion, and the liquidity stress ratio is at its highest since 2014. None is near pre-2008 levels, but the turn since the March 2026 rate rise is a concrete gauge of how much stress the banking system could amplify.", "tags": ["financial stability", "banks"], "paywall": false, "listedOn": "2026-11-13"}, {"title": "AI, accountability and the economics of evidence", "source": "Bank of England Bank Underground (Benjamin Guin)", "date": "2026-11-11", "min": 8, "url": "https://bankunderground.co.uk/2026/11/11/ai-accountability-and-the-economics-of-evidence/", "why": "Guin argues that AI collapses the cost of producing polished analysis (the BoE/FCA 2026 survey has 86% of UK financial firms using AI, up from 58% in 2022) while the accountable attention of decision-makers stays fixed, so the binding constraint moves from producing evidence to deciding what to trust. For regulators and investment committees alike, the implication is that filtering and provenance, not more research output, become the scarce skill.", "tags": ["AI", "financial regulation"], "paywall": false, "listedOn": "2026-11-16"}, {"title": "A Layman Thinks About AI", "source": "Oaktree Capital, Memos from Howard Marks", "date": "2026-11-11", "min": 28, "url": "https://www.oaktreecapital.com/insights/memo/a-layman-thinks-about-ai", "why": "Marks works through eleven questions on AI, from who captures the profits and the data-center outlook to whether markets are dangerously reliant on a single factor and whether it is a bubble. The credit section is the most useful part: citing Goldman, he puts AI-related debt issuance near $600 billion globally this year, with about $400 billion in US investment grade (over a fifth of supply and around 12% of the Bloomberg USD IG index), and roughly $1 trillion a year of new capital still needed.", "tags": ["AI credit", "credit", "AI"], "paywall": false, "listedOn": "2026-11-12"}, {"title": "Ready-to-run global liquidity stress tests for banks and banking systems", "source": "BIS Working Paper No 1394 (Schmieder, Wei, Ong)", "date": "2026-11-11", "min": 6, "url": "https://www.bis.org/publications/working-paper-1394-ready-to-run-global-liquidity-stress-tests-banks-and-banking-systems", "why": "The BIS releases a free top-down liquidity stress-testing toolkit covering nearly 13,000 banks in more than 100 economies, summarized by a break-even stress factor showing how much worse than baseline a shock must be before a bank runs out of liquidity. Buffers have strengthened since Basel III, but the authors flag wide cross-country dispersion, persistent rankings of weak systems, and faster digital deposit run-offs plus nonbank linkages as the risks that LCR disclosures miss.", "tags": ["financial stability", "banks", "liquidity"], "paywall": false, "listedOn": "2026-11-15"}, {"title": "Record Volatility, Resilient Liquidity: What the September/October Bond Sell-Off Reveals About Rates Market Structure", "source": "Tradeweb Insights (Casey Costanza, Rodérick Joniaux)", "date": "2026-11-10", "min": 6, "url": "https://www.tradeweb.com/newsroom/media-center/insights/blog/record-volatility-resilient-liquidity-what-the-septemberoctober-bond-sell-off-reveals-about-rates-market-structure/", "why": "Using its own platform data, Tradeweb shows that as the 10-year Treasury hit 5.3% and Gilts and OATs made multi-decade highs, institutional US Treasury volume ran 33-34% above a year earlier while 10-year bid-offer spreads in the US and Germany moved less than a third of a basis point. It benchmarks the sell-off against March 2026, Liberation Day, SVB and Covid, a useful venue-level counterpoint to worries about Treasury market fragility (written by a trading venue, so read it with that in mind).", "tags": ["market structure", "rates", "liquidity"], "paywall": false, "listedOn": "2026-11-12"}, {"title": "China's undervalued currency is driving its trade surplus higher", "source": "PIIE RealTime Economics (Joseph E. Gagnon, Nishtha Agrawal)", "date": "2026-11-09", "min": 6, "url": "https://www.piie.com/blogs/realtime-economics/2026/chinas-undervalued-currency-driving-its-trade-surplus-higher", "why": "Gagnon and Agrawal estimate the renminbi is about 20% undervalued: deflation at home against inflation abroad has pushed China's real effective exchange rate about 8% below its 30-year trend even with a stable dollar rate, and the trade surplus relative to world GDP already exceeds the 2000s China Shock peak. That frames the European push to put exchange rates on the agenda with Beijing and the risk of a second wave of trade frictions for manufacturers outside China.", "tags": ["FX", "trade", "macro"], "paywall": false, "listedOn": "2026-11-16"}, {"title": "U.S. Private Credit Vehicles: Institutional Structure and Aggregate Balance Sheets", "source": "Federal Reserve FEDS Notes (Brinkman, Dobridge, Dore, Glossner, Holmquist, Nguyen, Perozek, Stefanescu)", "date": "2026-11-09", "min": 12, "url": "https://www.federalreserve.gov/econres/notes/feds-notes/u-s-private-credit-vehicles-institutional-structure-and-aggregate-balance-sheets-20261109.html", "why": "Using new Financial Accounts data, Fed staff size U.S. private credit vehicles at about $1.9 trillion at end-2025 (up from $240 billion in 2012, and 21% in 2025 alone), split across private debt funds, BDCs, interval and tender offer funds and middle-market CLOs, with banks supplying most of their roughly $500 billion of debt. The useful part is the vehicle-by-vehicle view of leverage (BDCs near 1x, PD funds about 0.25x) and redemption terms, which shows where liquidity stress from retail-facing structures would actually show up.", "tags": ["private credit", "financial stability"], "paywall": false, "listedOn": "2026-11-10"}, {"title": "Maritime Chokepoint Disruptions, Trade and U.S. Inflation", "source": "Dallas Fed Working Paper 2638 (Ricardo Reyes-Heroles, Xiaoqing Zhou)", "date": "2026-11-09", "min": 77, "url": "https://www.dallasfed.org/research/papers/2026/wp2638", "why": "Using satellite vessel tracking to identify chokepoint shocks, the authors find a major disruption lifts US consumer prices about 0.2 percent for nearly two years, mostly through core goods via freight, import and producer prices. Their model says the Red Sea crisis added about 0.4 point to PCE inflation, while the 2026 Hormuz closure added about 0.2 point through shipping alone, and that looking through the shock cushions output but does not remove the inflation.", "tags": ["supply chains", "inflation"], "paywall": false, "listedOn": "2026-11-17"}, {"title": "We the People…", "source": "Citadel Securities Some Macro Thoughts (Nohshad Shah)", "date": "2026-11-07", "min": 5, "url": "https://www.citadelsecurities.com/news-and-insights/macro-thoughts/we-the-people/", "why": "Shah argues the midterms turn the politics of AI into a real constraint on the buildout, with Texas permitting and grid connections (and the Governor-elect's moratorium) the near-term bottleneck, and his base case is longer delays and selective resumption. For investors that raises the value of compute already running versus capacity still to be permitted and financed, favoring hyperscalers with power access over hardware suppliers exposed to order deferrals.", "tags": ["AI credit", "macro", "positioning"], "paywall": false, "listedOn": "2026-11-11"}];
const K="mr-read:";const isRead=u=>localStorage.getItem(K+u)!==null;
const M=["January","February","March","April","May","June","July","August","September","October","November","December"];
const fd=s=>{const[y,m,d]=s.split("-").map(Number);return M[m-1]+" "+d+", "+y};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function card(it,top,readMode){const d=document.createElement("article");d.className="it"+(top?" top":"");
d.innerHTML='<div><a target="_blank" rel="noopener" href="'+esc(it.url)+'">'+esc(it.title)+'</a>'+
'<div class="meta"><span class="src">'+esc(it.source)+'</span> &middot; '+fd(it.date)+' &middot; '+it.min+' min'+(it.paywall?' &middot; <span class="pw">Paywall</span>':'')+'</div><p class="why">'+esc(it.why)+'</p><div class="rate">'+["bad","neutral","good"].map(v=>'<button data-v="'+v+'"'+(getR(it.url)&&getR(it.url).rating===v?' class="on" aria-pressed="true"':' aria-pressed="false"')+'>'+v+'</button>').join("")+'</div></div>'+
'<div class="ctl">'+(readMode?'<button class="undo">Undo</button>':'<input class="ck" type="checkbox" aria-label="Mark read" title="Mark read">')+'</div>';
d.querySelectorAll(".rate button").forEach(b=>b.onclick=()=>{setR(it,b.dataset.v);render();sync()});
if(readMode)d.querySelector(".undo").onclick=()=>{localStorage.removeItem(K+it.url);render();sync()};
else d.querySelector("input").onchange=()=>{localStorage.setItem(K+it.url,new Date().toISOString());render();sync()};return d}
const RK="mr-rate:";const getR=u=>{try{return JSON.parse(localStorage.getItem(RK+u))}catch(e){return null}};
function setR(it,v){const c=getR(it.url);if(c&&c.rating===v)localStorage.removeItem(RK+it.url);else localStorage.setItem(RK+it.url,JSON.stringify({rating:v,ratedAt:new Date().toISOString(),url:it.url,title:it.title,source:it.source,published:it.date,tags:it.tags||[]}))}
function collect(){const seen={},out=[];const add=(u,meta)=>{if(seen[u])return;const r=getR(u),ra=localStorage.getItem(K+u);if(!r&&ra===null)return;seen[u]=1;const m=meta||r||{};out.push({url:u,title:m.title||null,source:m.source||null,published:m.date||m.published||null,read:ra!==null,readAt:ra,rating:r?r.rating:null,ratedAt:r?r.ratedAt:null,tags:m.tags||[]})};
ITEMS.forEach(i=>add(i.url,i));for(let j=0;j<localStorage.length;j++){const k=localStorage.key(j);if(k.startsWith(RK))add(k.slice(RK.length));else if(k.startsWith(K))add(k.slice(K.length))}return out}
function exportJSON(){return {exportedAt:new Date().toISOString(),items:collect()}}
function msg(s){const m=document.getElementById("xm");m.textContent=s;clearTimeout(msg.t);msg.t=setTimeout(()=>m.textContent="",4000)}
function dl(s){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"application/json"}));a.download="ratings.json";a.click()}
async function copy(s){try{await navigator.clipboard.writeText(s);return true}catch(e){return false}}
const ISS="https://github.com/LongOnlyAnalyst/morning-reads/issues/new";const MAXURL=7000;
function payload(now){return {exportedAt:(now||new Date()).toISOString(),items:collect().map(i=>({url:i.url,rating:i.rating,ratedAt:i.ratedAt,read:i.read,readAt:i.readAt,source:i.source,title:(i.title||"").slice(0,60),tags:i.tags}))}}
function issueURL(now){const d=(now||new Date()).toISOString().slice(0,10);const p=payload(now);
const title="Ratings export "+d;const json=JSON.stringify(p);const u=ISS+"?title="+encodeURIComponent(title)+"&body="+encodeURIComponent("```json\n"+json+"\n```");
return u.length<=MAXURL?{url:u,fallback:false,json}:{url:ISS+"?title="+encodeURIComponent(title)+"&body="+encodeURIComponent("Paste the ratings JSON from your clipboard here."),fallback:true,json:"```json\n"+json+"\n```"}}
document.getElementById("xe").onclick=async()=>{const s=JSON.stringify(exportJSON(),null,1);if(await copy(s))msg("Copied");else{dl(s);msg("Downloaded ratings.json")}};
document.getElementById("xs").onclick=async()=>{const r=issueURL();if(r.fallback){await copy(r.json);msg("JSON copied; paste it into the issue")}window.open(r.url,"_blank","noopener")};
