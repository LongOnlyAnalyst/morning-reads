<title>Morning Reads</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon.ico" sizes="any"><meta name="theme-color" content="#141311">
<style>
:root{--bg:#141311;--tx:#ece7dd;--sub:#b9b2a6;--mut:#857e72;--line:#2c2924;--acc:#c2a36b}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.6 "Iowan Old Style","Charter","Bitstream Charter",Georgia,"Times New Roman",serif;-webkit-font-smoothing:antialiased}
.sans,.meta,.tabs,.kick,.upd,h2{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Arial,sans-serif}
main{max-width:720px;margin:0 auto;padding:72px 28px 96px}
header{border-bottom:1px solid var(--line);padding-bottom:22px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
h1{margin:0;font-weight:400;font-size:2.6rem;letter-spacing:-.01em;line-height:1.1}
.upd{color:var(--mut);font-size:.78rem;letter-spacing:.02em;margin-top:10px}
.tabs{display:flex;gap:22px;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.tabs button{background:none;border:0;padding:0 0 3px;color:var(--mut);cursor:pointer;font:inherit;letter-spacing:inherit;border-bottom:1px solid transparent}
.tabs button.on{color:var(--tx);border-bottom-color:var(--acc)}
h2{font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin:56px 0 0}
.it{display:grid;grid-template-columns:1fr auto;gap:0 28px;padding:28px 0;border-bottom:1px solid var(--line)}
.it a{color:var(--tx);text-decoration:none;font-size:1.32rem;line-height:1.3;font-weight:400}
.it.top a{font-size:1.6rem;line-height:1.25}
.it a:hover{color:var(--acc)}
.meta{color:var(--mut);font-size:.78rem;letter-spacing:.02em;margin:10px 0 12px}
.meta .src{color:var(--sub)}.pw{color:var(--acc)}
.why{margin:0;color:var(--sub);font-size:1rem;line-height:1.62}
.ctl{padding-top:6px}
.ck{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:1px solid var(--mut);border-radius:2px;margin:0;cursor:pointer;background:none;display:block}
.ck:hover{border-color:var(--acc)}.ck:checked{background:var(--acc);border-color:var(--acc)}
.undo{background:none;border:0;border-bottom:1px solid var(--mut);color:var(--sub);padding:0;cursor:pointer;font:500 .75rem/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.undo:hover{color:var(--acc);border-color:var(--acc)}
.rate{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Arial,sans-serif;font-size:.72rem;letter-spacing:.06em;text-transform:lowercase;margin-top:12px;display:flex;gap:16px}
.rate button,.xp button{background:none;border:0;padding:0 0 2px;color:var(--mut);cursor:pointer;font:inherit;letter-spacing:inherit;border-bottom:1px solid transparent}
.rate button:hover,.xp button:hover{color:var(--sub)}.rate button.on{color:var(--acc);border-bottom-color:var(--acc)}
.xp{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Arial,sans-serif;font-size:.72rem;letter-spacing:.04em;color:var(--mut);display:flex;gap:18px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.xp .msg{color:var(--sub)}
.empty{color:var(--mut);padding:28px 0;margin:0;font-style:italic}
@media(max-width:560px){main{padding:40px 20px 72px}h1{font-size:2rem}.it.top a{font-size:1.32rem}.it a{font-size:1.16rem}.it{gap:0 18px;padding:24px 0}h2{margin-top:44px}}
</style></head><body><main>

</main><script>
const ITEMS=[{"title": "Reading the room: what Reddit tells us about retail investor sentiment", "source": "ECB Blog (Fabian Wagner, Julian Metzler)", "date": "2026-11-12", "min": 6, "url": "https://www.ecb.europa.eu/press/blog/date/2026/html/ecb.blog20261112~a4c8b903d9.en.html", "why": "ECB staff use an LLM to classify posts across r/wallstreetbets, r/stocks, r/investing and other subreddits into a daily retail sentiment index, decomposed by topic, with changes predicting next-day equity returns, especially in downturns. Topic sub-indexes for the Magnificent Seven and Bitcoin track prices but swing harder, giving a high-frequency read on speculative retail positioning that surveys miss.", "tags": ["positioning", "flows", "AI"], "paywall": false, "top": true, "listedOn": "2026-11-13"}, {"title": "Banking System Vulnerability: 2026 Update", "source": "NY Fed Liberty Street Economics (Crosignani, Eisenbach, Fringuellotti)", "date": "2026-11-12", "min": 6, "url": "https://libertystreeteconomics.newyorkfed.org/2026/11/banking-system-vulnerability-2026-update/", "why": "The annual update of the New York Fed's four bank-vulnerability models (capital, fire-sale, liquidity, run) through 2026:Q2 finds three of four rising: the 2008-redux capital gap jumped to $16.9 billion from $1.9 billion, and the liquidity stress ratio is at its highest since 2014. None is near pre-2008 levels, but the turn since the March 2026 rate rise is a concrete gauge of how much stress the banking system could amplify.", "tags": ["financial stability", "banks"], "paywall": false, "top": true, "listedOn": "2026-11-13"}, {"title": "Reading the economy from earnings calls with generative AI", "source": "VoxEU/CEPR (Jha, Qian, Weber, Yang)", "date": "2026-11-12", "min": 5, "url": "https://cepr.org/voxeu/columns/reading-economy-earnings-calls-generative-ai", "why": "The authors have an LLM score managers' outlook for the US economy across 125,830 earnings-call transcripts since 2006; the resulting index predicts GDP growth up to five quarters out beyond term and credit spreads and holds its own against the Survey of Professional Forecasters. The signal comes from historically accurate managers and survives look-ahead-bias checks, making it a cheap alternative read as official survey response rates fall.", "tags": ["macro", "AI", "earnings"], "paywall": false, "top": true, "listedOn": "2026-11-13"}, {"title": "Treasury Buybacks and the Convenience Yield", "source": "St. Louis Fed On the Economy (Paulina Restrepo-Echavarría, Bontu Ankit Patro)", "date": "2026-11-12", "min": 5, "url": "https://www.stlouisfed.org/on-the-economy/2026/nov/treasury-buybacks-convenience-yield", "why": "The authors track the Aaa corporate-Treasury spread and Treasury-OIS spreads around the September 9 doubling of long-end liquidity-support buybacks and find no visible reversal in the decline of the Treasury convenience yield, with the most negative spreads at the longest maturities. Their read is that buybacks fix off-the-run illiquidity as designed but cannot offset a structural erosion of the premium investors pay to hold US government debt, which matters for anyone leaning on Treasury support to cap long yields.", "tags": ["market structure", "Treasuries", "rates"], "paywall": false, "listedOn": "2026-11-12"}, {"title": "Shock absorbers? Energy prices, labour market slack and monetary policy: a view through the lens of a structural model", "source": "Bank of England Bank Underground (Albuquerque, Lenney, McKernan, Murakami, Paz, Schnattinger)", "date": "2026-11-12", "min": 8, "url": "https://bankunderground.co.uk/2026/11/12/shock-absorbers-energy-prices-labour-market-slack-and-monetary-policy-a-view-through-the-lens-of-a-structural-model/", "why": "BoE staff use a structural model, rather than a standard linear solution, to show that an energy shock is roughly twice as inflationary when vacancies are plentiful relative to job-seekers, because scarce workers can claw back real income through wages and spread the shock into core prices. With energy prices jumping again after the Middle East conflict and the UK Beveridge curve now much looser than in 2022, it is a clean framework for judging whether this oil shock repeats 2022 or fades.", "tags": ["macro", "energy", "inflation"], "paywall": false, "listedOn": "2026-11-12"}, {"title": "The Surprising Resilience of Corporate Profit Margins", "source": "Richmond Fed Economic Brief 26-37 (Anna Kovner, Lorelei Lin)", "date": "2026-11-12", "min": 5, "url": "https://www.richmondfed.org/publications/research/economic_brief/2026/eb_26-37", "why": "Despite a decade of pandemic, tariff and war-driven input shocks, the median public company's gross margin rose about 3 points, and margins grew more than 10 percent even within the five largest industries, with business-facing firms outpacing consumer-facing ones. The Richmond Fed's research director concludes firms have passed costs through, so margin pressure is not what is driving the falling labor share.", "tags": ["earnings", "supply chains", "inflation"], "paywall": false, "listedOn": "2026-11-13"}, {"title": "A Layman Thinks About AI", "source": "Oaktree Capital, Memos from Howard Marks", "date": "2026-11-11", "min": 28, "url": "https://www.oaktreecapital.com/insights/memo/a-layman-thinks-about-ai", "why": "Marks works through eleven questions on AI, from who captures the profits and the data-center outlook to whether markets are dangerously reliant on a single factor and whether it is a bubble. The credit section is the most useful part: citing Goldman, he puts AI-related debt issuance near $600 billion globally this year, with about $400 billion in US investment grade (over a fifth of supply and around 12% of the Bloomberg USD IG index), and roughly $1 trillion a year of new capital still needed.", "tags": ["AI credit", "credit", "AI"], "paywall": false, "listedOn": "2026-11-12"}, {"title": "The Perfect Storm That Clobbered Hedge Funds", "source": "Bloomberg Odd Lots (podcast episode, Nishant Kumar and Michael Ball)", "date": "2026-11-11", "min": 52, "url": "https://omny.fm/shows/odd-lots/the-perfect-storm-that-clobbered-hedge-funds", "why": "Recorded November 10, this two-parter dissects why October was one of the worst months in memory for hedge funds, centred on whether multi-strategy pods that were supposed to be uncorrelated were all implicitly long the AI trade without their risk managers realising it. The second half covers post-midterm macro, the AI buildout and the Anthropic IPO as crowded positions keep unwinding.", "tags": ["positioning", "hedge funds", "AI"], "paywall": false, "listedOn": "2026-11-11"}, {"title": "Record Volatility, Resilient Liquidity: What the September/October Bond Sell-Off Reveals About Rates Market Structure", "source": "Tradeweb Insights (Casey Costanza, Rodérick Joniaux)", "date": "2026-11-10", "min": 6, "url": "https://www.tradeweb.com/newsroom/media-center/insights/blog/record-volatility-resilient-liquidity-what-the-septemberoctober-bond-sell-off-reveals-about-rates-market-structure/", "why": "Using its own platform data, Tradeweb shows that as the 10-year Treasury hit 5.3% and Gilts and OATs made multi-decade highs, institutional US Treasury volume ran 33-34% above a year earlier while 10-year bid-offer spreads in the US and Germany moved less than a third of a basis point. It benchmarks the sell-off against March 2026, Liberation Day, SVB and Covid, a useful venue-level counterpoint to worries about Treasury market fragility (written by a trading venue, so read it with that in mind).", "tags": ["market structure", "rates", "liquidity"], "paywall": false, "listedOn": "2026-11-12"}, {"title": "US monetary policy, macroeconomic news and the global secular decline of interest rates", "source": "BIS Working Paper No 1393 (Hofmann, Li, Wu)", "date": "2026-11-10", "min": 6, "url": "https://www.bis.org/publications/working-paper-1393-us-monetary-policy-macroeconomic-news-and-global-secular-decline-interest-rates", "why": "The paper finds that the decline in long-term yields across ten advanced economies since the 1990s happened mostly inside FOMC announcement windows, and that it ran through the expected path of short rates rather than term premia. The effect is concentrated in windows preceded by macro news, which the authors read as markets repeatedly revising the Fed's reaction function, a useful frame for how US policy sets global rates.", "tags": ["rates", "monetary policy", "global spillovers"], "paywall": false, "listedOn": "2026-11-11"}, {"title": "A Look at the Wider Divide in Credit Card Delinquency by Income", "source": "NY Fed Liberty Street Economics (Lee, Mangrum, Scally, Sinha, van der Klaauw)", "date": "2026-11-10", "min": 15, "url": "https://libertystreeteconomics.newyorkfed.org/2026/11/a-look-at-the-wider-divide-in-credit-card-delinquency-by-income/", "why": "Alongside the Q3 household debt report (balances up $334 billion), the authors show the gap in new credit card delinquency between low- and high-income zip codes has widened since 2022. They trace much of the distress to cards issued during the pandemic, when a growing share went to lower-income, lower-score borrowers, which helps separate vintage effects from a broad consumer downturn.", "tags": ["consumer credit", "financial stability"], "paywall": false, "listedOn": "2026-11-11"}, {"title": "Is the U.S. 'exorbitant privilege' of favorable rates fading?", "source": "Dallas Fed Economics (Scott Davis, Abigail MacLean)", "date": "2026-11-10", "min": 7, "url": "https://www.dallasfed.org/research/economics/2026/1110", "why": "U.S. net income on foreign investments, which paid for about 40 percent of the trade deficit in the decade before the pandemic, turned negative in 2024 for the first time since at least 1960. The authors break the drop into a shrinking net equity position after years of U.S. stock outperformance and higher yields on a large net debt position, which is why foreign borrowing is now near 4 percent of GDP, the most since 2008.", "tags": ["flows", "dollar", "external balance"], "paywall": false, "listedOn": "2026-11-11"}, {"title": "The Federal Reserve's Balance Sheet Size and \"Other Deposits\": Some Financial Stability Considerations", "source": "Chicago Fed Letter No. 531 (Cindy Hull, Brett Solimine)", "date": "2026-11-10", "min": 14, "url": "https://www.chicagofed.org/-/media/publications/chicago-fed-letter/2026/cfl531.pdf?sc_lang=en", "why": "Clearinghouse cash at the Fed has climbed to a record of about $250 billion, and every dollar of it drains a dollar of bank reserves, so it matters for any plan to shrink the balance sheet. The letter weighs cutting the interest rate paid, capping balances, or giving clearinghouses standing repo access, and flags the wrong-way risk of pushing that cash into commercial banks, with the Treasury clearing mandate set to add more margin.", "tags": ["market structure", "financial stability", "Fed balance sheet"], "paywall": false, "listedOn": "2026-11-11"}, {"title": "External Wealth of Nations 2025 update: AI stock prices and global imbalances", "source": "Brookings Hutchins Center (Gian Maria Milesi-Ferretti)", "date": "2026-11-10", "min": 6, "url": "https://www.brookings.edu/articles/external-wealth-of-nations-2025-update/", "why": "The year-end 2025 update of the Lane/Milesi-Ferretti database shows dollar weakness and foreign stock gains offset most of $1.2 trillion of US net borrowing, leaving the US net debtor position near $23 trillion ex gold, two-thirds of it in debt. It also shows AI equity booms at Samsung, SK Hynix, ASML and TSMC eroding the net creditor positions of Korea, the Netherlands and Taiwan, a clean picture of how AI valuations feed through global balance sheets.", "tags": ["flows", "AI", "global imbalances"], "paywall": false, "listedOn": "2026-11-13"}, {"title": "Job Finding and Unemployment in the Age of AI", "source": "Cleveland Fed Economic Commentary 2026-26 (Barış Kaymak)", "date": "2026-11-09", "min": 15, "url": "https://www.clevelandfed.org/publications/economic-commentary/2026/ec-202626-job-finding-and-unemployment-in-the-age-of-ai", "why": "Since generative AI became widely available, unemployment for 23-54 year olds has risen about 1 percentage point more in the most AI-exposed occupations than in the least exposed relative to 2015-2019, and the gap is larger for 23-30 year olds. Labor-flow data show the cause is lower job-finding rates, not more separations, which suggests AI so far is closing the entry door to exposed jobs rather than displacing people already in them.", "tags": ["AI", "labor"], "paywall": false, "listedOn": "2026-11-12"}, {"title": "U.S. Private Credit Vehicles: Institutional Structure and Aggregate Balance Sheets", "source": "Federal Reserve FEDS Notes (Brinkman, Dobridge, Dore, Glossner, Holmquist, Nguyen, Perozek, Stefanescu)", "date": "2026-11-09", "min": 12, "url": "https://www.federalreserve.gov/econres/notes/feds-notes/u-s-private-credit-vehicles-institutional-structure-and-aggregate-balance-sheets-20261109.html", "why": "Using new Financial Accounts data, Fed staff size U.S. private credit vehicles at about $1.9 trillion at end-2025 (up from $240 billion in 2012, and 21% in 2025 alone), split across private debt funds, BDCs, interval and tender offer funds and middle-market CLOs, with banks supplying most of their roughly $500 billion of debt. The useful part is the vehicle-by-vehicle view of leverage (BDCs near 1x, PD funds about 0.25x) and redemption terms, which shows where liquidity stress from retail-facing structures would actually show up.", "tags": ["private credit", "financial stability"], "paywall": false, "listedOn": "2026-11-10"}, {"title": "The AI Boom's Two Engines", "source": "PIIE RealTime Economics (Jason Furman)", "date": "2026-11-09", "min": 13, "url": "https://www.piie.com/blogs/realtime-economics/2026/ai-booms-two-engines", "why": "Furman runs the Fed's own FRB/US model and finds the data-center buildout has added only about 0.3 percent to GDP because roughly three-quarters of the spending is imported, while the wealth effect from about $11 trillion of excess gains in seven AI stocks matters more. The upshot is that a smaller buildout would be easy to absorb, but a stock market fall is the real risk, and forward-looking rate expectations could wipe out the gains.", "tags": ["AI capex", "macro", "equity wealth effect"], "paywall": false, "listedOn": "2026-11-11"}, {"title": "IRR, Dollars of Alpha, or Dollars of Fees", "source": "The Diff (Byrne Hobart)", "date": "2026-11-09", "min": 8, "url": "https://www.thediff.co/archive/irr-dollars-of-alpha-or-dollars-of-fees/", "why": "Written after a week of hedge funds shutting long/short books and Sequoia pulling back, this lays out why asset managers keep expanding into adjacent strategies and why it often fails for quant shops moving into discretionary equity. It is a clear framework for how multi-manager pods and multi-stage VC grow until available alpha, not capital, becomes the limit; the lead essay is free, with some later sections behind the paywall.", "tags": ["positioning", "hedge funds", "asset management"], "paywall": false, "listedOn": "2026-11-11"}, {"title": "We the People…", "source": "Citadel Securities Some Macro Thoughts (Nohshad Shah)", "date": "2026-11-07", "min": 5, "url": "https://www.citadelsecurities.com/news-and-insights/macro-thoughts/we-the-people/", "why": "Shah argues the midterms turn the politics of AI into a real constraint on the buildout, with Texas permitting and grid connections (and the Governor-elect's moratorium) the near-term bottleneck, and his base case is longer delays and selective resumption. For investors that raises the value of compute already running versus capacity still to be permitted and financed, favoring hyperscalers with power access over hardware suppliers exposed to order deferrals.", "tags": ["AI credit", "macro", "positioning"], "paywall": false, "listedOn": "2026-11-11"}, {"title": "Welfare gains from top firms' productivity substantially reduced by their increased market power", "source": "Minneapolis Fed (Jeff Horwich on De Loecker, Eeckhout, Mongey)", "date": "2026-11-06", "min": 4, "url": "https://www.minneapolisfed.org/article/2026/welfare-gains-from-top-firms-productivity-substantially-reduced-by-their-increased-market-power", "why": "A summary of new Minneapolis Fed Staff Report 688, whose structural model links rising markups, rising overhead costs and falling business dynamism since 1980 to technology gains concentrating in fewer firms. The authors estimate this left US output 6 percent and welfare 5 percent lower by 2023 than under the 1980 market structure, relevant to how AI-era productivity gains may be shared.", "tags": ["market power", "productivity"], "paywall": false, "listedOn": "2026-11-13"}];
const K="mr-read:";const isRead=u=>localStorage.getItem(K+u)!==null;
const M=["January","February","March","April","May","June","July","August","September","October","November","December"];
const fd=s=>{const[y,m,d]=s.split("-").map(Number);return M[m-1]+" "+d+", "+y};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function card(it,top,readMode){const d=document.createElement("article");d.className="it"+(top?" top":"");
d.innerHTML='<div><a target="_blank" rel="noopener" href="'+esc(it.url)+'">'+esc(it.title)+'</a>'+
'<div class="meta"><span class="src">'+esc(it.source)+'</span> &middot; '+fd(it.date)+' &middot; '+it.min+' min'+(it.paywall?' &middot; <span class="pw">Paywall</span>':'')+'</div><p class="why">'+esc(it.why)+'</p><div class="rate">'+["bad","neutral","good"].map(v=>'<button data-v="'+v+'"'+(getR(it.url)&&getR(it.url).rating===v?' class="on" aria-pressed="true"':' aria-pressed="false"')+'>'+v+'</button>').join("")+'</div></div>'+
'<div class="ctl">'+(readMode?'<button class="undo">Undo</button>':'<input class="ck" type="checkbox" aria-label="Mark read" title="Mark read">')+'</div>';
d.querySelectorAll(".rate button").forEach(b=>b.onclick=()=>{setR(it,b.dataset.v);render();sync()});
if(readMode)d.querySelector(".undo").onclick=()=>{localStorage.removeItem(K+it.url);render();sync()};
else d.querySelector("input").onchange=()=>{localStorage.setItem(K+it.url,new Date().toISOString());render();sync()};return d}
const RK="mr-rate:";const getR=u=>{try{return JSON.parse(localStorage.getItem(RK+u))}catch(e){return null}};
function setR(it,v){const c=getR(it.url);if(c&&c.rating===v)localStorage.removeItem(RK+it.url);else localStorage.setItem(RK+it.url,JSON.stringify({rating:v,ratedAt:new Date().toISOString(),url:it.url,title:it.title,source:it.source,published:it.date,tags:it.tags||[]}))}
function collect(){const seen={},out=[];const add=(u,meta)=>{if(seen[u])return;const r=getR(u),ra=localStorage.getItem(K+u);if(!r&&ra===null)return;seen[u]=1;const m=meta||r||{};out.push({url:u,title:m.title||null,source:m.source||null,published:m.date||m.published||null,read:ra!==null,readAt:ra,rating:r?r.rating:null,ratedAt:r?r.ratedAt:null,tags:m.tags||[]})};
ITEMS.forEach(i=>add(i.url,i));for(let j=0;j<localStorage.length;j++){const k=localStorage.key(j);if(k.startsWith(RK))add(k.slice(RK.length));else if(k.startsWith(K))add(k.slice(K.length))}return out}
function exportJSON(){return {exportedAt:new Date().toISOString(),items:collect()}}
function msg(s){const m=document.getElementById("xm");m.textContent=s;clearTimeout(msg.t);msg.t=setTimeout(()=>m.textContent="",4000)}
function dl(s){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"application/json"}));a.download="ratings.json";a.click()}
async function copy(s){try{await navigator.clipboard.writeText(s);return true}catch(e){return false}}
const ISS="https://github.com/LongOnlyAnalyst/morning-reads/issues/new";const MAXURL=7000;
function payload(now){return {exportedAt:(now||new Date()).toISOString(),items:collect().map(i=>({url:i.url,rating:i.rating,ratedAt:i.ratedAt,read:i.read,readAt:i.readAt,source:i.source,title:(i.title||"").slice(0,60),tags:i.tags}))}}
function issueURL(now){const d=(now||new Date()).toISOString().slice(0,10);const p=payload(now);
const title="Ratings export "+d;const json=JSON.stringify(p);const u=ISS+"?title="+encodeURIComponent(title)+"&body="+encodeURIComponent("```json\n"+json+"\n```");
return u.length<=MAXURL?{url:u,fallback:false,json}:{url:ISS+"?title="+encodeURIComponent(title)+"&body="+encodeURIComponent("Paste the ratings JSON from your clipboard here."),fallback:true,json:"```json\n"+json+"\n```"}}
document.getElementById("xe").onclick=async()=>{const s=JSON.stringify(exportJSON(),null,1);if(await copy(s))msg("Copied");else{dl(s);msg("Downloaded ratings.json")}};
document.getElementById("xs").onclick=async()=>{const r=issueURL();if(r.fallback){await copy(r.json);msg("JSON copied; paste it into the issue")}window.open(r.url,"_blank","noopener")};
const SY={t:["github_", "pat_11C", "FLDLJQ0", "pjZWaLo", "XC4W1_N", "GZ15xPe", "k055OWt", "ZTqfr8B", "PdkwUUO", "9BsNWRX", "Cfplg0k", "5VQXB4X", "TJTbh3D", "VS"].join(""),n:1};let syT;
function sync(){if(!SY.t||!SY.n)return;clearTimeout(syT);syT=setTimeout(async()=>{try{const r=await fetch("https://api.github.com/repos/LongOnlyAnalyst/morning-reads/issues/"+SY.n,{method:"PATCH",headers:{Authorization:"Bearer "+SY.t,Accept:"application/vnd.github+json"},body:JSON.stringify({body:"```json\n"+JSON.stringify(payload())+"\n```"})});msg(r.ok?"Synced":"Sync failed")}catch(e){msg("Sync failed")}},3000)}
function render(){const un=ITEMS.filter(i=>!isRead(i.url));const tops=un.filter(i=>i.top),rest=un.filter(i=>!i.top);
while(tops.length<3&&rest.length)tops.push(rest.shift());
const T=document.getElementById("top"),Mo=document.getElementById("more"),R=document.getElementById("read");T.innerHTML=Mo.innerHTML=R.innerHTML="";
tops.forEach(i=>T.appendChild(card(i,true)));rest.forEach(i=>Mo.appendChild(card(i,false)));
const rd=ITEMS.filter(i=>isRead(i.url)).sort((a,b)=>localStorage.getItem(K+b.url).localeCompare(localStorage.getItem(K+a.url)));rd.forEach(i=>R.appendChild(card(i,false,true)));
if(!tops.length)T.innerHTML='<p class="empty">All caught up.</p>';if(!rest.length)Mo.innerHTML='<p class="empty">Nothing else queued.</p>';if(!rd.length)R.innerHTML='<p class="empty">Nothing marked read yet.</p>';
document.getElementById("tU").textContent="Unread "+un.length;document.getElementById("tR").textContent="Read "+rd.length}
function tab(r){document.getElementById("U").hidden=r;document.getElementById("R").hidden=!r;document.getElementById("tU").classList.toggle("on",!r);document.getElementById("tR").classList.toggle("on",r)}
document.getElementById("tU").onclick=()=>tab(false);document.getElementById("tR").onclick=()=>tab(true);render();sync();
</script></body></html>
