<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Morning Reads</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon.ico" sizes="any"><meta name="theme-color" content="#141311">
<style>
:root{--bg:#141311;--tx:#ece7dd;--sub:#b9b2a6;--mut:#857e72;--line:#2c2924;--acc:#c2a36b}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.6 "Iowan Old Style","Charter","Bitstream Charter",Georgia,"Times New Roman",serif;-webkit-font-smoothing:antialiased}
.sans,.meta,.tabs,.kick,.upd,h2{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Arial,sans-serif}
main{max-width:720px;margin:0 auto;padding:72px 28px 96px}
header{border-bottom:1px solid var(--line);padding-bottom:22px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
h1{margin:0;font-weight:400;font-size:2.6rem;letter-spacing:-.01em;line-height:1.1}
.upd{color:var(--mut);font-size:.78rem;letter-spacing:.02em;margin-top:10px}
.tabs{display:flex;gap:22px;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.tabs button{background:none;border:0;padding:0 0 3px;color:var(--mut);cursor:pointer;font:inherit;letter-spacing:inherit;border-bottom:1px solid transparent}
.tabs button.on{color:var(--tx);border-bottom-color:var(--acc)}
h2{font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin:56px 0 0}
.it{display:grid;grid-template-columns:1fr auto;gap:0 28px;padding:28px 0;border-bottom:1px solid var(--line)}
.it a{color:var(--tx);text-decoration:none;font-size:1.32rem;line-height:1.3;font-weight:400}
.it.top a{font-size:1.6rem;line-height:1.25}
.it a:hover{color:var(--acc)}
.meta{color:var(--mut);font-size:.78rem;letter-spacing:.02em;margin:10px 0 12px}
.meta .src{color:var(--sub)}.pw{color:var(--acc)}
.why{margin:0;color:var(--sub);font-size:1rem;line-height:1.62}
.ctl{padding-top:6px}
.ck{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:1px solid var(--mut);border-radius:2px;margin:0;cursor:pointer;background:none;display:block}
.ck:hover{border-color:var(--acc)}.ck:checked{background:var(--acc);border-color:var(--acc)}
.undo{background:none;border:0;border-bottom:1px solid var(--mut);color:var(--sub);padding:0;cursor:pointer;font:500 .75rem/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.undo:hover{color:var(--acc);border-color:var(--acc)}
.rate{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Arial,sans-serif;font-size:.72rem;letter-spacing:.06em;text-transform:lowercase;margin-top:12px;display:flex;gap:16px}
.rate button,.xp button{background:none;border:0;padding:0 0 2px;color:var(--mut);cursor:pointer;font:inherit;letter-spacing:inherit;border-bottom:1px solid transparent}
.rate button:hover,.xp button:hover{color:var(--sub)}.rate button.on{color:var(--acc);border-bottom-color:var(--acc)}
.xp{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Arial,sans-serif;font-size:.72rem;letter-spacing:.04em;color:var(--mut);display:flex;gap:18px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.xp .msg{color:var(--sub)}
.empty{color:var(--mut);padding:28px 0;margin:0;font-style:italic}
@media(max-width:560px){main{padding:40px 20px 72px}h1{font-size:2rem}.it.top a{font-size:1.32rem}.it a{font-size:1.16rem}.it{gap:0 18px;padding:24px 0}h2{margin-top:44px}}
</style></head><body><main>
<header><div><h1>Morning Reads</h1><div class="upd">Updated November 10, 2026, 5:35 AM CT</div></div>
<nav class="tabs"><button id="tU" class="on">Unread</button><button id="tR">Read</button></nav></header>
<div class="xp"><span class="msg" id="xm" aria-live="polite"></span><button id="xe">Export ratings</button><button id="xs">Send to Reading List</button></div>
<div id="U"><h2>Today</h2><div id="top"></div><h2>More to read</h2><div id="more"></div></div>
<div id="R" hidden><h2>Read</h2><div id="read"></div></div>
</main><script>
const ITEMS=[{"title": "U.S. Private Credit Vehicles: Institutional Structure and Aggregate Balance Sheets", "source": "Federal Reserve FEDS Notes (Brinkman, Dobridge, Dore, Glossner, Holmquist, Nguyen, Perozek, Stefanescu)", "date": "2026-11-09", "min": 12, "url": "https://www.federalreserve.gov/econres/notes/feds-notes/u-s-private-credit-vehicles-institutional-structure-and-aggregate-balance-sheets-20261109.html", "why": "Using new Financial Accounts data, Fed staff size U.S. private credit vehicles at about $1.9 trillion at end-2025 (up from $240 billion in 2012, and 21% in 2025 alone), split across private debt funds, BDCs, interval and tender offer funds and middle-market CLOs, with banks supplying most of their roughly $500 billion of debt. The useful part is the vehicle-by-vehicle view of leverage (BDCs near 1x, PD funds about 0.25x) and redemption terms, which shows where liquidity stress from retail-facing structures would actually show up.", "tags": ["private credit", "financial stability"], "paywall": false, "top": true, "listedOn": "2026-11-10"}, {"title": "TMT credit breaks from the pack", "source": "BNY iFlow Special Report (David Tam)", "date": "2026-11-06", "min": 6, "url": "https://www.bny.com/corporate/global/en/solutions/platforms/execution-services/iflow/special-reports/tmt-credit-breaks-from-the-pack.html", "why": "Tam shows credit stress concentrating in tech, media and telecom: since September 1 both IG and HY TMT spreads have widened more than every other sector from an already wider base, while Financials and Energy stay inside the aggregate. He reads it as selective repricing driven by hyperscaler supply and doubts over AI capex returns rather than a broad downturn, and lists what would turn it systemic: wider TMT new-issue concessions, pulled deals and persistent HY fund outflows.", "tags": ["AI credit", "credit spreads", "flows"], "paywall": false, "top": true, "listedOn": "2026-11-08"}, {"title": "Houston, Do We Have A Problem?", "source": "Citadel Securities Global Macro Strategy (Frank Flight)", "date": "2026-11-05", "min": 10, "url": "https://www.citadelsecurities.com/news-and-insights/global-macro-strategy/houston-do-we-have-a-problem/", "why": "Flight reads the midterm backlash against data centres (opposed in at least 39 of 45 local ballot initiatives, with ~45 GW of projects at risk in Texas, Ohio, Pennsylvania and Georgia) as a near-term constraint on AI infrastructure, not a collapse in aggregate investment given capital's mobility. He maps a Peak Capex rotation out of memory, neoclouds and energy into hyperscalers with energised compute, argues rates get a cleaner lower-yield impulse from slower financing demand, and flags that three-month option-implied odds of Brent above $120 have more than halved since late October as midterms may catalyse an Iran settlement.", "tags": ["AI credit", "positioning", "rates"], "paywall": false, "top": true, "listedOn": "2026-11-06"}, {"title": "Is the Nvidia Affair Securities Fraud?", "source": "Matt Levine, Money Stuff (Bloomberg Opinion)", "date": "2026-11-09", "min": 16, "url": "https://www.bloomberg.com/opinion/newsletters/2026-11-09/is-the-nvidia-affair-securities-fraud", "why": "Levine opens by framing AI as a roughly $4 trillion-a-year spending stream about five years out, then turns to how that money gets financed and to whether the news around Nvidia's Jensen Huang raises a securities-fraud question. Also covers hedge-fund mistakes, securities fraud and insider trading; only the opening is readable without a subscription.", "tags": ["AI credit", "market structure"], "paywall": true, "listedOn": "2026-11-10"}, {"title": "Gold Reserve Relocations: Are They Always Bad News for U.S. Dollar Reserves?", "source": "Federal Reserve FEDS Notes (Colin Weiss)", "date": "2026-11-09", "min": 5, "url": "https://www.federalreserve.gov/econres/notes/feds-notes/gold-reserve-relocations-are-they-always-bad-news-for-u-s-dollar-reserves-20261109.html", "why": "Weiss checks whether the German, Dutch and French moves of gold out of U.S. custody came with dollar reserve diversification, and finds they mostly did not: dollar shares stayed around 60 to 90 percent, unlike Russia and Turkey, which cut dollars alongside repatriating gold. It is a short, data-based counter to the reading of gold repatriation headlines as a de-dollarization signal.", "tags": ["reserves", "dollar", "flows"], "paywall": false, "listedOn": "2026-11-10"}, {"title": "Has U.S. Monetary Policy Really Improved? A 150-Year Perspective", "source": "NY Fed Liberty Street Economics (Barnichon, Mesters)", "date": "2026-11-09", "min": 7, "url": "https://libertystreeteconomics.newyorkfed.org/2026/11/has-u-s-monetary-policy-really-improved-a-150-year-perspective/", "why": "The authors score Fed policy against the best feasible response to the shocks each era faced and find meaningful improvement only after Volcker, with the gains concentrated in responses to banking panics and supply shocks. The Great Inflation result, a weak response to energy and inflation-expectations shocks, is directly relevant to how the current oil shock should be handled.", "tags": ["monetary policy", "financial stability"], "paywall": false, "listedOn": "2026-11-10"}, {"title": "The Insatiable Demand for Alpha", "source": "Net Interest (Marc Rubinstein)", "date": "2026-11-06", "min": 10, "url": "https://www.netinterest.co/p/the-insatiable-demand-for-alpha", "why": "Rubinstein uses the Alaska Permanent Fund (hedge funds now 8% of the portfolio, 6.7% a year with no down years since bringing selection in-house in 2016) to show why allocators keep pushing money at capacity-constrained multi-manager platforms. He then argues the current hedge fund shakedown, after Millennium's -2.3% October, could leave the biggest pod shops stronger as they scale toward $100 billion (free preview covers the Alaska setup; the Millennium analysis is paid, read time estimated).", "tags": ["hedge funds", "positioning", "allocators"], "paywall": true, "listedOn": "2026-11-08"}, {"title": "Gaining (and losing) currency: a global database of currencies, 1850-2026", "source": "BIS Working Paper No 1392 (Aldasoro, Frost, Kansal, Schenk)", "date": "2026-11-06", "min": 55, "url": "https://www.bis.org/publications/working-paper-1392-gaining-and-losing-currency-global-database-currencies-1850-2026", "why": "A new database of 568 government currencies since 1850 finds about 70% have been discontinued, the median lasts 33 years and nearly a quarter lasted under a decade; currencies are usually born for political reasons (independence, 28%) but die for economic ones (redenominations and inflation, 55%). It is useful base-rate context for the stablecoin and 'nature of money' debate (landing-page summary takes 3 minutes; full paper is 42 pages).", "tags": ["money", "stablecoins", "history"], "listedOn": "2026-11-08"}, {"title": "Financial Predictionization", "source": "Matt Levine, Money Stuff (Bloomberg Opinion)", "date": "2026-11-05", "min": 16, "url": "https://www.bloomberg.com/opinion/newsletters/2026-11-05/financial-predictionization", "why": "Levine argues the interesting part of 'tokenized real estate' was never the blockchain wrapper—REITs already fractionalize buildings—but the broader push to turn illiquid claims into continuously priced forecast markets. Also covers black-swan funds, data-centre delays and how law firms price billable hours, continuing his recent run on prediction-market plumbing.", "tags": ["market structure", "prediction markets"], "paywall": true, "listedOn": "2026-11-06"}, {"title": "The U.S. Oil Sector's Role in Restraining Prices", "source": "NY Fed Liberty Street Economics (Thomas Klitgaard)", "date": "2026-11-05", "min": 9, "url": "https://libertystreeteconomics.newyorkfed.org/2026/11/the-u-s-oil-sectors-role-in-restraining-prices/", "why": "Klitgaard shows the Middle East supply shock was buffered first by a pre-conflict global oversupply built largely by the U.S. fracking boom (U.S. output 8 to 21 mb/d from 2010–25, 70% of the global gain) and then by U.S. SPR and commercial inventory draws that filled about half the Q2 global gap. U.S. stockpiles stopped falling in July, so the ongoing shortfall is now being absorbed by inventory draws elsewhere, notably China, which frames the two paths for prices depending on whether Middle East output returns.", "tags": ["energy", "commodities", "macro"], "listedOn": "2026-11-06"}, {"title": "November: The Setup Improves", "source": "Citadel Securities Global Market Intelligence (Scott Rubner)", "date": "2026-11-04", "min": 9, "url": "https://www.citadelsecurities.com/news-and-insights/global-market-intelligence/november-the-setup-improves/", "why": "Rubner's post-election flows update: retail has bought US equities for 22 straight sessions (a record $251B year to date), buyback blackouts are lifting against $1.5T of authorizations, and CTA positioning has fallen to -3.3 standard deviations. He pairs that with semis trading at their widest discount to the S&P since 2018 despite rising estimates, making a concrete demand-side case for a year-end rebuild.", "tags": ["flows", "positioning", "market structure"], "paywall": false, "listedOn": "2026-11-05"}, {"title": "AI on the Ballot", "source": "Stratechery (free weekly article; paywall site)", "date": "2026-11-04", "min": 12, "url": "https://stratechery.com/2026/ai-on-the-ballot/", "why": "Thompson argues the midterms made politics the binding constraint on AI buildout, after compute, memory and power, with nearly every local anti-data-center measure winning and Texas's new governor pledging a moratorium on the state that holds over 25% of planned 2030 capacity. His ten takes map who wins under scarce permits (hyperscalers, frontier labs, Apple) and who loses (neoclouds already facing credit stress, Nvidia near term, startups).", "tags": ["AI capex", "tech strategy", "AI credit"], "paywall": true, "listedOn": "2026-11-08"}, {"title": "Scenarios for future banking: implications for profitability, liquidity and solvency", "source": "BIS Working Paper No 1391 (Schmieder, Corrias, Wünsch)", "date": "2026-11-04", "min": 111, "url": "https://www.bis.org/publications/scenarios-future-banking-implications-profitability-liquidity-and-solvency", "why": "Using 9,000 banks across 150+ jurisdictions, the authors run four ten-year scenarios and find traditional banks still hold about three-quarters of system assets while tech-based models may contest roughly 40% of the revenue pool, raising earnings volatility as fees replace NII and digital channels shorten the path from deposit outflow to capital pressure. Supervisory priorities that hold in every scenario: reassess deposit-outflow assumptions, harden third-party operational resilience, treat weak earnings as a solvency risk, and improve data on emerging models (landing-page summary is short; full PDF is 57 pages).", "tags": ["financial stability", "banks", "regulation"], "listedOn": "2026-11-06"}, {"title": "How Market Position Shapes Credit Card Interest Rates", "source": "NY Fed Liberty Street Economics (Herkenhoff, Morelli)", "date": "2026-11-04", "min": 7, "url": "https://libertystreeteconomics.newyorkfed.org/2026/11/how-market-position-shapes-credit-card-interest-rates/", "why": "Using OCC data on 14 million newly issued cards across 960 segmented markets, the authors show lenders pass through less of a funding-cost decline where they hold a large market share. It is a clean look at how monetary policy transmission to consumer credit depends on lender market power, not just borrower risk.", "tags": ["banks", "consumer credit", "rates"], "paywall": false, "listedOn": "2026-11-05"}, {"title": "The Midterm Predictions Were Good", "source": "Matt Levine, Money Stuff (Bloomberg Opinion)", "date": "2026-11-04", "min": 18, "url": "https://www.bloomberg.com/opinion/newsletters/2026-11-04/the-midterm-predictions-were-good", "why": "Levine argues election-night prediction markets (about $2.5 billion of midterm volume on Kalshi) are a genuinely good consumer product, big enough to reward accuracy but not big enough to swamp the elections, and that their core problem is capturing value from large, infrequent positive externalities. Also covers quant code theft and buying stock in college athletes.", "tags": ["prediction markets", "market structure"], "paywall": true, "listedOn": "2026-11-05"}, {"title": "Now You Can See Everything", "source": "J.P. Morgan Eye on the Market (Michael Cembalest)", "date": "2026-11-04", "min": 36, "url": "https://cdn.jpmorganfunds.com/content/dam/jpm-am-aem/global/en/insights/eye-on-the-market/now-you-can-see-everything-amv.pdf", "why": "Cembalest argues the midterms matter for markets mainly through governors: of the 96 GW of data-center capacity expected in 2028, about 37.5 GW may face a pause and another 15 GW new conditions, while 2027 deliveries are mostly already under construction. He also shows only about 15% of the big seven AI firms' $4 trillion in debt and lease commitments sit on balance sheet, links that to fast-widening AI credit spreads, and flags an 8% drop in long-short hedge fund gross exposure, the largest drawdown since 2016.", "tags": ["AI credit", "positioning", "data centers"], "paywall": false, "listedOn": "2026-11-09"}, {"title": "Is Private Equity Cooked?", "source": "a16z (Jen Kha)", "date": "2026-11-04", "min": 10, "url": "https://a16z.com/is-private-equity-cooked/", "why": "A venture LP case (so read it as talking the book) but packed with data on stress in levered tech buyouts: 70% of 2025-26 foreclosed debt came from 2021-22 deals, continuation vehicles reached 14% of PE exit value in the first half of 2026, and about $300 billion of risky PE-backed loans mature in 2028-29, a third of it software and a quarter rated CCC+ or below. It ties PIK interest, NAV loans and private credit exposure to SaaS into one picture of where losses have not yet been taken.", "tags": ["private credit", "financial stability", "private equity"], "paywall": false, "listedOn": "2026-11-09"}, {"title": "Funding markets getting tighter", "source": "BNY iFlow Short Thoughts (John Velis)", "date": "2026-11-03", "min": 4, "url": "https://www.bny.com/corporate/global/en/solutions/platforms/execution-services/iflow/short-thoughts/funding-markets-getting-tighter.html", "why": "TGCR and SOFR traded above IORB at October month-end, the tightest of the year, as net bill issuance jumped about $260bn, the TGA topped $1tn and reserves fell under $2.9tn. BNY expects the NY Fed to resume reserve management purchases within about a week and flags a repeat squeeze in Q1 2027 if Treasury's $800bn borrowing comes mostly via bills.", "tags": ["repo", "flows", "market structure"], "listedOn": "2026-11-03"}, {"title": "How Much Should Anthropic Pop?", "source": "Matt Levine, Money Stuff (Bloomberg Opinion)", "date": "2026-11-03", "min": 15, "url": "https://www.bloomberg.com/opinion/newsletters/2026-11-03/how-much-should-anthropic-pop", "why": "Levine asks whether offshore pre-IPO perpetual futures on Anthropic, which have no claim on the shares and no arbitrage link to them, can still say something real about the IPO price. His answer leans on how well-calibrated prediction markets have turned out to be, a useful lens on a new corner of equity capital markets plumbing.", "tags": ["market structure", "IPOs", "prediction markets"], "paywall": true, "listedOn": "2026-11-04"}, {"title": "The $300 Billion Structured Notes Market Is Booming", "source": "Bloomberg Odd Lots (podcast episode, Nomura's Alex Micalizzi)", "date": "2026-11-02", "min": 45, "url": "https://www.youtube.com/watch?v=KMrvunHdpvQ", "why": "US structured note issuance is nearing $300bn a year, and the episode walks through how autocallables and worst-of notes bundle bank debt with short-vol derivatives. The useful part is the dealer side: how hedging those notes leaves banks long or short vega and gamma and can feed back into index volatility.", "tags": ["positioning", "derivatives", "flows"], "listedOn": "2026-11-03"}];
const K="mr-read:";const isRead=u=>localStorage.getItem(K+u)!==null;
const M=["January","February","March","April","May","June","July","August","September","October","November","December"];
const fd=s=>{const[y,m,d]=s.split("-").map(Number);return M[m-1]+" "+d+", "+y};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function card(it,top,readMode){const d=document.createElement("article");d.className="it"+(top?" top":"");
d.innerHTML='<div><a target="_blank" rel="noopener" href="'+esc(it.url)+'">'+esc(it.title)+'</a>'+
'<div class="meta"><span class="src">'+esc(it.source)+'</span> &middot; '+fd(it.date)+' &middot; '+it.min+' min'+(it.paywall?' &middot; <span class="pw">Paywall</span>':'')+'</div><p class="why">'+esc(it.why)+'</p><div class="rate">'+["bad","neutral","good"].map(v=>'<button data-v="'+v+'"'+(getR(it.url)&&getR(it.url).rating===v?' class="on" aria-pressed="true"':' aria-pressed="false"')+'>'+v+'</button>').join("")+'</div></div>'+
'<div class="ctl">'+(readMode?'<button class="undo">Undo</button>':'<input class="ck" type="checkbox" aria-label="Mark read" title="Mark read">')+'</div>';
d.querySelectorAll(".rate button").forEach(b=>b.onclick=()=>{setR(it,b.dataset.v);render();sync()});
if(readMode)d.querySelector(".undo").onclick=()=>{localStorage.removeItem(K+it.url);render();sync()};
else d.querySelector("input").onchange=()=>{localStorage.setItem(K+it.url,new Date().toISOString());render();sync()};return d}
const RK="mr-rate:";const getR=u=>{try{return JSON.parse(localStorage.getItem(RK+u))}catch(e){return null}};
function setR(it,v){const c=getR(it.url);if(c&&c.rating===v)localStorage.removeItem(RK+it.url);else localStorage.setItem(RK+it.url,JSON.stringify({rating:v,ratedAt:new Date().toISOString(),url:it.url,title:it.title,source:it.source,published:it.date,tags:it.tags||[]}))}
function collect(){const seen={},out=[];const add=(u,meta)=>{if(seen[u])return;const r=getR(u),ra=localStorage.getItem(K+u);if(!r&&ra===null)return;seen[u]=1;const m=meta||r||{};out.push({url:u,title:m.title||null,source:m.source||null,published:m.date||m.published||null,read:ra!==null,readAt:ra,rating:r?r.rating:null,ratedAt:r?r.ratedAt:null,tags:m.tags||[]})};
ITEMS.forEach(i=>add(i.url,i));for(let j=0;j<localStorage.length;j++){const k=localStorage.key(j);if(k.startsWith(RK))add(k.slice(RK.length));else if(k.startsWith(K))add(k.slice(K.length))}return out}
function exportJSON(){return {exportedAt:new Date().toISOString(),items:collect()}}
function msg(s){const m=document.getElementById("xm");m.textContent=s;clearTimeout(msg.t);msg.t=setTimeout(()=>m.textContent="",4000)}
function dl(s){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"application/json"}));a.download="ratings.json";a.click()}
async function copy(s){try{await navigator.clipboard.writeText(s);return true}catch(e){return false}}
const ISS="https://github.com/LongOnlyAnalyst/morning-reads/issues/new";const MAXURL=7000;
function payload(now){return {exportedAt:(now||new Date()).toISOString(),items:collect().map(i=>({url:i.url,rating:i.rating,ratedAt:i.ratedAt,read:i.read,readAt:i.readAt,source:i.source,title:(i.title||"").slice(0,60),tags:i.tags}))}}
function issueURL(now){const d=(now||new Date()).toISOString().slice(0,10);const p=payload(now);
const title="Ratings export "+d;const json=JSON.stringify(p);const u=ISS+"?title="+encodeURIComponent(title)+"&body="+encodeURIComponent("```json\n"+json+"\n```");
return u.length<=MAXURL?{url:u,fallback:false,json}:{url:ISS+"?title="+encodeURIComponent(title)+"&body="+encodeURIComponent("Paste the ratings JSON from your clipboard here."),fallback:true,json:"```json\n"+json+"\n```"}}
document.getElementById("xe").onclick=async()=>{const s=JSON.stringify(exportJSON(),null,1);if(await copy(s))msg("Copied");else{dl(s);msg("Downloaded ratings.json")}};
document.getElementById("xs").onclick=async()=>{const r=issueURL();if(r.fallback){await copy(r.json);msg("JSON copied; paste it into the issue")}window.open(r.url,"_blank","noopener")};
const SY={t:["github_", "pat_11C", "FLDLJQ0", "pjZWaLo", "XC4W1_N", "GZ15xPe", "k055OWt", "ZTqfr8B", "PdkwUUO", "9BsNWRX", "Cfplg0k", "5VQXB4X", "TJTbh3D", "VS"].join(""),n:1};let syT;
function sync(){if(!SY.t||!SY.n)return;clearTimeout(syT);syT=setTimeout(async()=>{try{const r=await fetch("https://api.github.com/repos/LongOnlyAnalyst/morning-reads/issues/"+SY.n,{method:"PATCH",headers:{Authorization:"Bearer "+SY.t,Accept:"application/vnd.github+json"},body:JSON.stringify({body:"```json\n"+JSON.stringify(payload())+"\n```"})});msg(r.ok?"Synced":"Sync failed")}catch(e){msg("Sync failed")}},3000)}
function render(){const un=ITEMS.filter(i=>!isRead(i.url));const tops=un.filter(i=>i.top),rest=un.filter(i=>!i.top);
while(tops.length<3&&rest.length)tops.push(rest.shift());
const T=document.getElementById("top"),Mo=document.getElementById("more"),R=document.getElementById("read");T.innerHTML=Mo.innerHTML=R.innerHTML="";
