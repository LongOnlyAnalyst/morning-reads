<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Morning Reads</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon.ico" sizes="any"><meta name="theme-color" content="#141311">
<style>
:root{--bg:#141311;--tx:#ece7dd;--sub:#b9b2a6;--mut:#857e72;--line:#2c2924;--acc:#c2a36b}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.6 "Iowan Old Style","Charter","Bitstream Charter",Georgia,"Times New Roman",serif;-webkit-font-smoothing:antialiased}
.sans,.meta,.tabs,.kick,.upd,h2{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Arial,sans-serif}
main{max-width:720px;margin:0 auto;padding:72px 28px 96px}
header{border-bottom:1px solid var(--line);padding-bottom:22px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
h1{margin:0;font-weight:400;font-size:2.6rem;letter-spacing:-.01em;line-height:1.1}
.upd{color:var(--mut);font-size:.78rem;letter-spacing:.02em;margin-top:10px}
.tabs{display:flex;gap:22px;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.tabs button{background:none;border:0;padding:0 0 3px;color:var(--mut);cursor:pointer;font:inherit;letter-spacing:inherit;border-bottom:1px solid transparent}
.tabs button.on{color:var(--tx);border-bottom-color:var(--acc)}
h2{font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin:56px 0 0}
.it{display:grid;grid-template-columns:1fr auto;gap:0 28px;padding:28px 0;border-bottom:1px solid var(--line)}
.it a{color:var(--tx);text-decoration:none;font-size:1.32rem;line-height:1.3;font-weight:400}
.it.top a{font-size:1.6rem;line-height:1.25}
.it a:hover{color:var(--acc)}
.meta{color:var(--mut);font-size:.78rem;letter-spacing:.02em;margin:10px 0 12px}
.meta .src{color:var(--sub)}.pw{color:var(--acc)}
.why{margin:0;color:var(--sub);font-size:1rem;line-height:1.62}
.ctl{padding-top:6px}
.ck{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:1px solid var(--mut);border-radius:2px;margin:0;cursor:pointer;background:none;display:block}
.ck:hover{border-color:var(--acc)}.ck:checked{background:var(--acc);border-color:var(--acc)}
.undo{background:none;border:0;border-bottom:1px solid var(--mut);color:var(--sub);padding:0;cursor:pointer;font:500 .75rem/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.undo:hover{color:var(--acc);border-color:var(--acc)}
.rate{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Arial,sans-serif;font-size:.72rem;letter-spacing:.06em;text-transform:lowercase;margin-top:12px;display:flex;gap:16px}
.rate button,.xp button{background:none;border:0;padding:0 0 2px;color:var(--mut);cursor:pointer;font:inherit;letter-spacing:inherit;border-bottom:1px solid transparent}
.rate button:hover,.xp button:hover{color:var(--sub)}.rate button.on{color:var(--acc);border-bottom-color:var(--acc)}
.xp{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Arial,sans-serif;font-size:.72rem;letter-spacing:.04em;color:var(--mut);display:flex;gap:18px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.xp .msg{color:var(--sub)}
.empty{color:var(--mut);padding:28px 0;margin:0;font-style:italic}
@media(max-width:560px){main{padding:40px 20px 72px}h1{font-size:2rem}.it.top a{font-size:1.32rem}.it a{font-size:1.16rem}.it{gap:0 18px;padding:24px 0}h2{margin-top:44px}}
</style></head><body><main>

</main><script>
const ITEMS=[{"title": "The Individual Exception", "source": "Stratechery (Ben Thompson; free article)", "date": "2026-11-24", "min": 13, "url": "https://stratechery.com/2026/the-individual-exception/", "why": "Thompson uses Jensen Huang's reinstatement, which added nearly $1 trillion to Nvidia's market cap, to argue that AI is shifting value from managerial bureaucracies to singular individuals, with market cap per employee at the top firms rising steeply since AT&T in the 1950s. It is a framework for why key-person value and headcount deflation may matter more for AI-era valuations than capex totals.", "tags": ["AI", "corporate governance", "valuation"], "paywall": false, "top": true, "listedOn": "2026-11-24"}, {"title": "Owning the road, not paying the toll: how Europe can keep the returns from AI", "source": "Bruegel Working Paper 32/2026 (Revoltella, Brasili, Feás)", "date": "2026-11-24", "min": 45, "url": "https://www.bruegel.org/working-paper/owning-road-not-paying-toll-how-europe-can-keep-returns-ai", "why": "Using Eurostat trade data, the paper maps the AI supply chain in four layers and finds the EU's AI-goods trade balance has swung to a €42 billion deficit, with data-centre infrastructure flipping from a €6 billion surplus in 2015 to an €18 billion deficit in 2025. The one bright spot is chipmaking equipment (ASML, Zeiss), where the surplus grew to €27 billion, which frames where European AI rents are likely to accrue.", "tags": ["AI", "trade", "Europe"], "paywall": false, "top": true, "listedOn": "2026-11-24"}, {"title": "When Is Monetary Policy Transmission Strongest?", "source": "San Francisco Fed Economic Letter 2026-34 (Rami Najjar, Adam Shapiro)", "date": "2026-11-23", "min": 8, "url": "https://www.frbsf.org/research-and-insights/publications/economic-letter/2026/11/when-is-monetary-policy-transmission-strongest/", "why": "Using high-frequency FOMC surprises, the authors find that policy shocks pass through to longer-horizon Treasury forward rates mainly when inflation is demand-driven, consistent with the Fed responding about four times more to demand than supply inflation. With supply-driven pressures back, Fed surprises should move the long end less than in past cycles.", "tags": ["rates", "monetary policy"], "paywall": false, "top": true, "listedOn": "2026-11-24"}, {"title": "When productivity booms, do interest rates rise?", "source": "Federal Reserve Board FEDS Notes (Lepetit, Miller)", "date": "2026-11-20", "min": 12, "url": "https://www.federalreserve.gov/econres/notes/feds-notes/when-productivity-booms-do-interest-rates-rise-20261120.html", "why": "Against textbook theory, a VAR with anticipated TFP-growth shocks finds that expected productivity booms lower both the 10-year Treasury yield and a common r* proxy, mainly because the term premium falls by more than short rates rise. Applied to the post-2022 period, the authors conclude AI-driven productivity optimism cannot explain the surge in long yields, pushing the explanation toward other factors such as term premium and fiscal supply.", "tags": ["rates", "AI", "productivity"], "paywall": false, "listedOn": "2026-11-22"}, {"title": "The return of inflation: More bank profits, more central bank losses", "source": "VoxEU/CEPR (Paul De Grauwe, Yuemei Ji)", "date": "2026-11-20", "min": 5, "url": "https://cepr.org/voxeu/columns/return-inflation-more-bank-profits-more-central-bank-losses", "why": "Paying interest on about €2 trillion of reserves means each ECB hike transfers income to banks, lifting euro-area bank ROE toward 10% while the Eurosystem ran €64-69 billion of losses; a 3-4% deposit rate could restore €60-80 billion a year in transfers. The authors argue raising unremunerated minimum reserves from 1% to 2% would cut the subsidy without changing operating procedures.", "tags": ["rates", "banks", "central banks"], "paywall": false, "listedOn": "2026-11-23"}, {"title": "From power plays to price pressures: the energy transition and inflation", "source": "Bank of England, Bank Underground (Shin, Kyriakopoulou, Perers Cook)", "date": "2026-11-19", "min": 8, "url": "https://bankunderground.co.uk/2026/11/19/from-power-plays-to-price-pressures-the-energy-transition-and-inflation/", "why": "BoE staff show electricity now outweighs gas and petrol in the UK CPI basket, and that while the spot gas-power price correlation has collapsed since 2022, the futures correlation is still near 1, so gas shocks still reach bills. They flag grid supply chains (transformers, cables, critical minerals) shared with data centres as a more persistent inflation source.", "tags": ["energy", "inflation"], "paywall": false, "listedOn": "2026-11-24"}, {"title": "This Is The Problem With AI's Most Bullish Chart", "source": "Bloomberg Odd Lots (Stanley Lee, Paul Kedrosky)", "date": "2026-11-19", "min": 70, "url": "https://omny.fm/shows/odd-lots/this-is-the-problem-with-ais-most-bullish-chart", "why": "Liquid Compute's Stanley Lee argues rising GPU rental rates partly reflect a financing squeeze, with mid-market neoclouds unable to get cheap term loans and pushed into a thin, volatile spot market, so higher rents can signal credit stress rather than healthy demand. Paul Kedrosky then asks whether up-and-to-the-right usage charts actually prove the AI capex pays back, timely in the week of the Anthropic IPO (about 70-minute episode, free audio).", "tags": ["AI credit", "compute", "positioning"], "paywall": false, "listedOn": "2026-11-22"}, {"title": "Higher fuel prices seep into core inflation", "source": "Dallas Fed Economics (Chudik, Kilian, Zhou)", "date": "2026-11-19", "min": 5, "url": "https://www.dallasfed.org/research/economics/2026/1119", "why": "Using a structural VAR plus daily-frequency estimators across 149 PCE components, the authors find this year's fuel shock, led by record diesel, added 20 to 60 basis points to 12-month core PCE inflation as of September. If fuel prices simply hold, that contribution fades by about 30 basis points by end-2027, a useful anchor for how much of sticky core is energy pass-through versus something the Fed has to fight.", "tags": ["inflation", "energy", "rates"], "paywall": false, "listedOn": "2026-11-20"}, {"title": "How the Midterm Results Could Affect Data Center Growth and Electricity Prices: Q&A", "source": "Columbia Center on Global Energy Policy (Douglas Arent, Vivek Shastry)", "date": "2026-11-19", "min": 7, "url": "https://www.energypolicy.columbia.edu/how-the-midterm-results-could-affect-data-center-growth-and-electricity-prices-qa/", "why": "Five states that flipped governors (Texas, Georgia, Ohio, Nevada, Iowa) hold about 142 GW of announced data-center demand, and the authors estimate pauses could hit up to 50 GW over two to three years, with 46 of 47 local ballot measures favoring limits. It also explains why 'pay their own way' tariffs miss the wholesale capacity and energy price channel, and that behind-the-meter gas costs $101-107/MWh versus an $86 industrial average.", "tags": ["AI capex", "power", "policy"], "paywall": false, "listedOn": "2026-11-23"}, {"title": "Anthropic's compute spending is increasing by 4x per year, outpacing OpenAI's 3x", "source": "Epoch AI Data Insight (Josh You)", "date": "2026-11-18", "min": 4, "url": "https://epoch.ai/data-insights/anthropic-openai-compute-spend-growth", "why": "Using Anthropic's S-1/A, Epoch shows compute and infrastructure spend rising from $433 million in 2023 to nearly $10 billion in Q3 2026 (about $40 billion annualized), versus roughly 3x a year at OpenAI. It also flags $447.5 billion of contracted compute commitments through 2030, only about another doubling from today's run rate, which suggests the 4x pace has to slow and matters for whoever is financing the capacity.", "tags": ["AI", "compute", "AI credit"], "paywall": false, "listedOn": "2026-11-22"}, {"title": "Financial Stability Review, November 2026", "source": "European Central Bank (Financial Stability Review)", "date": "2026-11-18", "min": 145, "url": "https://www.ecb.europa.eu/press/financial-stability-publications/fsr/html/ecb.fsr202611~e03b919d36.en.html", "why": "The ECB's twice-yearly risk map says AI valuations rest on very ambitious earnings expectations while AI firms keep adding debt and circular financing makes real demand hard to gauge, with banks exposed mainly through their links to non-banks. Skip to Box 3 (debt financing of AI), Box 4 (big tech in the euro bond market), Box 6 (synthetic risk transfers) and Box 7 (hedge funds in sovereign repo) for the parts that matter most to AI credit and positioning; the full report is long.", "tags": ["financial stability", "AI credit", "non-banks"], "paywall": false, "listedOn": "2026-11-19"}, {"title": "Clean Investment Monitor: US Q3 2026 Update", "source": "Rhodium Group / MIT CEEPR", "date": "2026-11-18", "min": 6, "url": "https://rhg.com/research/clean-investment-monitor-us-q3-2026-update/", "why": "US clean energy and transport investment fell to $59 billion in Q3, down 22% year over year and the fourth straight annual decline, with battery manufacturing at its lowest since 2022 and wind down 40%. Utility-scale solar and storage held at $18 billion, so the drop is concentrated in EVs, batteries and wind rather than grid-scale power.", "tags": ["energy", "capex"], "paywall": false, "listedOn": "2026-11-23"}, {"title": "The tax code already has an AI policy: It pays companies to borrow", "source": "Brookings, Urban-Brookings Tax Policy Center (Brosy, Patel)", "date": "2026-11-17", "min": 6, "url": "https://www.brookings.edu/articles/the-tax-code-already-has-an-ai-policy-it-pays-companies-to-borrow/", "why": "Full expensing plus interest deductibility puts the marginal effective tax rate on debt-financed computing equipment at -46% in 2026, up from -14% before OBBBA made expensing permanent, while hyperscaler long-term debt doubled from $232 billion to $486 billion between 2024 and mid-2026. It adds a policy angle to the AI-credit story: the subsidy tilts the buildout toward debt and off-balance-sheet vehicles like Meta's $27 billion Hyperion JV, and the interest cap likely does not bind for these firms.", "tags": ["AI credit", "fiscal", "tax"], "paywall": false, "listedOn": "2026-11-22"}, {"title": "Consumers Can Handle a Stock Crash", "source": "PIIE RealTime Economics (Jason Furman)", "date": "2026-11-17", "min": 13, "url": "https://www.piie.com/blogs/realtime-economics/2026/consumers-can-handle-stock-crash", "why": "Third in Furman's series on what an AI-bubble burst would do to the economy: households have spent only about 1 cent per dollar of recent stock gains, so a 25% market fall would cut consumption about 0.8% and GDP growth about 0.6 point over a year in his FRB/US runs. He also shows 2001 was the least consumer-driven postwar recession, which argues the wealth-effect channel is smaller than the market narrative assumes.", "tags": ["AI bubble", "macro", "financial stability"], "paywall": false, "listedOn": "2026-11-20"}, {"title": "Does the Stock Market Stigmatize Banks that Borrow from the Fed?", "source": "NY Fed Liberty Street Economics (Fischl-Lanzoni, Hiti, Sarkar)", "date": "2026-11-17", "min": 6, "url": "https://libertystreeteconomics.newyorkfed.org/2026/11/does-the-stock-market-stigmatize-banks-that-borrow-from-the-fed/", "why": "Using bank stock betas to uninsured deposits, unrealized losses, cash and capital during March 2023, the authors find investors grew more sensitive to a bank's weaknesses after its first Discount Window loan but not after its first BTFP loan. It is direct evidence on why lender-of-last-resort design (face-value collateral, a new facility with no history) decides whether banks actually use the backstop in a run.", "tags": ["financial stability", "banks", "Fed facilities"], "paywall": false, "listedOn": "2026-11-19"}, {"title": "The Agents Will Trade the Bonds", "source": "Matt Levine, Money Stuff (Bloomberg Opinion)", "date": "2026-11-17", "min": 15, "url": "https://www.bloomberg.com/opinion/newsletters/2026-11-17/the-agents-will-trade-the-bonds", "why": "Levine uses the BNY and Microsoft pilot, in which their AI agents haggled over the price of a Treasury bill under BNY's Agentic Negotiation Protocol while human traders approved and booked the trade, to ask what bond-market intermediation looks like when bots do the search and back-and-forth inside human-set limits. It is a short, sharp read on where dealer and buy-side market structure could go; only the opening is readable without a subscription.", "tags": ["market structure", "AI", "rates"], "paywall": true, "listedOn": "2026-11-18"}, {"title": "Clouds of Credit: Mapping the Financial Web Behind AI Compute", "source": "NBER Working Paper 36032 (Van Nieuwerburgh, Su)", "date": "2026-11-16", "min": 77, "url": "https://www.nber.org/papers/w36032", "why": "Maps the network of debt, leases and non-recourse project finance behind the AI compute buildout and calibrates a model in which debt funds nearly 60% of the coming expansion and firms overinvest relative to the social optimum. In a low-productivity state losses reach $16.8 trillion with 40% loss-given-default on debt, and contractual spillovers among the key firms account for about 30% of private losses; read the abstract and the network section if short on time.", "tags": ["AI credit", "financial stability", "private credit"], "paywall": false, "listedOn": "2026-11-20"}, {"title": "The Credit Market Lens: In a Slower AI Buildout, Who Captures the Scarcity Premium?", "source": "PIMCO (Lotfi Karoui, The Credit Market Lens)", "date": "2026-11-16", "min": 6, "url": "https://www.pimco.com/us/en/insights/the-credit-market-lens-in-a-slower-ai-buildout-who-captures-the-scarcity-premium", "why": "Karoui argues post-midterm permitting friction (about 45% of planned US data center capacity sits in states where restrictions could emerge, Texas a quarter of it) stretches the AI buildout rather than shrinking it, which slows issuance and should help existing hyperscaler-tenanted data center bonds tighten versus their tenants' senior debt. For leveraged infrastructure providers he says the scarcity premium may be outweighed by recontracting risk and GPU residual values, a useful split for anyone sizing AI credit exposure.", "tags": ["AI credit", "credit", "flows"], "paywall": false, "listedOn": "2026-11-18"}, {"title": "Connecting Stock Market to Labor Market During the AI Boom", "source": "San Francisco Fed Economic Letter 2026-33 (Kevin Lansing, Federico C. Nucera)", "date": "2026-11-16", "min": 9, "url": "https://www.frbsf.org/research-and-insights/publications/economic-letter/2026/11/connecting-stock-market-to-labor-market-during-ai-boom/", "why": "With the CAPE ratio at 40.5 in the third quarter, second only to the 2000 peak, the authors regress it on r-star, potential growth, the noncyclical unemployment rate and macro uncertainty and explain 89 percent of its variance since 1961. The noncyclical unemployment rate does most of the work and accounts for most of the post-2022 AI run-up, so a model without it implies much lower valuations, which is a useful frame for judging how fragile current multiples are.", "tags": ["AI", "valuations", "macro"], "paywall": false, "listedOn": "2026-11-17"}, {"title": "Decapit-ai-tion", "source": "Citadel Securities Some Macro Thoughts (Nohshad Shah)", "date": "2026-11-14", "min": 5, "url": "https://www.citadelsecurities.com/news-and-insights/macro-thoughts/decapit-ai-tion/", "why": "Shah separates demand for AI from the economics of producing it: CBRE data show North American data-centre supply up 33.7% with vacancy at 1.4% and 80% of new capacity preleased, which favors hyperscalers with operating compute as permitting and power tighten. He also weighs what Jensen Huang's exit means for NVIDIA's risk appetite and customer financing, and argues hot Q3 data keep a December hike live unless AI capex stalls.", "tags": ["AI", "positioning", "rates"], "paywall": false, "listedOn": "2026-11-20"}];
const K="mr-read:";const isRead=u=>localStorage.getItem(K+u)!==null;
const M=["January","February","March","April","May","June","July","August","September","October","November","December"];
const fd=s=>{const[y,m,d]=s.split("-").map(Number);return M[m-1]+" "+d+", "+y};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function card(it,top,readMode){const d=document.createElement("article");d.className="it"+(top?" top":"");
d.innerHTML='<div><a target="_blank" rel="noopener" href="'+esc(it.url)+'">'+esc(it.title)+'</a>'+
'<div class="meta"><span class="src">'+esc(it.source)+'</span> &middot; '+fd(it.date)+' &middot; '+it.min+' min'+(it.paywall?' &middot; <span class="pw">Paywall</span>':'')+'</div><p class="why">'+esc(it.why)+'</p><div class="rate">'+["bad","neutral","good"].map(v=>'<button data-v="'+v+'"'+(getR(it.url)&&getR(it.url).rating===v?' class="on" aria-pressed="true"':' aria-pressed="false"')+'>'+v+'</button>').join("")+'</div></div>'+
'<div class="ctl">'+(readMode?'<button class="undo">Undo</button>':'<input class="ck" type="checkbox" aria-label="Mark read" title="Mark read">')+'</div>';
d.querySelectorAll(".rate button").forEach(b=>b.onclick=()=>{setR(it,b.dataset.v);render();sync()});
if(readMode)d.querySelector(".undo").onclick=()=>{localStorage.removeItem(K+it.url);render();sync()};
else d.querySelector("input").onchange=()=>{localStorage.setItem(K+it.url,new Date().toISOString());render();sync()};return d}
const RK="mr-rate:";const getR=u=>{try{return JSON.parse(localStorage.getItem(RK+u))}catch(e){return null}};
function setR(it,v){const c=getR(it.url);if(c&&c.rating===v)localStorage.removeItem(RK+it.url);else localStorage.setItem(RK+it.url,JSON.stringify({rating:v,ratedAt:new Date().toISOString(),url:it.url,title:it.title,source:it.source,published:it.date,tags:it.tags||[]}))}
function collect(){const seen={},out=[];const add=(u,meta)=>{if(seen[u])return;const r=getR(u),ra=localStorage.getItem(K+u);if(!r&&ra===null)return;seen[u]=1;const m=meta||r||{};out.push({url:u,title:m.title||null,source:m.source||null,published:m.date||m.published||null,read:ra!==null,readAt:ra,rating:r?r.rating:null,ratedAt:r?r.ratedAt:null,tags:m.tags||[]})};
ITEMS.forEach(i=>add(i.url,i));for(let j=0;j<localStorage.length;j++){const k=localStorage.key(j);if(k.startsWith(RK))add(k.slice(RK.length));else if(k.startsWith(K))add(k.slice(K.length))}return out}
function exportJSON(){return {exportedAt:new Date().toISOString(),items:collect()}}
function msg(s){const m=document.getElementById("xm");m.textContent=s;clearTimeout(msg.t);msg.t=setTimeout(()=>m.textContent="",4000)}
function dl(s){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"application/json"}));a.download="ratings.json";a.click()}
async function copy(s){try{await navigator.clipboard.writeText(s);return true}catch(e){return false}}
const ISS="https://github.com/LongOnlyAnalyst/morning-reads/issues/new";const MAXURL=7000;
function payload(now){return {exportedAt:(now||new Date()).toISOString(),items:collect().map(i=>({url:i.url,rating:i.rating,ratedAt:i.ratedAt,read:i.read,readAt:i.readAt,source:i.source,title:(i.title||"").slice(0,60),tags:i.tags}))}}
function issueURL(now){const d=(now||new Date()).toISOString().slice(0,10);const p=payload(now);
const title="Ratings export "+d;const json=JSON.stringify(p);const u=ISS+"?title="+encodeURIComponent(title)+"&body="+encodeURIComponent("```json\n"+json+"\n```");
return u.length<=MAXURL?{url:u,fallback:false,json}:{url:ISS+"?title="+encodeURIComponent(title)+"&body="+encodeURIComponent("Paste the ratings JSON from your clipboard here."),fallback:true,json:"```json\n"+json+"\n```"}}
document.getElementById("xe").onclick=async()=>{const s=JSON.stringify(exportJSON(),null,1);if(await copy(s))msg("Copied");else{dl(s);msg("Downloaded ratings.json")}};
document.getElementById("xs").onclick=async()=>{const r=issueURL();if(r.fallback){await copy(r.json);msg("JSON copied; paste it into the issue")}window.open(r.url,"_blank","noopener")};
const SY={t:["github_", "pat_11C", "FLDLJQ0", "pjZWaLo", "XC4W1_N", "GZ15xPe", "k055OWt", "ZTqfr8B", "PdkwUUO", "9BsNWRX", "Cfplg0k", "5VQXB4X", "TJTbh3D", "VS"].join(""),n:1};let syT;
function sync(){if(!SY.t||!SY.n)return;clearTimeout(syT);syT=setTimeout(async()=>{try{const r=await fetch("https://api.github.com/repos/LongOnlyAnalyst/morning-reads/issues/"+SY.n,{method:"PATCH",headers:{Authorization:"Bearer "+SY.t,Accept:"application/vnd.github+json"},body:JSON.stringify({body:"```json\n"+JSON.stringify(payload())+"\n```"})});msg(r.ok?"Synced":"Sync failed")}catch(e){msg("Sync failed")}},3000)}
function render(){const un=ITEMS.filter(i=>!isRead(i.url));const tops=un.filter(i=>i.top),rest=un.filter(i=>!i.top);
while(tops.length<3&&rest.length)tops.push(rest.shift());
const T=document.getElementById("top"),Mo=document.getElementById("more"),R=document.getElementById("read");T.innerHTML=Mo.innerHTML=R.innerHTML="";
